# Prod counterpart of docker-compose.observability.yml, run on the SEPARATE, smaller droplet deploy/terraform provisions
# (digitalocean_droplet.observability), so a metrics or logs spike cannot compete with the app for CPU and memory, and losing this box never touches
# the app's data. Deployed by .github/workflows/deploy.yml's `deploy-observability` job, independently of the app droplet.
#
# Unlike the dev file, nothing bridges through `host.docker.internal`: the app droplet reaches IN, over the two ports deploy/terraform/main.tf's
# digitalocean_firewall.observability scopes to the VPC's CIDR: OTLP (4318, from its otel-collector-agent) and Loki's push (3100, from its promtail).
# docker-compose.prod.yml has the other half of the topology.
#
# Grafana is the only service meant for a browser (behind `caddy`, with a real login via GRAFANA_ADMIN_PASSWORD, not the dev file's anonymous
# viewer). Prometheus, Alertmanager and Loki publish no host port beyond the two above.
name: agent-core-observability

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./observability/otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4318:4318"   # OTLP HTTP: what the app droplet's otel-collector-agent forwards to
    # No 4317 (gRPC) or 8889 on the host, unlike the dev file: the app droplet only speaks OTLP/HTTP, and 8889 (this collector's Prometheus
    # exporter) is scraped only by `prometheus` below, over the internal network.

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./observability/prometheus/prometheus.prod.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
    restart: unless-stopped
    depends_on:
      - otel-collector

  alertmanager:
    image: prom/alertmanager:latest
    restart: unless-stopped
    # alertmanager.PROD.yml, not the dev file's receiver-less config: with that one nothing is delivered and nothing says so (spec 008 A7).
    # Alertmanager does no environment expansion, so the webhook secret is written to the file the config reads (`api_url_file`) just before it
    # starts. `:?` makes `docker compose up` refuse to run without it: an observability stack that reaches no one should fail the deploy. `$$` is
    # compose's escape for the shell's `$VAR`.
    volumes:
      - ./observability/alertmanager/alertmanager.prod.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager:/alertmanager
    environment:
      ALERTMANAGER_SLACK_WEBHOOK_URL: ${ALERTMANAGER_SLACK_WEBHOOK_URL:?set ALERTMANAGER_SLACK_WEBHOOK_URL in this droplet's .env (see deploy/env/observability.prod.env.example) - without a receiver no alert is ever delivered}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        umask 077 &&
        printf '%s' "$$ALERTMANAGER_SLACK_WEBHOOK_URL" > /tmp/slack_webhook_url &&
        exec /bin/alertmanager
        --config.file=/etc/alertmanager/alertmanager.yml
        --storage.path=/alertmanager

  loki:
    image: grafana/loki:latest
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki-config.yaml"]
    volumes:
      - ./observability/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki:/loki
    ports:
      - "3100:3100"   # Loki push — what the app droplet's promtail pushes to

  # Continuous profiling (specs/022): the app droplet's api and workers push CPU profiles here over the VPC when PYROSCOPE_SERVER_ADDRESS is set in its
  # .env (deploy/env/prod.env.example), like OTLP and Loki; Grafana reads them through the Pyroscope datasource. No authentication, the same posture as
  # those two: the firewall scopes 4040 to the VPC (deploy/terraform digitalocean_firewall.observability) and profiles hold function names, never request
  # data. Flags and sizing: docker-compose.observability.yml.
  pyroscope:
    image: grafana/pyroscope:2.3.2@sha256:78c3b509f2ad98a6974b38c6f2135d5daf9597809532560e9ca29f9b43aa339e
    restart: unless-stopped
    command:
      - "-config.file=/etc/pyroscope/config.yaml"
      - "-architecture.storage=v1"
      - "-write-path=ingester"
      - "-compactor.blocks-retention-period=168h"
    init: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    read_only: true
    tmpfs:
      - /tmp:size=64m
    volumes:
      - pyroscope:/data
    ports:
      - "4040:4040"   # the app droplet's push; not routed by caddy

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      # No GF_AUTH_ANONYMOUS_ENABLED (unlike the dev file): this instance is reachable from the internet through `caddy`, so a login is required.
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana:/var/lib/grafana
    depends_on:
      - prometheus
      - loki

  # Reverse proxy and TLS in front of Grafana only, like docker-compose.prod.yml's `caddy` in front of `api`.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      OBS_SITE_ADDRESS: ${OBS_DOMAIN_NAME:-:80}
    volumes:
      - ./deploy/caddy/Caddyfile.observability:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - grafana

volumes:
  prometheus:
  alertmanager:
  loki:
  grafana:
  pyroscope:
  caddy_data:
  caddy_config:
