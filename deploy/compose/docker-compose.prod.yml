# Lean production stack for the DigitalOcean droplet deploy/terraform provisions (runbook: deploy/README.md). A smaller set than the dev stack:
# no Ollama (litellm-config.prod.yaml points at a hosted OpenAI-compatible endpoint), no Langfuse or open-webui, and no MinIO (object storage is
# DigitalOcean Spaces; the `minio` client talks to any S3-compatible endpoint, see MINIO_* in deploy/env/prod.env.example).
#
# The front door is the same as the development stack's (docker-compose.yml, profile `gateway`; specs/018 T069, pattern 98): Caddy terminates TLS on three real names
# and asks authlimit about every request; Casdoor issues the tokens; the API runs in identity mode and trusts only the identity authlimit signs. The
# routing is deploy/caddy/gateway.caddy, imported by both stacks' Caddyfiles. A domain is therefore REQUIRED: identity needs an https issuer.
#
# The Grafana/Prometheus/Loki/Alertmanager stack is NOT here: it runs on a separate, smaller droplet (docker-compose.observability.prod.yml) so a
# metrics or logs spike cannot compete with the app for CPU and memory. This file carries only the sidecars that feed it (node-exporter, cadvisor,
# otel-collector-agent, promtail, pgbouncer-exporter).
#
# Deployed by .github/workflows/deploy.yml: it builds and pushes the app image (root Dockerfile) and the ml-service image to GHCR, rsyncs this file,
# the Caddyfile, litellm-config.prod.yaml, postgres-init/ and observability/ to /opt/graph-agent-core, and runs
# `docker compose -f docker-compose.prod.yml pull && up -d` over SSH. The app services use `image:`, never `build:`, so the droplet pulls layers and
# never compiles onnxruntime's dependency chain. The droplet's .env is made once by hand (copy deploy/env/prod.env.example); CI never touches it.
name: graph-agent-core

# Workers bind no port, so the image's API HEALTHCHECK (a probe of :8000/health/ready) would report them `unhealthy` forever. Whether a pool is
# alive is the `WorkerUnreachable` alert's job (observability/prometheus/alerts.yml). A worker added without this inherits the probe.
x-worker-healthcheck: &worker-healthcheck
  disable: true

x-app-env: &app-env
  OPENAI_API_BASE: http://litellm:4000/v1
  # A SCOPED key, not the master: the master is gateway admin (it mints keys, reads every spend log, rewrites models, removes budgets) and cannot
  # carry a budget, so an app sending it has no gateway-side cap and a compromised container hands over the gateway. Mint LITELLM_APP_KEY once with
  # `python -m scripts.tools.litellm_key create` (deploy/README.md). The master-key fallback only keeps an existing deployment running until you do.
  OPENAI_API_KEY: ${LITELLM_APP_KEY:-${LITELLM_MASTER_KEY}}
  CHAT_MODEL: chat
  EMBED_MODEL: embed
  QDRANT_URL: http://qdrant:6333
  ML_SERVICE_URL: http://ml-service:80
  # Through PgBouncer, not Postgres: Postgres sees the pooler's pool size however many `--scale agent-worker=N` replicas run. LiteLLM connects directly (specs/022).
  CHECKPOINTER_DATABASE_URL: postgresql://langfuse:${POSTGRES_PASSWORD}@pgbouncer:6432/checkpointer
  APPDATA_DATABASE_URL: postgresql://langfuse:${POSTGRES_PASSWORD}@pgbouncer:6432/appdata
  REDIS_URL: redis://redis:6379
  # S3-compatible storage, DigitalOcean Spaces by default (no MinIO container here). A self-hosted MinIO works too: point these at it and set MINIO_SECURE=false.
  MINIO_ENDPOINT: ${MINIO_ENDPOINT}
  MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
  MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
  MINIO_BUCKET: ${MINIO_BUCKET}
  MINIO_SECURE: ${MINIO_SECURE:-true}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
  MAX_COST_USD_PER_TURN: ${MAX_COST_USD_PER_TURN:-0.50}
  MAX_COST_USD_PER_TENANT_PER_DAY: ${MAX_COST_USD_PER_TENANT_PER_DAY:-20.0}
  # Unset (empty) unless you opt in; each degrades as app/core/config.py documents: no Langfuse tracing, no crawl4ai or OpenSandbox tools, no Slack, no Telegram.
  LANGFUSE_HOST: ${LANGFUSE_HOST:-}
  LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
  LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
  SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
  # The local agent collector (`otel-collector-agent` below), which relays to the observability droplet over OTLP (observability/otel-collector/config.agent.yaml).
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector-agent:4318
  # The Pyroscope server on the observability droplet, over the VPC (http://<observability_private_ipv4>:4040). Blank = no profiling, the default until
  # it has been tried there (deploy/env/prod.env.example).
  PYROSCOPE_SERVER_ADDRESS: ${PYROSCOPE_SERVER_ADDRESS:-}
  CRAWL4AI_SERVER_URL: ${CRAWL4AI_SERVER_URL:-}
  CRAWL4AI_API_TOKEN: ${CRAWL4AI_API_TOKEN:-}
  SERPER_API_KEY: ${SERPER_API_KEY:-}
  WEB_SEARCH_MAX_RESULTS: ${WEB_SEARCH_MAX_RESULTS:-5}
  OPENSANDBOX_MCP_DOMAIN: ${OPENSANDBOX_MCP_DOMAIN:-}
  OPENSANDBOX_API_KEY: ${OPENSANDBOX_API_KEY:-}

# Runtime hardening for the images this repo builds (nothing here changes what the app does):
#   init                  a real PID 1: reaps the sandbox bridge's children and forwards SIGTERM, so `stop_grace_period` holds
#   no-new-privileges     no privilege gain through a setuid binary
#   cap_drop: ALL         the app runs as uid 1000 on a port above 1024: it needs no capability
#   read_only + tmpfs     the image filesystem is never written. /tmp and $HOME (libraries create dot-directories there: crawl4ai makes
#                         ~/.crawl4ai on import) are RAM, capped because tmpfs counts against the memory limit. ml-service keeps a named
#                         volume for its models, so it overrides `tmpfs`.
x-hardened: &hardened
  init: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  read_only: true
  tmpfs:
    - /tmp:size=128m
    - /home/appuser:size=64m,uid=1000,gid=1000

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    # Ceilings, not reservations: --cpus lets a container burst when the host has spare capacity, so these summing past this droplet's 4 cores is
    # not oversubscription at rest. They stop one runaway container from starving the rest. Starting points; revisit against the observability
    # droplet's dashboards (docker-compose.observability.prod.yml).
    cpus: "0.3"
    mem_limit: 768m
    # max_connections is Postgres's default, written down so a test can read the budget: the pooler may hold 2 x 18 server connections
    # (tests/core/test_compose_pooler.py keeps 2 x MAX_DB_CONNECTIONS + 30 <= this); LiteLLM and the admin tools get the rest.
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements", "-c", "max_connections=100"]
    environment:
      # The role stays `langfuse` so postgres-init/*.sql's `OWNER langfuse` runs unmodified (shared with the dev stack); only the password differs.
      # There is no `langfuse` database here, just the role.
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: appdata
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse"]
      interval: 10s
      timeout: 5s
      retries: 10

  # PgBouncer in front of the app's two databases (specs/022): the dev stack's image, settings and hardening (docker-compose.yml says why). No host
  # port. Postgres sees at most 2 x MAX_DB_CONNECTIONS from the app however many replicas run; LiteLLM connects directly.
  pgbouncer:
    image: edoburu/pgbouncer:v1.26.1-p0@sha256:488422e38cff912895d0d65d8963fcd306e6ac589a724398b6eb8e294e94d624
    restart: unless-stopped
    cpus: "0.2"
    mem_limit: 128m
    init: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    read_only: true
    tmpfs:
      - /etc/pgbouncer:size=1m,uid=70,gid=70,mode=0700
    environment:
      DATABASE_URLS: postgresql://langfuse:${POSTGRES_PASSWORD}@postgres:5432/appdata,postgresql://langfuse:${POSTGRES_PASSWORD}@postgres:5432/checkpointer
      LISTEN_PORT: "6432"
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      DEFAULT_POOL_SIZE: "15"
      RESERVE_POOL_SIZE: "3"
      RESERVE_POOL_TIMEOUT: "3"
      MAX_DB_CONNECTIONS: "18"
      MAX_CLIENT_CONN: "500"
      QUERY_WAIT_TIMEOUT: "30"
      IDLE_TRANSACTION_TIMEOUT: "60"
      IGNORE_STARTUP_PARAMETERS: extra_float_digits,options
      STATS_USERS: langfuse
      LOG_CONNECTIONS: "0"
      LOG_DISCONNECTIONS: "0"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 6432 -U langfuse -d appdata"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy

  # Scraped by `otel-collector-agent` (observability/otel-collector/config.agent.yaml) and relayed to the observability droplet, where the
  # PgBouncer alerts evaluate. No host port.
  pgbouncer-exporter:
    image: prometheuscommunity/pgbouncer-exporter:v0.12.1@sha256:30f31b6c2efdad3647f8182cc7c1a3a19e42bae5d17387694989f969371c230d
    restart: unless-stopped
    cpus: "0.1"
    mem_limit: 64m
    init: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    read_only: true
    environment:
      PGBOUNCER_EXPORTER_CONNECTION_STRING: postgres://langfuse:${POSTGRES_PASSWORD}@pgbouncer:6432/pgbouncer?sslmode=disable
    depends_on:
      pgbouncer:
        condition: service_healthy

  redis:
    image: redis/redis-stack-server:latest
    restart: unless-stopped
    cpus: "0.2"
    mem_limit: 256m
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    cpus: "0.3"
    mem_limit: 512m
    volumes:
      - qdrant:/qdrant/storage

  litellm:
    # Pinned by digest, the same as docker-compose.yml (a test checks); bump it with deploy/README.md ("Bumping the LiteLLM image").
    image: ghcr.io/berriai/litellm:main-stable@sha256:28b10a635296730007097390939b55f8696ece548530d4ddda3e31c708b4dc81
    restart: unless-stopped
    cpus: "0.3"
    mem_limit: 512m
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    volumes:
      - ./deploy/litellm/litellm-config.prod.yaml:/app/config.yaml:ro
    environment:
      LLM_API_BASE: ${LLM_API_BASE}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_CHAT_MODEL: ${LLM_CHAT_MODEL}
      # The middle tier (`chat-medium`). Unset = the same as `chat`, so the proxy always starts; see deploy/env/prod.env.example.
      LLM_MEDIUM_CHAT_MODEL: ${LLM_MEDIUM_CHAT_MODEL:-${LLM_CHAT_MODEL}}
      LLM_MEDIUM_API_BASE: ${LLM_MEDIUM_API_BASE:-${LLM_API_BASE}}
      LLM_MEDIUM_API_KEY: ${LLM_MEDIUM_API_KEY:-${LLM_API_KEY}}
      # The escalation alias (`chat-strong`). Unset = the same as `chat`, so the proxy always starts; see deploy/env/prod.env.example.
      LLM_STRONG_CHAT_MODEL: ${LLM_STRONG_CHAT_MODEL:-${LLM_CHAT_MODEL}}
      LLM_STRONG_API_BASE: ${LLM_STRONG_API_BASE:-${LLM_API_BASE}}
      LLM_STRONG_API_KEY: ${LLM_STRONG_API_KEY:-${LLM_API_KEY}}
      LLM_EMBED_MODEL: ${LLM_EMBED_MODEL}
      DATABASE_URL: postgresql://langfuse:${POSTGRES_PASSWORD}@postgres:5432/litellm
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      UI_USERNAME: ${LITELLM_UI_USERNAME}
      UI_PASSWORD: ${LITELLM_UI_PASSWORD}
      # No LANGFUSE_* (unlike the dev stack): there is no Langfuse container here, and litellm-config.prod.yaml's callbacks are trimmed to prometheus.
    depends_on:
      postgres:
        condition: service_healthy

  # Reranker, prompt-injection classifier and embeddings; the design is in docker-compose.yml's `ml-service`. Budgets are scaled down from the dev
  # defaults (RERANK_CPU_BUDGET=8, cpus 10) for a 4-vCPU droplet: 3 cores here, 1 left for postgres, redis, qdrant, litellm and the app. Raise both
  # together if you size the droplet up.
  ml-service:
    <<: *hardened
    tmpfs:
      - /tmp:size=128m  # the models live in the named volume below, not in tmpfs
    # Prebuilt in CI and pulled, not built on the droplet (compiling onnxruntime's dependency chain every deploy would be slow and compete for CPU).
    # ML_IMAGE is in .env; IMAGE_TAG comes from the deploy workflow (deploy/env/prod.env.example).
    image: ${ML_IMAGE}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    cpus: "3"
    mem_limit: 2g
    environment:
      RERANK_CPU_BUDGET: "2"
      GUARD_CPU_BUDGET: "1"
      # Which text models (services/ml-service/models.toml) to load. Measure memory first: it idles near 0.8 GiB with bge-small and peaked at 1.07 GiB under
      # load, against this file's 2g limit.
      ML_MODELS_ENABLED: ${ML_MODELS_ENABLED:-}
      ML_EMBED_MAX_ITEMS: ${ML_EMBED_MAX_ITEMS:-256}
      ML_EMBED_MAX_CHARS: ${ML_EMBED_MAX_CHARS:-8000}
    volumes:
      - ml-service:/home/appuser/.cache
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:80/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s

  # api, agent-worker and ingest-worker run ONE image (one build, three commands; the root Dockerfile's header says why), built in CI and pulled like
  # ml-service. APP_IMAGE is set once in .env, IMAGE_TAG per deploy by .github/workflows/deploy.yml.
  api:
    <<: *hardened
    image: ${APP_IMAGE}:${IMAGE_TAG:-latest}
    # The one role that takes uploads (up to 5 x 25 MB, app/adapters/inbound/api/routers/ingest.py): the multipart parser spools to /tmp before the handler runs, so
    # /tmp is a disk-backed volume (a tmpfs would fill RAM at the second large upload). Only $HOME is tmpfs.
    tmpfs:
      - /home/appuser:size=64m,uid=1000,gid=1000
    volumes:
      - /tmp
    restart: unless-stopped
    cpus: "0.5"
    mem_limit: 512m
    # Long enough for an in-flight SSE turn (POST /chat/stream/queued) to finish instead of being SIGKILLed on redeploy: uvicorn already drains on
    # SIGTERM; this gives it time.
    stop_grace_period: 60s
    # No `ports:`: a fixed host port cannot be shared across replicas, and Caddy's `dynamic a` upstream needs `--scale api=N`. To reach the API by hand,
    # `ssh` in and `docker compose exec api curl localhost:8000/health` (deploy/README.md).
    environment:
      <<: *app-env
      # Identity mode, written down rather than left to the default: the API trusts only the identity authlimit signs on a request it verified, and a
      # request that skips the door is a 401. NEVER `headers` here (any client could claim any tenant; the alert ApiHeaderAuthMode fires). The keys are
      # authlimit's, by its in-network name; the API answers 503 until they load.
      AUTH_MODE: identity
      AUTHLIMIT_KEYS_URL: http://authlimit:8080/internal/jwks.json
      # What the built-in page signs in against: the issuer, and this API's public address (the audience of the token it asks for). The same two
      # values authlimit is started with, derived from the same names below, so they cannot disagree.
      WEB_AUTH_ISSUER: https://${AUTH_DOMAIN:?set AUTH_DOMAIN in .env}
      WEB_AUTH_AUDIENCE: https://${API_DOMAIN:?set API_DOMAIN in .env}
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy

  agent-worker:
    <<: *hardened
    image: ${APP_IMAGE}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    cpus: "0.5"
    mem_limit: 768m
    stop_grace_period: 90s # let an in-flight agent turn (LLM calls, tool use) finish rather than being killed mid-turn
    command: ["python", "-m", "app.adapters.inbound.workers.agent_worker"]
    healthcheck: *worker-healthcheck
    environment:
      <<: *app-env
      # The domains this worker serves: comma-separated names or `all` (app/adapters/inbound/workers/agent_worker.py). Ecorp only by default; the others are demo domains.
      AGENT_WORKER_DOMAINS: ${AGENT_WORKER_DOMAINS:-ecorp}
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Scale when traffic warrants it (pattern 43): docker compose -f docker-compose.prod.yml up -d --scale agent-worker=3

  ingest-worker:
    <<: *hardened
    image: ${APP_IMAGE}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    cpus: "0.3"
    mem_limit: 768m
    stop_grace_period: 90s # let an in-flight document parse/embed job finish rather than being killed mid-job
    command: ["python", "-m", "app.adapters.inbound.workers.ingest_worker"]
    healthcheck: *worker-healthcheck
    environment: *app-env
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy

  # --- The front door (specs/018 T069, pattern 98): the same services, images and settings as the development stack's `gateway` profile (docker-compose.yml), with
  # the local names replaced by the three real ones and the passwords required instead of defaulted. ---

  # Casdoor's own Postgres: it migrates its schema on upgrade, so it does not share the app's (the dev stack does the same). Pinned by digest, like dev.
  casdoor-db:
    image: postgres:16-alpine@sha256:f4610795587492cd4fb887c2dc3de301b813278bb6f616992061141b5f15ac36
    restart: unless-stopped
    cpus: "0.1"
    mem_limit: 192m
    environment:
      POSTGRES_USER: casdoor
      POSTGRES_PASSWORD: ${CASDOOR_DB_PASSWORD:?set CASDOOR_DB_PASSWORD in .env}
      POSTGRES_DB: casdoor
    volumes:
      - casdoor-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U casdoor -d casdoor"]
      interval: 5s
      timeout: 3s
      retries: 10

  # The OAuth 2.1 authorization server: where people sign in and what issues the tokens authlimit and the MCP gateway verify. Pinned by digest because it
  # releases almost daily (docker-compose.yml says how to move it). `origin` is the public issuer: every URL Casdoor generates (a token's `iss`, the
  # discovery document) derives from it, not from the request's Host, and it must equal AUTHLIMIT_ISSUER and MCP_GATEWAY_ISSUER below. No `ports`: reached
  # through Caddy (the browser sign-in) and, inside the network, by authlimit and the MCP gateway (the signing keys).
  #
  # The admin UI is on the same host as the sign-in page: protect the `built-in` admin with CASDOOR_ADMIN_PASSWORD (required), and see deploy/README.md
  # on narrowing it further.
  casdoor:
    image: casbin/casdoor:v4.24.0@sha256:b7a2005518396a1d800ad77a695a4edb0c73eb1123070c35b5624440d5fdc550
    restart: unless-stopped
    cpus: "0.2"
    mem_limit: 384m
    security_opt:
      - no-new-privileges:true
    environment:
      driverName: postgres
      dataSourceName: user=casdoor password=${CASDOOR_DB_PASSWORD} host=casdoor-db port=5432 sslmode=disable dbname=casdoor
      dbName: casdoor
      runmode: prod
      origin: https://${AUTH_DOMAIN:?set AUTH_DOMAIN in .env}
      initAdminPassword: ${CASDOOR_ADMIN_PASSWORD:?set CASDOOR_ADMIN_PASSWORD in .env}
    depends_on:
      casdoor-db:
        condition: service_healthy

  # Edge authentication and rate limiting: Caddy asks it about every request (specs/018), and about the sign-in and webhook routes that carry no token
  # (pattern 97). Stateless apart from caches, so two replicas behind Caddy's `dynamic a`; its signing keys are a host directory outside the
  # image and the repo, made once (deploy/README.md) and never written by this service. Every setting that names a place is required: a default would
  # be the development stack's.
  authlimit:
    image: ${AUTHLIMIT_IMAGE:?set AUTHLIMIT_IMAGE in .env}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    init: true
    cpus: "0.2"
    mem_limit: 128m
    deploy:
      replicas: 2
    user: "65532:65532"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=16m
    environment:
      AUTHLIMIT_ISSUER: https://${AUTH_DOMAIN}
      # In-network name and plain http: the keys are fetched by this process, not shown to a client, so only the ISSUER has to be public.
      AUTHLIMIT_JWKS_URL: http://casdoor:8000/.well-known/jwks
      AUTHLIMIT_AUDIENCE: https://${API_DOMAIN}
      AUTHLIMIT_REDIS_URL: redis://redis:6379
      AUTHLIMIT_KEYS_DIR: /keys
      AUTHLIMIT_LIMIT_MODE: ${AUTHLIMIT_LIMIT_MODE:-enforce}
      AUTHLIMIT_MCP_METADATA_URL_TEMPLATE: https://${MCP_DOMAIN:?set MCP_DOMAIN in .env}/.well-known/oauth-protected-resource{path}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector-agent:4318
    volumes:
      # Read-only, owned by uid 65532 with mode 700 (deploy/README.md creates it with `authlimit keys init`); `keys rotate` runs the same way and the
      # replicas pick a new key up without a restart.
      - ${AUTHLIMIT_KEYS_DIR:-/opt/graph-agent-core/authlimit-keys}:/keys:ro
    # Ready = a signing key, usable Casdoor keys and a trustworthy revocation list; Caddy's `health_uri /readyz` drops a replica that is not.
    healthcheck:
      test: ["CMD", "/authlimit", "healthcheck", "--ready"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 5
    depends_on:
      redis:
        condition: service_healthy
      casdoor:
        condition: service_started

  # The MCP gateway (specs/017): the two read-only MCP servers over Streamable HTTP, an OAuth 2.1 resource server that verifies tokens itself and never
  # issues one. The app image with a different command, and only what the two tools read (the app database, Prometheus): no LLM keys, Redis or sandbox
  # key, because anyone holding a token can reach this process. Stateless, so `--scale mcp-gateway=N` works behind Caddy's `dynamic a`.
  mcp-gateway:
    <<: *hardened
    image: ${APP_IMAGE}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    cpus: "0.2"
    mem_limit: 256m
    command: ["python", "-m", "app.adapters.inbound.mcp.gateway", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      APPDATA_DATABASE_URL: postgresql://langfuse:${POSTGRES_PASSWORD}@pgbouncer:6432/appdata
      # The ops server reads Prometheus. The observability droplet's is not reachable from here by default (its firewall opens Grafana, OTLP, Loki and
      # Pyroscope only): point this at one this droplet can reach, or the ops tools report it as unreachable and the directory tools are unaffected.
      PROMETHEUS_URL: ${MCP_GATEWAY_PROMETHEUS_URL:-http://localhost:9090}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector-agent:4318
      MCP_GATEWAY_PUBLIC_URL: https://${MCP_DOMAIN}
      MCP_GATEWAY_ISSUER: https://${AUTH_DOMAIN}
      MCP_GATEWAY_JWKS_URL: http://casdoor:8000/.well-known/jwks
      MCP_GATEWAY_OPS_TENANTS: ${MCP_GATEWAY_OPS_TENANTS:-ops-team}
      # Read by `scripts.tools.mcp_gateway_bootstrap`, which runs inside this container (deploy/README.md): the chat API's resource identifier.
      AUTHLIMIT_AUDIENCE: https://${API_DOMAIN}
    # Ready = can check a token: a replica that cannot reach the signing keys leaves rotation instead of answering 401.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=3)"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    depends_on:
      pgbouncer:
        condition: service_healthy
      casdoor:
        condition: service_started

  # The Telegram bot (specs/020, 021), opt-in: `docker compose --profile telegram up -d`. A client of the chat API through the front door like the web page
  # and the CLI, never the queue or the graph. It reaches the API and Casdoor by their public names, which Caddy's network aliases below resolve to Caddy
  # itself, so it needs no hairpin through the droplet's public address and the certificates verify. In `poll` mode (the default) it needs no inbound
  # port at all; in `webhook` mode, and for the page a login returns to, Caddy routes /telegram/* to its listener (deploy/caddy/gateway.caddy).
  telegram-bot:
    <<: *hardened
    image: ${APP_IMAGE}:${IMAGE_TAG:-latest}
    profiles: ["telegram"]
    restart: unless-stopped
    cpus: "0.1"
    mem_limit: 192m
    command: ["python", "-m", "app.adapters.inbound.channels.telegram.bot"]
    healthcheck: *worker-healthcheck
    environment:
      REDIS_URL: redis://redis:6379
      AUTH_MODE: identity
      CHANNEL_API_URL: https://${API_DOMAIN}
      WEB_AUTH_ISSUER: https://${AUTH_DOMAIN}
      WEB_AUTH_AUDIENCE: https://${API_DOMAIN}
      AGENT_DOMAIN: ${TELEGRAM_AGENT_DOMAIN:-ecorp}
      # Not `:?`: compose interpolates the whole file for every command, profile or not, so a required variable here would break `pull` and `up` for
      # everyone who does not run the bot. The bot itself refuses to start without it (telegram/bot.py check_settings).
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_MODE: ${TELEGRAM_MODE:-poll}
      TELEGRAM_WEBHOOK_URL: ${TELEGRAM_WEBHOOK_URL:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      # Bound to every interface of its own container, which is only reachable from Caddy over the compose network (no `ports`).
      TELEGRAM_LISTEN_HOST: 0.0.0.0
      TELEGRAM_PERSON_SECRET: ${TELEGRAM_PERSON_SECRET:-}
      TELEGRAM_TENANT: ${TELEGRAM_TENANT:-}
      TELEGRAM_LINKING: ${TELEGRAM_LINKING:-false}
      TELEGRAM_LINK_PUBLIC_URL: https://${API_DOMAIN}
      TELEGRAM_LINK_KEY: ${TELEGRAM_LINK_KEY:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector-agent:4318
    depends_on:
      redis:
        condition: service_healthy
      caddy:
        condition: service_started

  # Reverse proxy and TLS, the only service with host ports 80/443 (deploy/terraform's firewall): Let's Encrypt on the three names. The same image,
  # pinned by digest, as the development stack's. deploy/caddy/Caddyfile is the entry; it imports gateway.caddy, so the directory is mounted.
  caddy:
    image: caddy:2.11.7@sha256:504a44d7d74bd2bc28a66afc4774912fc21223ca8a67734af1c54ab2f999b489
    restart: unless-stopped
    cpus: "0.2"
    mem_limit: 128m
    security_opt:
      - no-new-privileges:true
    ports:
      - "80:80"
      - "443:443"
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
    environment:
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN in .env}
      AUTH_DOMAIN: ${AUTH_DOMAIN:?set AUTH_DOMAIN in .env}
      MCP_DOMAIN: ${MCP_DOMAIN:?set MCP_DOMAIN in .env}
    volumes:
      - ./deploy/caddy:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      default:
        # The public names resolve to this container for the services inside the network that call the door the way a client does (the Telegram bot).
        aliases:
          - ${API_DOMAIN}
          - ${AUTH_DOMAIN}
          - ${MCP_DOMAIN}
    # `service_started`, not `service_healthy`, for authlimit and the MCP gateway: Caddy's own health checks (`health_uri /readyz`) already keep a replica
    # that cannot decide out of rotation and the routes that need it fail CLOSED (a 502), so a missing signing key shows up as exactly that. Waiting for
    # healthy instead would make the first deploy of a fresh droplet, before its keys exist (deploy/README.md), never finish.
    depends_on:
      api:
        condition: service_started
      authlimit:
        condition: service_started
      casdoor:
        condition: service_started
      mcp-gateway:
        condition: service_started

  # --- Observability sidecars: relay this droplet's metrics and logs to the observability droplet (docker-compose.observability.prod.yml; its header has the
  # topology). None publishes a host port; only otel-collector-agent and promtail reach off-box (OTLP to OBS_COLLECTOR_ENDPOINT, Loki push to
  # LOKI_PUSH_HOST, both in .env), so the firewall needed no new inbound rule. ---
  node-exporter:
    image: prom/node-exporter:latest
    restart: unless-stopped
    cpus: "0.05"
    mem_limit: 64m
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"

  # Native Linux Docker, so the standard recipe (privileged + /dev/kmsg) works and container names resolve: no container-name-mapper, unlike the dev
  # stack's docker-compose.collectors.yml.
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    restart: unless-stopped
    cpus: "0.2"
    mem_limit: 256m
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro

  # Agent-mode collector: the api and workers push their OTel metrics here (OTEL_EXPORTER_OTLP_ENDPOINT), and it scrapes node-exporter and cadvisor locally
  # before forwarding everything to the observability droplet's collector (observability/otel-collector/config.agent.yaml). With this agent + gateway
  # split only port 4318 crosses the droplets' firewall.
  otel-collector-agent:
    image: otel/opentelemetry-collector-contrib:latest
    restart: unless-stopped
    cpus: "0.2"
    mem_limit: 256m
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    environment:
      OBS_COLLECTOR_ENDPOINT: ${OBS_COLLECTOR_ENDPOINT}
    volumes:
      - ./observability/otel-collector/config.agent.yaml:/etc/otelcol-contrib/config.yaml:ro
    depends_on:
      - node-exporter
      - cadvisor

  # Reads THIS droplet's Docker socket and log files, so it must run beside the containers it tails, and pushes to the observability droplet's Loki
  # (observability/promtail/promtail-config.prod.yaml says why it cannot live in docker-compose.observability.prod.yml).
  promtail:
    image: grafana/promtail:latest
    restart: unless-stopped
    cpus: "0.1"
    mem_limit: 128m
    command: ["-config.file=/etc/promtail/promtail-config.yaml", "-config.expand-env=true"]
    environment:
      LOKI_PUSH_HOST: ${LOKI_PUSH_HOST}
    volumes:
      - ./observability/promtail/promtail-config.prod.yaml:/etc/promtail/promtail-config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro

volumes:
  postgres:
  redis:
  qdrant:
  ml-service:
  caddy_data:
  caddy_config:
  casdoor-db:
