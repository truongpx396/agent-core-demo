# Override for loadtest/locustfile_queued.py runs (`make loadtest-app-up`): points the containerized app roles' OPENAI_API_BASE at
# loadtest/fake_llm_server.py (host-native on :9009; start it with `make fake-llm`) instead of litellm, without touching docker-compose.yml or
# stopping a container. Compose merges `environment` key by key across -f files, so everything else still comes from docker-compose.yml's
# `x-app-env`. Revert with `make up-app`, which recreates these services from docker-compose.yml alone.
services:
  api:
    environment:
      OPENAI_API_BASE: http://host.docker.internal:9009/v1

  agent-worker:
    environment:
      OPENAI_API_BASE: http://host.docker.internal:9009/v1
      # Raised from the defaults (10/10, app/core/config.py) on this one replica, to test whether checkpoint-lock contention (the saver's
      # per-instance lock, app/adapters/outbound/postgres/checkpointing.py) caps in-process throughput even with both knobs open.
      AGENT_WORKER_MAX_CONCURRENCY: "50"
      CHECKPOINTER_POOL_MAX_SIZE: "50"

  ingest-worker:
    environment:
      OPENAI_API_BASE: http://host.docker.internal:9009/v1
