# A project of its own (not the checkout directory's name): this stack's containers and volumes stay apart from docker-compose.yml's,
# so each can be torn down without orphaning the other.
name: agent-core-observability

# The observability backends (`make obs-up`): Prometheus, Alertmanager, Loki, Pyroscope and Grafana. What feeds them is
# docker-compose.collectors.yml. Optional: with every container here down the app runs as before, with nowhere for metrics and logs to go.
#
# No shared Docker network with the app stack, so `make up` and `make obs-up` work in either order. They meet through the host: Prometheus scrapes
# the collectors' published ports via `host.docker.internal` (Docker Desktop resolves it; `extra_hosts: host-gateway` does on native Linux),
# and Promtail pushes to Loki's published port the same way.
services:
  prometheus:
    image: prom/prometheus:latest
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
    ports:
      - "9090:9090"

  alertmanager:
    image: prom/alertmanager:latest
    volumes:
      - ./observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager:/alertmanager
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
    ports:
      - "9093:9093"

  loki:
    image: grafana/loki:latest
    command: ["-config.file=/etc/loki/loki-config.yaml"]
    volumes:
      - ./observability/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki:/loki
    ports:
      - "3100:3100"

  # Continuous profiling (specs/022): the app pushes CPU profiles here (PYROSCOPE_SERVER_ADDRESS in docker-compose.yml's `x-app-env`) and
  # Grafana reads them through the Pyroscope datasource. The two flags keep this 2.x server on the v1 write path (2.0 release notes): ready in
  # 19 s instead of ~3 minutes (earlier pushes are dropped silently) and 38 MiB idle instead of 97. Seven days of profiles; one writable volume, /data.
  pyroscope:
    image: grafana/pyroscope:2.3.2@sha256:78c3b509f2ad98a6974b38c6f2135d5daf9597809532560e9ca29f9b43aa339e
    command:
      - "-config.file=/etc/pyroscope/config.yaml"
      - "-architecture.storage=v1"
      - "-write-path=ingester"
      - "-compactor.blocks-retention-period=168h"
    init: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    read_only: true
    tmpfs:
      - /tmp:size=64m
    volumes:
      - pyroscope:/data
    ports:
      - "4040:4040"   # the app containers push here (via host.docker.internal); a browser can open it too

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3300:3000"   # 3000 is Langfuse's
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"    # local-demo convenience, like open-webui's WEBUI_AUTH=false
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana:/var/lib/grafana
    depends_on:
      - prometheus
      - loki

volumes:
  prometheus:
  alertmanager:
  loki:
  grafana:
  pyroscope:
