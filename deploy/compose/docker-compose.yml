# The dev stack (`make up`). Opt-in profiles: `app` (`make up-app`) the containerized api and workers, `sandbox` (`make sandbox-up`) the
# OpenSandbox server, `gateway` (`make mcp-gateway-up`) the MCP gateway and edge auth, `quality` (`make sonar-up`) SonarQube. The telemetry
# collectors are docker-compose.collectors.yml; the observability backends, docker-compose.observability.yml.

# Workers bind no port, so the image's API HEALTHCHECK (a probe of :8000/health/ready) would report them `unhealthy` forever. Whether a pool is
# alive is the `WorkerUnreachable` alert's job (observability/prometheus/alerts.yml). A worker added without this inherits the probe.
x-worker-healthcheck: &worker-healthcheck
  disable: true

# Env for the containerized app roles (api, agent-worker, ingest-worker). URLs use the other containers' service names: `localhost` is the
# container itself here (Settings' defaults assume a host process).
x-app-env: &app-env
  OPENAI_API_BASE: http://litellm:4000/v1
  # A container does not read `.env` (compose only uses it to fill `${...}`), so before this line the containers sent the dev master key and a scoped
  # `make litellm-key` key was never used. Name as in docker-compose.prod.yml and scripts/tools/litellm_key.py. Unset falls back to `sk-anything`.
  OPENAI_API_KEY: ${LITELLM_APP_KEY:-sk-anything}
  QDRANT_URL: http://qdrant:6333
  ML_SERVICE_URL: http://ml-service:80
  # Through PgBouncer, not Postgres: Postgres sees the pooler's pool size however many replicas run. LiteLLM, Langfuse and the exporters
  # connect directly (specs/022).
  CHECKPOINTER_DATABASE_URL: postgresql://langfuse:langfuse@pgbouncer:6432/checkpointer
  APPDATA_DATABASE_URL: postgresql://langfuse:langfuse@pgbouncer:6432/appdata
  REDIS_URL: redis://redis:6379
  MINIO_ENDPOINT: minio:9000
  LANGFUSE_HOST: http://langfuse-web:3000
  LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
  LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
  CRAWL4AI_SERVER_URL: http://crawl4ai:11235
  CRAWL4AI_API_TOKEN: ${CRAWL4AI_API_TOKEN:-}
  # Empty leaves web_search declared but answering "not set up" (app/adapters/outbound/web/serper.py). A container does not read `.env`.
  SERPER_API_KEY: ${SERPER_API_KEY:-}
  WEB_SEARCH_MAX_RESULTS: ${WEB_SEARCH_MAX_RESULTS:-5}
  # opensandbox-mcp is a stdio subprocess of this process (app/adapters/outbound/mcp/sandbox_tools.py), so it resolves the in-network name. Only matters
  # with the `sandbox` profile up; without it the sandbox tools are absent.
  OPENSANDBOX_MCP_DOMAIN: opensandbox-server:8090
  OPENSANDBOX_API_KEY: ${OPENSANDBOX_API_KEY:-}
  # The collector is docker-compose.collectors.yml's, reached through its published port so the app never depends on it: a failed push is
  # dropped (app/platform/telemetry.py).
  OTEL_EXPORTER_OTLP_ENDPOINT: http://host.docker.internal:4318
  # Pyroscope is in the observability stack; a push to a server that is not there is dropped without a delay (specs/022). Blank turns profiling off.
  PYROSCOPE_SERVER_ADDRESS: ${PYROSCOPE_SERVER_ADDRESS-http://host.docker.internal:4040}

# The shipping Dockerfile stage, named so a reordered Dockerfile cannot make the builder stage run (ENGINEERING_PATTERNS.md 76).
x-app-build: &app-build
  context: .
  target: runtime

# The authlimit service's own Dockerfile and context, shared by `authlimit` and its smoke-check stand-in `authlimit-echo`.
x-authlimit-image: &authlimit-image
  image: authlimit:dev
  build:
    context: ./services/authlimit

# Runtime hardening for the images this repo builds (nothing here changes what the app does):
#   init                  a real PID 1: reaps the sandbox bridge's children and forwards SIGTERM, so `stop_grace_period` holds
#   no-new-privileges     no privilege gain through a setuid binary
#   cap_drop: ALL         the app runs as uid 1000 on a port above 1024: it needs no capability
#   read_only + tmpfs     the image filesystem is never written. /tmp and $HOME (libraries create dot-directories there: crawl4ai makes
#                         ~/.crawl4ai on import) are RAM, capped because tmpfs counts against the memory limit. ml-service keeps a named
#                         volume for its models, so it overrides `tmpfs`.
x-hardened: &hardened
  init: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  read_only: true
  tmpfs:
    - /tmp:size=128m
    - /home/appuser:size=64m,uid=1000,gid=1000

services:
  # --- LiteLLM proxy: single OpenAI-compatible endpoint for the app ---
  litellm:
    # Pinned by digest: the gateway holds the provider keys and decides what a call costs, and its behaviour moves between releases (the stop status
    # went from 400 to 429; a LiteLLM PyPI release was compromised in 2026-03). This is the multi-arch index of `main-stable` on 2026-07-30 (1.94.1),
    # the image COST_GOVERNANCE.md's checks ran on. To move it: deploy/README.md ("Bumping the LiteLLM image"); docker-compose.prod.yml carries the same one.
    image: ghcr.io/berriai/litellm:main-stable@sha256:28b10a635296730007097390939b55f8696ece548530d4ddda3e31c708b4dc81
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    ports:
      - "4000:4000"
    volumes:
      - ./deploy/litellm/litellm-config.yaml:/app/config.yaml:ro
      # sitecustomize.py, auto-imported via PYTHONPATH below, patches a LiteLLM bug that glues two tool calls from an ollama_chat model into one
      # (deploy/litellm/patches/sitecustomize.py). The stock image is untouched.
      - ./deploy/litellm/patches:/app/patches:ro
    environment:
      PYTHONPATH: /app/patches
      # Keys for the hosted tiers, empty until you have them: the Gemini blocks in litellm-config.yaml read them. Put them in .env, never here.
      GEMINI_API_KEY_MEDIUM: ${GEMINI_API_KEY_MEDIUM:-}
      GEMINI_API_KEY_STRONG: ${GEMINI_API_KEY_STRONG:-}
      # Proxy-level Langfuse logging.
      LANGFUSE_HOST: ${LANGFUSE_HOST:-http://langfuse-web:3000}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      # Admin UI: needs a DATABASE_URL to store users/keys and a master key.
      DATABASE_URL: postgresql://langfuse:langfuse@postgres:5432/litellm
      LITELLM_MASTER_KEY: sk-anything       # same as master_key in litellm-config.yaml
      UI_USERNAME: admin
      UI_PASSWORD: admin123
    depends_on:
      postgres:
        condition: service_healthy

  # --- Open WebUI: a browser chat UI on the host's native Ollama (no Ollama container in this stack; see litellm-config.yaml) ---
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    ports:
      - "8080:8080"
    environment:
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      WEBUI_AUTH: "false"          # disable login for local dev convenience
    volumes:
      - open-webui:/app/backend/data
    extra_hosts:
      - "host.docker.internal:host-gateway"   # so OLLAMA_BASE_URL resolves on native Linux Docker too

  # --- Vector database ---
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant:/qdrant/storage

  # --- ML service: the reranker (app/adapters/outbound/embeddings/embeddings.py `rerank`, on every retrieval), Llama Prompt Guard 2 (app/core/moderation.py), the
  # embedding endpoint and the label sets, in one CPU container (design: services/ml-service/main.py).
  # Rerank used to run in the worker's process and oversubscribed its threads and cores under a 50-turn burst. This service coalesces concurrent
  # calls into one ONNX pass (batches of up to 256 pairs from ~12 callers) and served a 100-request burst with no rejections; Hugging Face TEI
  # (bge-reranker-base) rejected ~94% of the same burst and idled at 2.26 GiB against 200-420 MiB here.
  # Prompt Guard comes from gravitee-io's ONNX port: Meta's repo is gated behind the Llama 4 license, which an anonymous image build cannot accept.
  ml-service:
    <<: *hardened
    tmpfs:
      - /tmp:size=128m  # the models live in the named volume below, not in tmpfs
    build:
      context: ./services/ml-service
      target: runtime
    ports:
      - "8083:80"
    environment:
      # Which text models (services/ml-service/models.toml) to load and the embedding endpoint's ceilings; empty = the defaults.
      ML_MODELS_ENABLED: ${ML_MODELS_ENABLED:-}
      ML_EMBED_MAX_ITEMS: ${ML_EMBED_MAX_ITEMS:-256}
      ML_EMBED_MAX_CHARS: ${ML_EMBED_MAX_CHARS:-8000}
    volumes:
      - ml-service:/home/appuser/.cache   # model cache (every model) — avoids re-downloading on every restart
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:80/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s   # covers a cold pull of BOTH models on first startup

  # --- Redis Stack, not plain redis: the semantic cache (app/adapters/outbound/redis/semantic_cache.py) needs RediSearch's vector KNN ---
  redis:
    image: redis/redis-stack-server:latest
    ports:
      - "6379:6379"
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # --- Postgres: Langfuse, LiteLLM and the app's databases (postgres-init/) ---
  postgres:
    image: postgres:16
    # pg_stat_statements must be preloaded at server start (it allocates shared memory in the postmaster); postgres-exporter's stat_statements
    # collector reads it once `CREATE EXTENSION` has run in appdata.
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements"]
    ports:
      - "5432:5432"   # exposed so app/platform/sql_store.py (host process) can connect directly
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse
      POSTGRES_DB: langfuse
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro   # creates litellm + appdata dbs on first start
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse"]
      interval: 10s
      timeout: 5s
      retries: 10

  # --- PgBouncer in front of `appdata` and `checkpointer` (specs/022). Transaction pooling: Postgres sees the pool size per database however many
  # processes connect (WORKER_CONCURRENCY.md, "Postgres connection budget"). LiteLLM, Langfuse and the exporters connect directly. The app's pools
  # disable prepared statements (app/platform/sql_store.py), the one thing a transaction pooler cannot carry. Hardened like the app roles
  # (tests/core/test_compose_pooler.py); one tmpfs is its whole write path (specs/022 research.md).
  pgbouncer:
    image: edoburu/pgbouncer:v1.26.1-p0@sha256:488422e38cff912895d0d65d8963fcd306e6ac589a724398b6eb8e294e94d624
    restart: unless-stopped
    init: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    read_only: true
    tmpfs:
      - /etc/pgbouncer:size=1m,uid=70,gid=70,mode=0700
    environment:
      DATABASE_URLS: postgresql://langfuse:langfuse@postgres:5432/appdata,postgresql://langfuse:langfuse@postgres:5432/checkpointer
      LISTEN_PORT: "6432"
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      # 15 + 3 reserve = 18 server connections per database, 36 of Postgres's 100; a test keeps that sum honest.
      DEFAULT_POOL_SIZE: "15"
      RESERVE_POOL_SIZE: "3"
      RESERVE_POOL_TIMEOUT: "3"
      MAX_DB_CONNECTIONS: "18"
      MAX_CLIENT_CONN: "500"
      # Gives up after 30 s instead of waiting for ever; PgBouncerClientsWaiting fires first.
      QUERY_WAIT_TIMEOUT: "30"
      # An open transaction holds a server connection; nothing here keeps one open for a minute.
      IDLE_TRANSACTION_TIMEOUT: "60"
      IGNORE_STARTUP_PARAMETERS: extra_float_digits,options
      # SHOW commands only (the exporter's login); there is no admin user.
      STATS_USERS: langfuse
      LOG_CONNECTIONS: "0"
      LOG_DISCONNECTIONS: "0"
    ports:
      - "127.0.0.1:6432:6432"   # so a host process (`make serve`) can be pointed at the pooler too; the default there is Postgres directly
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 6432 -U langfuse -d appdata"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy

  langfuse-web:
    image: langfuse/langfuse:2
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://langfuse:langfuse@postgres:5432/langfuse
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: demo-secret-change-me
      SALT: demo-salt-change-me
      TELEMETRY_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy

  # --- S3-compatible object storage for uploads (app/adapters/outbound/minio/object_store.py). No healthcheck: the image has no curl, and object_store.py turns
  # a not-ready MinIO into a clear upload-time error. ---
  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "9000:9000"   # S3 API — app/adapters/outbound/minio/object_store.py talks to this
      - "9001:9001"   # web console (http://localhost:9001) — browse uploads by hand
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio:/data

  # --- crawl4ai's official server (headless Chromium, warm and pooled; pattern 50) instead of a browser launch per tool call in the app.
  # Default profile: it needs no host Docker socket, only a published port. ---
  crawl4ai:
    image: unclecode/crawl4ai:0.9.3
    shm_size: 1g   # Chromium needs real /dev/shm — crawl4ai's own docker run docs
    ports:
      - "11235:11235"   # verified official default port (self-hosting.md), NOT 8000
    environment:
      # Required since 0.9.0 (secure by default): without it the server binds loopback inside its container and the published port resets.
      CRAWL4AI_API_TOKEN: ${CRAWL4AI_API_TOKEN:-}
    healthcheck:
      # The image ships curl; /health needs no auth.
      test: ["CMD", "curl", "-f", "http://localhost:11235/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s   # crawl4ai's own docs: allow up to 40s startup

  # --- OpenSandbox server for every domain's sandbox tools (app/adapters/outbound/mcp/sandbox_tools.py, pattern 50). Upstream publishes no image, so this
  # repo builds one (deploy/images/opensandbox-server.{Dockerfile,toml}). Own opt-in `sandbox` profile (`make sandbox-up`): it bind-mounts the Docker
  # socket to start sibling sandbox containers on the host daemon, the privilege `uvx opensandbox-server` had as a host process. ---
  opensandbox-server:
    build:
      context: .
      dockerfile: deploy/images/opensandbox-server.Dockerfile
    profiles: ["sandbox"]
    restart: unless-stopped
    ports:
      - "8090:8090"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - opensandbox-data:/data
    environment:
      # Overrides server.api_key; current releases refuse to start non-interactively without one.
      OPENSANDBOX_SERVER_API_KEY: ${OPENSANDBOX_API_KEY}

  # --- MCP gateway (profile `gateway`; `make mcp-gateway-up`; specs/017) ---
  # The published MCP servers (app/adapters/inbound/mcp/server.py, ops_server.py) over Streamable HTTP behind OAuth 2.1: caddy-gateway terminates TLS, mcp-gateway is
  # the resource server, casdoor issues the tokens. Local only: *.localhost names, Caddy's own CA, one loopback port. A deployment swaps in real
  # names, ACME and its own identity provider (the gateway needs only an issuer URL and a JWKS URL).
  #
  # Casdoor is pinned by digest because it releases almost daily. To move it, take the new tag's digest, run `make mcp-gateway-up` and
  # `make mcp-gateway-bootstrap`, and read the minted token (specs/017-mcp-gateway/research.md lists the claims this depends on).
  # It gets its own Postgres: Casdoor migrates its schema on upgrade (as sonarqube-db does).
  # The passwords come from `make mcp-gateway-up` (a second --env-file outside the repo) and default to EMPTY, not `${VAR:?}`: compose interpolates
  # the whole file on every command, so a required variable would break `make up` for everyone. Empty fails safe: Postgres will not initialise
  # without a password and Casdoor reports the admin password unset.
  casdoor-db:
    image: postgres:16-alpine@sha256:f4610795587492cd4fb887c2dc3de301b813278bb6f616992061141b5f15ac36
    profiles: ["gateway"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: casdoor
      POSTGRES_PASSWORD: ${CASDOOR_DB_PASSWORD:-}
      POSTGRES_DB: casdoor
    volumes:
      - casdoor-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U casdoor -d casdoor"]
      interval: 5s
      timeout: 3s
      retries: 10

  casdoor:
    image: casbin/casdoor:v4.24.0@sha256:b7a2005518396a1d800ad77a695a4edb0c73eb1123070c35b5624440d5fdc550
    profiles: ["gateway"]
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      driverName: postgres
      dataSourceName: user=casdoor password=${CASDOOR_DB_PASSWORD:-} host=casdoor-db port=5432 sslmode=disable dbname=casdoor
      dbName: casdoor
      runmode: prod
      # Every URL Casdoor generates (the token's `iss`, the discovery document) derives from this, not the request's Host (measured). Must equal MCP_GATEWAY_ISSUER.
      origin: ${MCP_GATEWAY_ISSUER:-https://auth.localhost:8443}
      # No default admin password in this version; `make mcp-gateway-up` generates one.
      initAdminPassword: ${CASDOOR_ADMIN_PASSWORD:-}
    depends_on:
      casdoor-db:
        condition: service_healthy
    # No `ports`: reached through caddy-gateway (the browser login) and, inside the network, by mcp-gateway (the signing keys).

  mcp-gateway:
    <<: *hardened
    build: *app-build
    profiles: ["gateway"]
    restart: unless-stopped
    command: ["python", "-m", "app.adapters.inbound.mcp.gateway", "--host", "0.0.0.0", "--port", "8000"]
    # Only what the two tools read (the app database, Prometheus) and the gateway's own settings: no LLM keys, Redis or sandbox key, as anyone
    # holding a token can reach this process.
    environment:
      APPDATA_DATABASE_URL: postgresql://langfuse:langfuse@pgbouncer:6432/appdata
      PROMETHEUS_URL: ${MCP_GATEWAY_PROMETHEUS_URL:-http://host.docker.internal:9090}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${MCP_GATEWAY_OTLP_ENDPOINT-http://host.docker.internal:4318}
      MCP_GATEWAY_PUBLIC_URL: ${MCP_GATEWAY_PUBLIC_URL:-https://mcp.localhost:8443}
      MCP_GATEWAY_ISSUER: ${MCP_GATEWAY_ISSUER:-https://auth.localhost:8443}
      # In-network name, plain http: only the ISSUER has to be public.
      MCP_GATEWAY_JWKS_URL: http://casdoor:8000/.well-known/jwks
      MCP_GATEWAY_OPS_TENANTS: ${MCP_GATEWAY_OPS_TENANTS:-ops-team}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Ready = can check a token: a replica that cannot reach the signing keys leaves rotation instead of answering 401.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=3)"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    depends_on:
      pgbouncer:
        condition: service_healthy
      casdoor:
        condition: service_healthy
    # Stateless: scale behind caddy-gateway's `dynamic a` (deploy/caddy/Caddyfile.gateway):
    #   docker compose --profile gateway up -d --scale mcp-gateway=3 --no-recreate

  caddy-gateway:
    image: caddy:2.11.7@sha256:504a44d7d74bd2bc28a66afc4774912fc21223ca8a67734af1c54ab2f999b489
    profiles: ["gateway"]
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      # What sits behind the chat-API site's check (deploy/caddy/Caddyfile.gateway): the echo stub or `api:8000`. Resolved by compose's `:-` because
      # Caddy's own default only fires on an UNSET variable, not an empty one.
      AUTHLIMIT_UPSTREAM: ${AUTHLIMIT_UPSTREAM:-authlimit-echo:8000}
    ports:
      # Loopback only: this is a development stack with Casdoor's admin UI behind it.
      - "127.0.0.1:8443:8443"
    volumes:
      - ./deploy/caddy/Caddyfile.gateway:/etc/caddy/Caddyfile:ro
      - caddy-gateway-data:/data    # the local CA (and its root certificate: `make mcp-gateway-ca`) lives here
      - caddy-gateway-config:/config
    depends_on:
      mcp-gateway:
        condition: service_healthy
      casdoor:
        condition: service_healthy
      authlimit:
        condition: service_healthy
      authlimit-echo:
        condition: service_healthy

  # --- authlimit: edge authentication and rate limiting (profile `gateway`; specs/018) ---
  # Caddy asks it about every request (`forward_auth`, deploy/caddy/Caddyfile.gateway): it verifies the Casdoor token offline, charges the tenant's
  # and the person's token buckets in Redis, refuses revoked people, and returns a short-lived signed identity for Caddy to copy onto the request.
  # Stateless apart from caches; any number of replicas behind Caddy's `dynamic a`. Needs `make up` (Redis) and `make authlimit-keys` first.
  authlimit:
    <<: *authlimit-image
    profiles: ["gateway"]
    restart: unless-stopped
    init: true
    deploy:
      replicas: 2
    # The host user, so the key directory (mode 700, made by `make authlimit-keys`) is readable; the image's 65532 cannot enter it. The Makefile sets
    # AUTHLIMIT_UID/GID; the default keeps other compose commands valid, and the service then fails at start naming the keys.
    user: "${AUTHLIMIT_UID:-65532}:${AUTHLIMIT_GID:-65532}"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=16m
    environment:
      AUTHLIMIT_ISSUER: ${AUTHLIMIT_ISSUER:-https://auth.localhost:8443}
      # In-network name and plain http: the keys are fetched by this process, not shown to a client, so only the ISSUER has to be public.
      AUTHLIMIT_JWKS_URL: http://casdoor:8000/.well-known/jwks
      AUTHLIMIT_AUDIENCE: ${AUTHLIMIT_AUDIENCE:-https://api.localhost:8443}
      AUTHLIMIT_REDIS_URL: redis://redis:6379
      AUTHLIMIT_KEYS_DIR: /keys
      AUTHLIMIT_KEYS_ALLOW_LOOSE_PERMS: ${AUTHLIMIT_KEYS_ALLOW_LOOSE_PERMS:-false}
      AUTHLIMIT_LIMIT_MODE: ${AUTHLIMIT_LIMIT_MODE:-enforce}
      # Key-cache timings, exposed so `make authlimit-smoke` can shorten them to watch a Casdoor outage in seconds.
      AUTHLIMIT_JWKS_CACHE_SECONDS: ${AUTHLIMIT_JWKS_CACHE_SECONDS:-300}
      AUTHLIMIT_JWKS_MIN_REFRESH_SECONDS: ${AUTHLIMIT_JWKS_MIN_REFRESH_SECONDS:-30}
      AUTHLIMIT_JWKS_STALE_GRACE_SECONDS: ${AUTHLIMIT_JWKS_STALE_GRACE_SECONDS:-21600}
      AUTHLIMIT_REVOCATION_POLL_MS: ${AUTHLIMIT_REVOCATION_POLL_MS:-1000}
      AUTHLIMIT_MCP_METADATA_URL_TEMPLATE: ${MCP_GATEWAY_PUBLIC_URL:-https://mcp.localhost:8443}/.well-known/oauth-protected-resource{path}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${AUTHLIMIT_OTLP_ENDPOINT-http://host.docker.internal:4318}
    volumes:
      # The signing keys, read-only, outside the repo (see `make authlimit-keys`).
      - ${AUTHLIMIT_KEYS_DIR:-${HOME:-/tmp}/.cache/graph-agent-core-authlimit/keys}:/keys:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"   # so OTEL_EXPORTER_OTLP_ENDPOINT resolves on native Linux Docker too
    # Ready = a signing key, usable Casdoor keys and a trustworthy revocation list; Caddy's `health_uri /readyz` drops a replica that is not.
    healthcheck:
      test: ["CMD", "/authlimit", "healthcheck", "--ready"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 5
    depends_on:
      redis:
        condition: service_healthy
      casdoor:
        condition: service_healthy

  # The smoke check's stand-in upstream (`make authlimit-smoke`): echoes the headers it received, which shows what a real API would have been given.
  # Same image as authlimit, a different binary.
  authlimit-echo:
    <<: *authlimit-image
    profiles: ["gateway"]
    restart: unless-stopped
    init: true
    entrypoint: ["/echo"]
    user: "65532:65532"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    environment:
      AUTHLIMIT_LISTEN: ":8000"   # read only by the healthcheck below
    healthcheck:
      test: ["CMD", "/authlimit", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- SonarQube Community (profile `quality`; `make sonar-up`) ---
  # A persistent server with history and trends, which CI's ephemeral per-run `sonarqube` job (.github/workflows/ci.yml) cannot give: a GitHub
  # runner cannot reach a local server. Opt-in for its memory cost (2 GB+ heap). Own Postgres, since SonarQube migrates its schema on upgrade.
  sonarqube-db:
    image: postgres:16
    profiles: ["quality"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: sonarqube
      POSTGRES_PASSWORD: sonarqube
      POSTGRES_DB: sonarqube
    volumes:
      - sonarqube-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonarqube"]
      interval: 10s
      timeout: 5s
      retries: 10

  sonarqube:
    image: sonarqube:community
    profiles: ["quality"]
    restart: unless-stopped
    ports:
      - "9002:9000"   # not 9000/9001 — this stack's own minio already binds both of those host ports
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonarqube-db:5432/sonarqube
      SONAR_JDBC_USERNAME: sonarqube
      SONAR_JDBC_PASSWORD: sonarqube
    volumes:
      - sonarqube-data:/opt/sonarqube/data
      - sonarqube-extensions:/opt/sonarqube/extensions
      - sonarqube-logs:/opt/sonarqube/logs
    depends_on:
      sonarqube-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/api/system/status | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

  # --- Containerized app roles (profile `app`; `make up-app`) ---
  # The deployable artifact (see the Dockerfile header). Everyday dev runs `make serve`, `make agent-worker` and `make ingest-worker` as host
  # processes instead.
  api:
    <<: *hardened
    build: *app-build
    # The one role that takes uploads (up to 5 x 25 MB, app/adapters/inbound/api/routers/ingest.py): the multipart parser spools to /tmp before the handler runs, so
    # /tmp is a disk-backed volume (a tmpfs would fill RAM at the second large upload). Only $HOME is tmpfs.
    tmpfs:
      - /home/appuser:size=64m,uid=1000,gid=1000
    volumes:
      - /tmp
    profiles: ["app"]
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      <<: *app-env
      # Header mode by default: this role is published on :8000 with nothing in front (`--profile app` alone), so it trusts X-Tenant-Id and
      # X-Principal-Id and warns at start (agent_api_auth_mode). `make authlimit-up-app` sets AUTH_MODE=identity and puts Caddy in front: only the
      # signed identity is trusted, and a request straight to :8000 is a 401. The keys URL is authlimit's in-network name; the API starts without it
      # and answers 503 until the keys load.
      AUTH_MODE: ${AUTH_MODE:-headers}
      AUTHLIMIT_KEYS_URL: ${AUTHLIMIT_KEYS_URL:-http://authlimit:8080/internal/jwks.json}
      # The API's copy of those keys; passed through so the smoke can shorten the timings (the defaults are Settings').
      AUTHLIMIT_KEYS_CACHE_SECONDS: ${AUTHLIMIT_KEYS_CACHE_SECONDS:-60}
      AUTHLIMIT_KEYS_STALE_GRACE_SECONDS: ${AUTHLIMIT_KEYS_STALE_GRACE_SECONDS:-600}
      # What the built-in page signs in against: the names and defaults authlimit reads, so one override changes both.
      WEB_AUTH_ISSUER: ${AUTHLIMIT_ISSUER:-https://auth.localhost:8443}
      WEB_AUTH_AUDIENCE: ${AUTHLIMIT_AUDIENCE:-https://api.localhost:8443}
    extra_hosts:
      - "host.docker.internal:host-gateway"   # so OTEL_EXPORTER_OTLP_ENDPOINT resolves on native Linux Docker too
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy

  # One container serves every domain: each domain's requests stream, on that domain's graph (app/adapters/inbound/workers/agent_worker.py).
  agent-worker:
    <<: *hardened
    build: *app-build
    profiles: ["app"]
    restart: unless-stopped
    command: ["python", "-m", "app.adapters.inbound.workers.agent_worker"]
    healthcheck: *worker-healthcheck
    environment:
      <<: *app-env
      # Names some domains instead to run separate pools (`support,ops`). The concurrency budget, AGENT_WORKER_MAX_CONCURRENCY, is shared by all of them.
      AGENT_WORKER_DOMAINS: ${AGENT_WORKER_DOMAINS:-all}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Scale with replicas (pattern 43): docker compose --profile app up -d --scale agent-worker=3. Each pushes its own OTLP metrics, so no scrape change.

  ingest-worker:
    <<: *hardened
    build: *app-build
    profiles: ["app"]
    restart: unless-stopped
    command: ["python", "-m", "app.adapters.inbound.workers.ingest_worker"]
    healthcheck: *worker-healthcheck
    environment: *app-env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started

volumes:
  qdrant:
  postgres:
  open-webui:
  redis:
  minio:
  opensandbox-data:
  ml-service:
  sonarqube-db:
  sonarqube-data:
  sonarqube-extensions:
  sonarqube-logs:
  casdoor-db-data:
  caddy-gateway-data:
  caddy-gateway-config:
