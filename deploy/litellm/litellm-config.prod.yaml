# Production LiteLLM proxy config — unlike litellm-config.yaml (which
# targets a native macOS Ollama via host.docker.internal, only reachable on
# a dev machine), this points at a real hosted OpenAI-compatible endpoint
# via env vars docker-compose.prod.yml passes through, so the same image
# works against OpenAI, Anthropic's OpenAI-compatible endpoint, a hosted
# vLLM/Ollama instance, or anything else that speaks the OpenAI API — a
# config change, not a code/image change (same model-alias architecture
# GRAPH_PATTERNS.md pattern 38 describes for the dev config).
#
# `os.environ/VAR_NAME` is LiteLLM's own documented env-substitution syntax
# (litellm_settings/model_list values only, not general YAML) — verified
# against LiteLLM's config docs, not guessed.
model_list:
  - model_name: chat
    litellm_params:
      model: os.environ/LLM_CHAT_MODEL
      api_base: os.environ/LLM_API_BASE
      api_key: os.environ/LLM_API_KEY
    # The app prices every call from this entry's `model_info` (GET /model/info), which
    # LiteLLM fills from its own cost map for models it knows. A model it does NOT know
    # (self-hosted vLLM, a fine-tune) has no price, and with UNPRICED_MODEL_POLICY=block
    # the app refuses to serve it. State its price here, in USD per TOKEN:
    #   model_info:
    #     input_cost_per_token: 0.0000010
    #     output_cost_per_token: 0.0000040
    #     cache_read_input_token_cost: 0.0000001   # optional; omitted = cached billed as input
  # The middle tier (`chat` is the easy one, `chat-strong` the strong one; the tier table is at the top of litellm-config.yaml). Same
  # mechanism as `chat-strong` below: compose passes LLM_MEDIUM_* defaulting to the `chat` values, so an unset variable cannot stop the
  # proxy and the alias is effectively `chat` until an operator points it at a model. Nothing selects it automatically: a delegated
  # specialist names it in its AGENT.md `model:`, or an operator points CHAT_MODEL at it. No `fallbacks` entry names it, for the reason
  # given under `chat-strong`. To attach Gemini through Google's OpenAI-compatibility endpoint (still beta, per Google), set in the env file
  #   LLM_MEDIUM_CHAT_MODEL=openai/<a Gemini flash-class id>   LLM_MEDIUM_API_BASE=https://generativelanguage.googleapis.com/v1beta/openai/
  #   LLM_MEDIUM_API_KEY=<its own key>
  # and state the price below, because LiteLLM does not know an `openai/<gemini id>` (UNPRICED_MODEL_POLICY=block refuses it otherwise).
  - model_name: chat-medium
    litellm_params:
      model: os.environ/LLM_MEDIUM_CHAT_MODEL
      api_base: os.environ/LLM_MEDIUM_API_BASE
      api_key: os.environ/LLM_MEDIUM_API_KEY
    #   model_info:
    #     input_cost_per_token: <USD per token, from Google's pricing page>
    #     output_cost_per_token: <USD per token>
  # The escalation alias (specs/014, contracts/gateway-aliases.md section 1). Compose passes LLM_STRONG_* defaulting to the `chat` values, so
  # an unset variable cannot stop the proxy and the alias is effectively `chat` until an operator points it somewhere stronger. Inert until
  # the app is told to use it (STRONG_CHAT_MODEL / ROUTER_MODE). No `fallbacks` entry names it: the app repeats a failed strong call on
  # `chat` so the ledger prices the model that answered. State a price below if the model is one LiteLLM does not know (UNPRICED_MODEL_POLICY=block).
  - model_name: chat-strong
    litellm_params:
      model: os.environ/LLM_STRONG_CHAT_MODEL
      api_base: os.environ/LLM_STRONG_API_BASE
      api_key: os.environ/LLM_STRONG_API_KEY
    #   model_info:
    #     input_cost_per_token: 0.0000030
    #     output_cost_per_token: 0.0000150
  - model_name: embed
    litellm_params:
      model: os.environ/LLM_EMBED_MODEL
      api_base: os.environ/LLM_API_BASE
      api_key: os.environ/LLM_API_KEY

litellm_settings:
  drop_params: true
  num_retries: 2
  request_timeout: 600
  # No Langfuse callback here — this lean stack ships no Langfuse
  # container (see docker-compose.prod.yml's own header). Prometheus stays
  # since it's just an exposed /metrics endpoint, no extra service needed.
  success_callback: ["prometheus"]
  failure_callback: ["prometheus"]
  require_auth_for_metrics_endpoint: false
  # A default per-PERSON spend cap at the gateway: names a budget OBJECT (in LiteLLM's database, created with
  # `make litellm-key ARGS="person-budget set --max-budget <usd>"`) that applies to every end user, i.e. every person (the app sends
  # `user` = `tenant:<tenant>/user:<principal>`), without a budget of its own. Not created yet = LiteLLM logs a warning per call and
  # applies NO cap. See litellm-config.yaml for the full note and COST_GOVERNANCE.md pattern 74.
  max_end_user_budget_id: person-default

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  store_prompts_in_spend_logs: true
