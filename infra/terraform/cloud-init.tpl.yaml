#cloud-config
# First-boot provisioning only (see main.tf's lifecycle comment) — installs
# Docker, a non-root deploy identity, and host-level hardening. It does NOT
# ship any application code or secrets; .github/workflows/deploy.yml pushes
# docker-compose.prod.yml + config + the built image via SSH/GHCR after this
# has run, and the operator creates /opt/agent-core-demo/.env by hand on
# first deploy (see infra/README.md) — secrets never pass through user_data,
# which DigitalOcean stores as plain, retrievable droplet metadata.
package_update: true
package_upgrade: true

users:
  - name: ${deploy_user}
    groups: [docker, sudo]
    shell: /bin/bash
    sudo: ["ALL=(ALL) NOPASSWD:ALL"]
    lock_passwd: true
    ssh_authorized_keys:
      - ${deploy_ssh_public_key}

packages:
  - ca-certificates
  - curl
  - gnupg
  - ufw
  - unattended-upgrades
  - fail2ban

write_files:
  - path: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";

runcmd:
  # --- Docker Engine + Compose plugin from Docker's own apt repo (the
  # distro's docker.io package trails upstream releases) ---
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
  - chmod a+r /etc/apt/keyrings/docker.asc
  - >
    echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc]
    https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo $VERSION_CODENAME) stable"
    > /etc/apt/sources.list.d/docker.list
  - apt-get update
  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
  - usermod -aG docker ${deploy_user}

  # --- Host firewall — second enforcement layer behind the DO cloud
  # firewall (infra/terraform's digitalocean_firewall); see that resource's
  # own comment for why this isn't redundant. ---
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow OpenSSH
  - ufw allow 80/tcp
  - ufw allow 443/tcp
  - ufw allow 8000/tcp
  - ufw --force enable

  - systemctl enable --now fail2ban

  - mkdir -p /opt/agent-core-demo
  - chown ${deploy_user}:${deploy_user} /opt/agent-core-demo

final_message: "agent-core-demo droplet ready after $UPTIME seconds"
