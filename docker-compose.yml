# One command (`make up`) brings up the whole offline AI stack, including
# crawl4ai (real headless-Chromium rendering, GRAPH_PATTERNS.md pattern 50).
# Two further opt-in profiles layer on top: `app` (`make up-app`) for the
# containerized app itself, and `sandbox` (`make sandbox-up`) for a
# containerized, authenticated OpenSandbox server — each profile-gated
# separately since each adds real host privilege/cost most `make up`
# users don't need by default (see each service's own comment below).

# Shared env for the containerized app roles below (services: api,
# agent-worker, ingest-worker) — every URL points at the OTHER containers'
# in-network service names (e.g. `litellm:4000`), not `localhost` — a
# container can't reach another container via the host's own localhost the
# way a host process can (see app/core/config.py's Settings defaults, all
# `localhost:*`, which assume exactly that host-process case and are
# overridden here).
x-app-env: &app-env
  OPENAI_API_BASE: http://litellm:4000/v1
  QDRANT_URL: http://qdrant:6333
  CHECKPOINTER_DATABASE_URL: postgresql://langfuse:langfuse@postgres:5432/checkpointer
  APPDATA_DATABASE_URL: postgresql://langfuse:langfuse@postgres:5432/appdata
  REDIS_URL: redis://redis:6379
  MINIO_ENDPOINT: minio:9000
  LANGFUSE_HOST: http://langfuse-web:3000
  LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
  LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
  CRAWL4AI_SERVER_URL: http://crawl4ai:11235
  CRAWL4AI_API_TOKEN: ${CRAWL4AI_API_TOKEN:-}
  # opensandbox-mcp is a stdio subprocess THIS process spawns
  # (app/domains/sandbox_tools.py) — for the containerized agent-worker
  # role, that subprocess runs INSIDE this same container, on this same
  # compose network, so it resolves opensandbox-server's in-network name
  # exactly like any other service here (only needed if the `sandbox`
  # profile is also up — see `make sandbox-up`; sandbox_tools.py already
  # degrades to no sandbox tools if it isn't reachable).
  OPENSANDBOX_MCP_DOMAIN: opensandbox-server:8090
  OPENSANDBOX_API_KEY: ${OPENSANDBOX_API_KEY:-}
  # The otel-collector lives in the SEPARATE, optional
  # docker-compose.observability.yml (`make obs-up`) — reached via
  # host.docker.internal, not an in-network service name, so this app never
  # depends on that stack being up (a push that fails just gets dropped by
  # the OTLP exporter; see app/core/telemetry.py and that compose file's
  # own header for the full reasoning).
  OTEL_EXPORTER_OTLP_ENDPOINT: http://host.docker.internal:4318

services:
  # --- LLM + embeddings, fully local ---
  ollama:
    image: ollama/ollama:latest
    # No host port published: this container is CPU-only (Docker Desktop on
    # Mac can't pass Metal/GPU through), so app/litellm-config.yaml now
    # targets a native macOS Ollama on the host's :11434 instead (real GPU
    # acceleration — see litellm-config.yaml's api_base comments). This
    # container stays up only to serve open-webui's OLLAMA_BASE_URL
    # (internal docker-network hostname "ollama", unaffected by dropping
    # the host port publish).
    environment:
      # Default keep_alive is 5m — normal chat pacing (read a reply, think,
      # type the next message) easily exceeds that, so the ~2.4GB chat model
      # unloads between turns and the next message pays a ~10s reload before
      # prefill even starts (verified empirically: load_duration alone was
      # 10.27s of a 13.01s cold call). Keeping it loaded for an hour trades
      # idle RAM for eliminating that reload tax during a dev/demo session.
      OLLAMA_KEEP_ALIVE: 60m
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # --- LiteLLM proxy: single OpenAI-compatible endpoint for the app ---
  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    ports:
      - "4000:4000"
    volumes:
      - ./litellm-config.yaml:/app/config.yaml:ro
      # sitecustomize.py, auto-imported by Python at startup (PYTHONPATH
      # below) — patches a live-verified litellm bug where two tool calls
      # from an ollama_chat model in one turn get corrupted into one glued,
      # unusable tool_call. See litellm-patches/sitecustomize.py's own
      # comment for the full root cause and repro; the stock image itself
      # is untouched, so `docker compose pull litellm` still works normally.
      - ./litellm-patches:/app/patches:ro
    environment:
      PYTHONPATH: /app/patches
      # Proxy-level Langfuse logging (falls back to empty if unset).
      LANGFUSE_HOST: ${LANGFUSE_HOST:-http://langfuse-web:3000}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      # Admin UI: needs a DATABASE_URL to store users/keys and a master key.
      DATABASE_URL: postgresql://langfuse:langfuse@postgres:5432/litellm
      LITELLM_MASTER_KEY: sk-anything       # same as master_key in litellm-config.yaml
      UI_USERNAME: admin
      UI_PASSWORD: admin123
    depends_on:
      postgres:
        condition: service_healthy

  # --- Open WebUI: browser-based chat UI talking directly to Ollama ---
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    ports:
      - "8080:8080"
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      WEBUI_AUTH: "false"          # disable login for local dev convenience
    volumes:
      - open-webui:/app/backend/data
    depends_on:
      ollama:
        condition: service_healthy

  # --- Vector database ---
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant:/qdrant/storage

  # --- Semantic cache backing store (app/retrieval/semantic_cache.py) — Redis Stack,
  # not plain redis:7, because the semantic cache needs RediSearch's vector
  # KNN query support (FT.CREATE ... VECTOR, FT.SEARCH ... KNN), which the
  # base redis image doesn't ship.
  redis:
    image: redis/redis-stack-server:latest
    ports:
      - "6379:6379"
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # --- Langfuse tracing UI + its Postgres (also used by LiteLLM and, now,
  # app/agent/sql_store.py's structured-data tool — see postgres-init/02-appdata.sql) ---
  postgres:
    image: postgres:16
    # pg_stat_statements must be loaded at server start (shared_preload_libraries),
    # not just CREATE EXTENSION'd — it needs its own shared-memory hash table
    # allocated at postmaster startup. postgres-exporter's stat_statements
    # collector (docker-compose.yml's postgres-exporter service) reads this via
    # a plain SQL view once the extension is created in appdata (see `make`
    # target or the one-time `CREATE EXTENSION` run after this service restarts).
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements"]
    ports:
      - "5432:5432"   # exposed so app/agent/sql_store.py (host process) can connect directly
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse
      POSTGRES_DB: langfuse
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro   # creates litellm + appdata dbs on first start
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse"]
      interval: 10s
      timeout: 5s
      retries: 10

  # --- Prometheus exporters for postgres/redis above — co-located here
  # (not in docker-compose.observability.yml) since they need those
  # services' own credentials/in-network hostnames directly. Each publishes
  # its own metrics port to the host so the OPTIONAL observability stack
  # (`make obs-up`) can scrape it via host.docker.internal without any
  # shared Docker network — see docker-compose.observability.yml's header.
  # Neither is required for the app itself to run.
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    environment:
      # Points at appdata, not the "postgres" system database — verified
      # directly (--auto-discover-databases, despite the exporter's own docs
      # describing it as scraping every discovered database, is a no-op for
      # the stat_user_tables/statio_user_tables collectors on this exporter
      # version: they only ever query the single database the DSN itself
      # connects to). appdata is where this app's own tables (employees,
      # chat_sessions, crm_leads, ...) actually live — the ones worth adding
      # an index to. All the OTHER pg_stat_database/pg_locks/pg_stat_activity
      # metrics stay cluster-wide regardless (verified: they already showed
      # every database's rows even when this pointed at "postgres"), so this
      # change costs nothing for the rest of the dashboard.
      DATA_SOURCE_NAME: postgresql://langfuse:langfuse@postgres:5432/appdata?sslmode=disable
    # Both collectors are opt-in (disabled by default) since the exporter's own
    # --help warns pg_stat_statements can be expensive on a busy server — every
    # distinct query becomes its own timeseries. stat_statements.limit below
    # caps that; it also needs the pg_stat_statements extension actually
    # loaded in Postgres (postgres service's shared_preload_libraries) or this
    # collector just silently reports no data. stat_user_tables needs no such
    # extension — it's a built-in stats view — so it starts working immediately.
    command:
      - "--collector.stat_user_tables"
      - "--collector.stat_statements"
      - "--collector.stat_statements.include_query"
      - "--collector.stat_statements.limit=25"
    ports:
      - "9187:9187"
    depends_on:
      postgres:
        condition: service_healthy

  redis-exporter:
    image: oliver006/redis_exporter:latest
    environment:
      REDIS_ADDR: redis://redis:6379
    ports:
      - "9121:9121"
    depends_on:
      redis:
        condition: service_healthy

  # --- Host + per-container resource metrics, purely to power the
  # community "Docker and system monitoring (nodeexporter v1.3.1)" dashboard
  # (grafana.com id 16310 — observability/grafana/dashboards/docker-system-
  # monitoring.json; brought under this repo's own file-based provisioning
  # like every other dashboard there). Neither exporter is used by anything
  # else in this stack.
  #
  # On Docker Desktop for Mac, "host" metrics are actually the stats of
  # Docker Desktop's own hidden Linux VM, not the physical Mac — there is no
  # way to see real host hardware from inside any container on this
  # platform. On native Linux Docker both exporters report real host state.
  node-exporter:
    image: prom/node-exporter:latest
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
      - textfile_collector:/textfile-collector:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
      - "--collector.textfile.directory=/textfile-collector"
    ports:
      - "9100:9100"

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    # No /dev/kmsg device mount (the usual Linux cadvisor recipe) — that
    # path doesn't exist in Docker Desktop's VM and makes the container
    # crash-loop on Mac; omitting it is harmless on native Linux too, it
    # just means kernel-log-derived metrics (OOM events) stay unavailable.
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # KNOWN LIMITATION on Docker Desktop for Mac: cadvisor's
    # docker-container-factory (needed for human-readable container
    # names/labels, not just raw cgroup ids) talks to containerd, not
    # docker.sock — verified via its own startup log ("Registration of the
    # docker container factory failed: ... containerd.sock: no such file"),
    # and confirmed as a genuine upstream regression (google/cadvisor#3772,
    # still open) rather than a config mistake — cAdvisor 0.54.1+ made the
    # DOCKER factory require containerd too, when previously only the
    # separate containerd factory did; 0.54.0 (last good) registers the
    # docker factory fine but panics on this specific Docker Desktop
    # version's container metadata shape instead. Docker Desktop's
    # containerd lives entirely inside its own hidden Linux VM with no
    # bind-mountable path exposed to the host. So cAdvisor's own metrics
    # stay keyed by raw cgroup id (e.g. "/docker/<hash>") — the
    # container-name-mapper service below (docker.sock only, no cAdvisor
    # involved) supplies the id -> name join the dashboard's panels use
    # instead. Native Linux Docker doesn't have this gap since containerd's
    # socket is a normal host path there.
    ports:
      - "8081:8080"   # 8080 is already open-webui's port in this compose file

  # --- id -> name lookup for cadvisor's cgroup-id-only metrics above
  # (docker:cli is the official Docker CLI with no daemon — nothing else
  # here needs one). The dashboard's per-container panels join this in via
  # `* on(id) group_left(name) container_id_name_map{name=~"$container"}`,
  # which also doubles as the $container selector's actual filter.
  container-name-mapper:
    image: docker:cli
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./observability/textfile-collectors/container-name-map.sh:/container-name-map.sh:ro
      - textfile_collector:/textfile-collector
    entrypoint: ["/bin/sh", "/container-name-map.sh"]

  langfuse-web:
    image: langfuse/langfuse:2
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://langfuse:langfuse@postgres:5432/langfuse
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: demo-secret-change-me
      SALT: demo-salt-change-me
      TELEMETRY_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy

  # --- Object storage for uploaded documents (app/ingestion/object_store.py) — a
  # self-hosted, S3-compatible MinIO, consistent with this app's
  # fully-offline/self-hosted posture everywhere else (no real cloud
  # dependency for a demo). No healthcheck here, matching qdrant/litellm/
  # langfuse-web above: the official minio image ships no curl to probe
  # with, and this app's own object_store.py already degrades a
  # not-yet-ready MinIO into a clear upload-time error rather than
  # depending on compose-level health gating.
  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "9000:9000"   # S3 API — app/ingestion/object_store.py talks to this
      - "9001:9001"   # web console (http://localhost:9001) — browse uploads by hand
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio:/data

  # --- Real headless-Chromium rendering server for app/ingestion/web_crawler.py
  # (GRAPH_PATTERNS.md pattern 50) — crawl4ai's own official dockerized
  # server (verified tag exists on Docker Hub, matches the requirements.txt
  # pin exactly), NOT this app's own build: the browser now runs warm and
  # pooled in its own container instead of a fresh launch per tool call in
  # THIS app's process. Default profile (no `profiles:` key), unlike
  # opensandbox-server below — it needs no host Docker socket access, just
  # a published port like qdrant/redis, so there's no reason to gate it
  # behind an opt-in profile the way that one is.
  crawl4ai:
    image: unclecode/crawl4ai:0.9.3
    shm_size: 1g   # Chromium needs real /dev/shm — crawl4ai's own docker run docs
    ports:
      - "11235:11235"   # verified official default port (self-hosting.md), NOT 8000
    environment:
      # Required: crawl4ai 0.9.0+ is secure-by-default — without this, the
      # server binds loopback-only INSIDE its own container and the
      # published port above just connection-resets.
      CRAWL4AI_API_TOKEN: ${CRAWL4AI_API_TOKEN:-}
    healthcheck:
      # Verified this image ships curl (`docker run --entrypoint sh
      # unclecode/crawl4ai:0.9.3 -c "which curl"`) — /health needs no auth
      # per crawl4ai's own docs.
      test: ["CMD", "curl", "-f", "http://localhost:11235/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s   # crawl4ai's own docs: allow up to 40s startup

  # --- Real, isolated code-execution sandbox for every domain's sandbox
  # tools (ops/support/sales — app/domains/sandbox_tools.py, GRAPH_PATTERNS.md
  # pattern 50) — a
  # containerized, authenticated opensandbox-server (no official image
  # exists upstream, verified against OpenSandbox's own docs; this repo
  # builds its own from docker/opensandbox-server.{Dockerfile,toml}).
  #
  # Own opt-in "sandbox" profile, separate from "app" above: it needs
  # /var/run/docker.sock bind-mounted to create sibling sandbox containers
  # on the HOST daemon (OpenSandbox needs real Docker, so this is a socket
  # bind-mount, not Docker-in-Docker) — the SAME privilege a bare
  # `uvx opensandbox-server` host process already had as whatever user ran
  # it, just packaged differently, but sensitive enough to stay
  # deliberately opt-in like "app", under its OWN name since it's a
  # different concern (containerizing a third-party tool, not this app's
  # own roles). Bring it up with `make sandbox-up` (or
  # `docker compose --profile sandbox up -d --build`).
  opensandbox-server:
    build:
      context: .
      dockerfile: docker/opensandbox-server.Dockerfile
    profiles: ["sandbox"]
    restart: unless-stopped
    ports:
      - "8090:8090"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - opensandbox-data:/data
    environment:
      # Overrides docker/opensandbox-server.toml's (unset) server.api_key —
      # verified exact env var name against OpenSandbox's own
      # server/configuration.md. Required: current opensandbox-server
      # releases refuse to start in non-interactive mode without one.
      OPENSANDBOX_SERVER_API_KEY: ${OPENSANDBOX_API_KEY}

  # --- Containerized app roles (opt-in, NOT started by `make up`) ---
  #
  # Everyday dev/demo still runs `make serve`/`make agent-worker`/
  # `make ingest-worker` as host processes against the infra above (fast
  # --reload iteration, see Makefile) — that workflow is untouched. These
  # three services are the actual deployable artifact (see Dockerfile's own
  # header) for anyone who wants this stack running as containers instead;
  # behind the "app" profile so `docker compose up`/`make up` never starts
  # them by accident. Bring them up explicitly with `make up-app` (or
  # `docker compose --profile app up -d --build`).
  api:
    build: .
    profiles: ["app"]
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment: *app-env
    extra_hosts:
      - "host.docker.internal:host-gateway"   # so OTEL_EXPORTER_OTLP_ENDPOINT resolves on native Linux Docker too
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  agent-worker:
    build: .
    profiles: ["app"]
    restart: unless-stopped
    command: ["python", "-m", "app.turns.agent_worker"]
    environment: *app-env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Run several for independent scaling (GRAPH_PATTERNS.md pattern 43):
    #   docker compose --profile app up -d --scale agent-worker=3
    # Each replica pushes its own metrics via OTLP (app/core/telemetry.py) —
    # unlike a pull-based /metrics endpoint, scaling this doesn't need any
    # scrape-config change; the otel-collector aggregates all of them.

  # --- Per-domain agent-worker pools, containerized counterparts of
  # `make agent-worker-support`/`-ops`/`-sales` (Makefile) — same image/
  # command as `agent-worker` above, just AGENT_DOMAIN-scoped so the web
  # UI's X-Domain: support/ops/sales turns route to a worker that's
  # actually running when the app is brought up via `up-app` instead of
  # the host-native `make restart-all` path. Also gets these domains'
  # logs into Loki (observability/promtail/promtail-config.yaml's service
  # allowlist keys off these exact compose service names).
  agent-worker-support:
    build: .
    profiles: ["app"]
    restart: unless-stopped
    command: ["python", "-m", "app.turns.agent_worker"]
    environment:
      <<: *app-env
      AGENT_DOMAIN: support
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  agent-worker-ops:
    build: .
    profiles: ["app"]
    restart: unless-stopped
    command: ["python", "-m", "app.turns.agent_worker"]
    environment:
      <<: *app-env
      AGENT_DOMAIN: ops
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  agent-worker-sales:
    build: .
    profiles: ["app"]
    restart: unless-stopped
    command: ["python", "-m", "app.turns.agent_worker"]
    environment:
      <<: *app-env
      AGENT_DOMAIN: sales
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  ingest-worker:
    build: .
    profiles: ["app"]
    restart: unless-stopped
    command: ["python", "-m", "app.ingestion.ingest_worker"]
    environment: *app-env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started

volumes:
  ollama:
  qdrant:
  postgres:
  open-webui:
  redis:
  minio:
  opensandbox-data:
  textfile_collector:
