<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>practice-core-ai-1</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    max-width: 720px; margin: 0 auto; padding: 1rem;
    display: flex; flex-direction: column; height: 100vh; box-sizing: border-box;
  }
  header { display: flex; align-items: center; gap: .5rem; margin-bottom: .5rem; }
  header h1 { font-size: 1rem; margin: 0; flex: 1; }
  header input {
    font-size: .85rem; padding: .3rem .5rem; border-radius: 6px;
    border: 1px solid #8888; width: 8rem;
  }
  #messages { flex: 1; overflow-y: auto; padding: .5rem 0; }
  .msg { margin: .5rem 0; padding: .6rem .8rem; border-radius: 10px; max-width: 85%; }
  .msg.user { background: #2563eb; color: white; margin-left: auto; white-space: pre-wrap; }
  .msg.assistant { background: #8883; }
  .msg.system { background: transparent; color: #888; font-size: .85rem; font-style: italic; text-align: center; max-width: 100%; }
  .answer-text { white-space: pre-wrap; }
  .tool-line { font-size: .8rem; color: #888; margin: .2rem 0; }
  .citations {
    font-size: .78rem; color: #888; margin-top: .6rem; padding-top: .5rem;
    border-top: 1px solid #8884; display: flex; flex-direction: column; gap: .15rem;
  }
  .citations .citations-label { font-weight: 600; text-transform: uppercase; letter-spacing: .03em; font-size: .7rem; margin-bottom: .1rem; }
  .citations .citation-item { display: flex; gap: .4rem; }
  .citations .citation-marker { opacity: .7; flex-shrink: 0; }
  .followups { display: flex; flex-wrap: wrap; gap: .4rem; margin-top: .6rem; }
  .followups button {
    font-size: .8rem; padding: .35rem .7rem; border-radius: 999px;
    border: 1px solid #8888; background: transparent; cursor: pointer;
    color: inherit; font-family: inherit;
  }
  .followups button:hover { background: #8882; }
  form { display: flex; gap: .5rem; padding-top: .5rem; border-top: 1px solid #8884; flex-wrap: wrap; }
  input[type=text]#input { flex: 1; padding: .6rem; border-radius: 8px; border: 1px solid #8888; font-size: 1rem; }
  input[type=text]#imageUrl {
    flex-basis: 100%; padding: .4rem .6rem; border-radius: 8px; border: 1px solid #8888;
    font-size: .85rem; color: #888;
  }
  button[type=submit] { padding: .6rem 1rem; border-radius: 8px; border: none; background: #2563eb; color: white; cursor: pointer; }
  button[type=submit]:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>
<header>
  <h1>practice-core-ai-1</h1>
  <input id="principal" type="text" value="web-user" title="Your principal id (X-Principal-Id)">
</header>
<div id="messages"></div>
<form id="form">
  <input id="input" type="text" autocomplete="off" placeholder="Ask something..." autofocus>
  <button type="submit" id="send">Send</button>
  <input id="imageUrl" type="text" autocomplete="off" placeholder="Optional: image URL to attach (GRAPH_PATTERNS.md pattern 44)">
</form>
<script>
// Everything this page does talks ONLY to app/api.py's published endpoints
// (POST /chat/stream) and renders ONLY the documented SSE event vocabulary
// (token, tool_start, tool_end, citations, approval_required, error, done)
// — see GRAPH_PATTERNS.md's AR-033-style "no special-case endpoints" note.
// EventSource can't send custom headers or do POST, so this uses fetch()'s
// streaming response body directly and parses SSE framing by hand.

function randomId() {
  // crypto.randomUUID() only exists in a "secure context" (HTTPS, or
  // specifically localhost/127.0.0.1) — some ways of reaching this page
  // (a proxied URL, an IP address, an embedded webview) don't qualify,
  // and calling it there throws immediately at page load, before this
  // script ever reaches form.addEventListener below — every button on
  // the page silently does nothing. thread_id is a conversation
  // identifier, not a security boundary, so a non-cryptographic fallback
  // is fine here.
  if (typeof crypto !== "undefined" && typeof crypto.randomUUID === "function") {
    return crypto.randomUUID();
  }
  return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, (c) => {
    const r = (Math.random() * 16) | 0;
    const v = c === "x" ? r : (r & 0x3) | 0x8;
    return v.toString(16);
  });
}

const threadId = randomId();
const messagesEl = document.getElementById("messages");
const form = document.getElementById("form");
const input = document.getElementById("input");
const sendBtn = document.getElementById("send");
const principalEl = document.getElementById("principal");
const imageUrlEl = document.getElementById("imageUrl");

function addMessage(role, text) {
  const div = document.createElement("div");
  div.className = "msg " + role;
  div.textContent = text;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return div;
}

// The assistant bubble is a container, not a plain text node: an inner
// .answer-text span holds the streamed tokens, and citations/followups
// are appended as SEPARATE sibling elements below it. Keeping the
// streamed text in its own element (rather than doing
// assistantEl.textContent = ...) means a later citations/followups
// event can never accidentally wipe out a sibling appended before it,
// regardless of event ordering — structural, not just "the backend
// happens to send citations/followups last".
function addAssistantMessage() {
  const div = document.createElement("div");
  div.className = "msg assistant";
  const textSpan = document.createElement("span");
  textSpan.className = "answer-text";
  textSpan.textContent = "…"; // visible immediately; see send()'s comment
  div.appendChild(textSpan);
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return { el: div, textEl: textSpan };
}

function addToolLine(text) {
  const div = document.createElement("div");
  div.className = "tool-line";
  div.textContent = text;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function renderCitations(container, items) {
  const box = document.createElement("div");
  box.className = "citations";
  const label = document.createElement("div");
  label.className = "citations-label";
  label.textContent = "Sources";
  box.appendChild(label);
  for (const c of items) {
    const row = document.createElement("div");
    row.className = "citation-item";
    const marker = document.createElement("span");
    marker.className = "citation-marker";
    marker.textContent = c.marker;
    const title = document.createElement("span");
    title.textContent = c.title;
    row.appendChild(marker);
    row.appendChild(title);
    box.appendChild(row);
  }
  container.appendChild(box);
}

function renderFollowups(container, items) {
  const box = document.createElement("div");
  box.className = "followups";
  for (const question of items) {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.textContent = question;
    btn.addEventListener("click", () => {
      if (!sendBtn.disabled) send(question, "");
    });
    box.appendChild(btn);
  }
  container.appendChild(box);
}

async function send(text, imageUrl) {
  addMessage("user", imageUrl ? `${text}\n[attached image: ${imageUrl}]` : text);
  input.value = "";
  imageUrlEl.value = "";
  sendBtn.disabled = true;

  // A visible placeholder immediately, not an empty bubble — the first
  // token can take a while (a local Ollama model that's idled out of
  // memory has to reload before it generates anything), and an empty
  // div gives no visual sign a request is even in flight.
  const { el: assistantEl, textEl: assistantTextEl } = addAssistantMessage();
  let assistantText = "";

  try {
    const response = await fetch("/chat/stream", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "X-Tenant-Id": "acme",
        "X-Principal-Id": principalEl.value || "web-user",
      },
      body: JSON.stringify({
        message: text,
        thread_id: threadId,
        images: imageUrl ? [imageUrl] : [],
      }),
    });
    if (!response.ok || !response.body) {
      assistantTextEl.textContent = `[request failed: HTTP ${response.status}]`;
      return;
    }

    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";

    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });

      // SSE frames are separated by a blank line; each frame's payload
      // line is "data: {...json...}".
      let sepIndex;
      while ((sepIndex = buffer.indexOf("\n\n")) !== -1) {
        const frame = buffer.slice(0, sepIndex);
        buffer = buffer.slice(sepIndex + 2);
        const line = frame.split("\n").find((l) => l.startsWith("data: "));
        if (!line) continue;
        const event = JSON.parse(line.slice("data: ".length));
        handleEvent(event);
      }
    }
  } catch (err) {
    assistantTextEl.textContent = assistantText || `[error: ${err}]`;
  } finally {
    sendBtn.disabled = false;
    input.focus();
  }

  function handleEvent(event) {
    if (event.type === "token") {
      assistantText += event.content;
      assistantTextEl.textContent = assistantText;
      messagesEl.scrollTop = messagesEl.scrollHeight;
    } else if (event.type === "tool_start") {
      addToolLine(`🔧 ${event.tool}(${JSON.stringify(event.args)})`);
    } else if (event.type === "tool_end") {
      addToolLine(`✓ ${event.tool} finished`);
    } else if (event.type === "citations") {
      renderCitations(assistantEl, event.items);
    } else if (event.type === "followups") {
      renderFollowups(assistantEl, event.items);
    } else if (event.type === "approval_required") {
      addMessage(
        "system",
        "⏸ Paused: this would need human approval (" +
          event.tool_calls.map((t) => t.name).join(", ") +
          ") — there's no HTTP resume endpoint yet (see GRAPH_PATTERNS.md's " +
          "\"Extending Further\"); use `make chat-stream` or app/hitl_demo.py " +
          "to approve/reject this kind of action."
      );
    } else if (event.type === "error") {
      assistantTextEl.textContent = assistantText || `[error: ${event.content}]`;
    }
    messagesEl.scrollTop = messagesEl.scrollHeight;
    // "done" needs no rendering of its own — the assistant text is
    // already fully rendered by the time it arrives.
  }
}

form.addEventListener("submit", (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (text) send(text, imageUrlEl.value.trim());
});
</script>
</body>
</html>
