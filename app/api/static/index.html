<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>agent-core-demo</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    max-width: 720px; margin: 0 auto; padding: 1rem;
    display: flex; flex-direction: column; height: 100vh; box-sizing: border-box;
  }
  header { display: flex; align-items: center; gap: .5rem; margin-bottom: .5rem; }
  header h1 { font-size: 1rem; margin: 0; flex: 1; }
  header input {
    font-size: .85rem; padding: .3rem .5rem; border-radius: 6px;
    border: 1px solid #8888; width: 8rem;
  }
  header select#sessionSelect {
    font-size: .85rem; padding: .3rem .5rem; border-radius: 6px;
    border: 1px solid #8888; max-width: 12rem; background: transparent; color: inherit;
  }
  header select#sessionSelect:disabled { opacity: .5; }
  #messages { flex: 1; overflow-y: auto; padding: .5rem 0; }
  .msg { margin: .5rem 0; padding: .6rem .8rem; border-radius: 10px; max-width: 85%; }
  .msg.user { background: #2563eb; color: white; margin-left: auto; white-space: pre-wrap; }
  .msg.assistant { background: #8883; }
  .msg.system { background: transparent; color: #888; font-size: .85rem; font-style: italic; text-align: center; max-width: 100%; }

  /* Live turn status ("Thinking…" / "Using X…") — lives INSIDE the
     assistant bubble, above the tool-activity log and answer text, so it
     paints in the correct temporal position regardless of whether the
     backend emits tool_start before or after the first token (it always
     does, for a genuine tool call — see index.html's send()). Hidden
     (display:none) once real output/no-more-activity makes it stale,
     never removed, so re-showing it later needs no re-creation. */
  .status { font-size: .85rem; color: #888; margin-bottom: .3rem; }
  .status::after { content: ""; animation: ellipsis 1.2s steps(4, end) infinite; }
  @keyframes ellipsis { 0%, 100% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }

  /* Permanent record of tool calls this turn made — appended in real
     time, in order, ABOVE the answer text (never appended to the end of
     #messages the way earlier versions of this page did, which is what
     made tool activity visually land below an already-streaming answer
     regardless of the real event order). */
  .tool-activity { font-size: .8rem; color: #888; }
  .tool-activity-line { margin: .2rem 0; }
  .tool-activity-line.done { opacity: .75; }

  .answer-text { display: block; }
  .answer-text.muted-restatement { font-size: .8rem; opacity: .65; margin-top: .5rem; }
  .answer-text p { margin: 0 0 .6em; }
  .answer-text p:last-child { margin-bottom: 0; }
  .answer-text ul, .answer-text ol { margin: .3em 0 .6em; padding-left: 1.3em; }
  .answer-text li { margin: .15em 0; }
  .answer-text h1, .answer-text h2, .answer-text h3 { font-size: 1em; margin: .6em 0 .3em; }
  .answer-text code {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    background: #8882; padding: .1em .3em; border-radius: 4px; font-size: .9em;
  }
  .answer-text pre {
    background: #8882; padding: .6em .7em; border-radius: 8px; overflow-x: auto; margin: .4em 0;
  }
  .answer-text pre code { background: none; padding: 0; }
  .answer-text a { color: inherit; }

  .clarification, .approval {
    margin: .5rem 0; padding: .5rem .6rem; border-radius: 8px; background: #8882;
  }
  .clarification-question, .approval-question { font-size: .85rem; margin-bottom: .4rem; }

  .citations {
    font-size: .78rem; color: #888; margin-top: .6rem; padding-top: .5rem;
    border-top: 1px solid #8884; display: flex; flex-direction: column; gap: .15rem;
  }
  .citations .citations-label { font-weight: 600; text-transform: uppercase; letter-spacing: .03em; font-size: .7rem; margin-bottom: .1rem; }
  .citations .citation-item { display: flex; gap: .4rem; }
  .citations .citation-marker { opacity: .7; flex-shrink: 0; }
  .followups { display: flex; flex-wrap: wrap; gap: .4rem; margin-top: .6rem; }
  .followups button {
    font-size: .8rem; padding: .35rem .7rem; border-radius: 999px;
    border: 1px solid #8888; background: transparent; cursor: pointer;
    color: inherit; font-family: inherit;
  }
  .followups button:hover { background: #8882; }
  form { display: flex; gap: .5rem; padding-top: .5rem; border-top: 1px solid #8884; flex-wrap: wrap; }
  input[type=text]#input { flex: 1; padding: .6rem; border-radius: 8px; border: 1px solid #8888; font-size: 1rem; }
  .image-attach { flex-basis: 100%; display: flex; gap: .5rem; align-items: center; }
  input[type=text]#imageUrl {
    flex: 1; padding: .4rem .6rem; border-radius: 8px; border: 1px solid #8888;
    font-size: .85rem; color: #888;
  }
  label.drop-zone {
    font-size: .8rem; color: #888; padding: .4rem .7rem; border-radius: 8px;
    border: 1px dashed #8888; cursor: pointer; white-space: nowrap;
  }
  label.drop-zone.drag-over { border-color: #2563eb; color: #2563eb; background: #2563eb14; }
  .image-preview {
    flex-basis: 100%; display: flex; align-items: center; gap: .5rem;
    font-size: .8rem; color: #888; padding: .3rem .5rem; border-radius: 8px; background: #8882;
  }
  .image-preview img { width: 2rem; height: 2rem; object-fit: cover; border-radius: 4px; }
  .image-preview span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .image-preview button {
    border: none; background: transparent; color: inherit; cursor: pointer; font-size: .9rem;
    padding: 0 .3rem;
  }
  .vision-note { flex-basis: 100%; font-size: .72rem; color: #888; opacity: .8; }
  button[type=submit] { padding: .6rem 1rem; border-radius: 8px; border: none; background: #2563eb; color: white; cursor: pointer; }
  button[type=submit]:disabled { opacity: .5; cursor: default; }
  button#stop {
    padding: .6rem 1rem; border-radius: 8px; border: 1px solid #8888;
    background: transparent; color: inherit; font-family: inherit; cursor: pointer;
  }
  button#stop:hover { background: #8882; }
  .approval button:last-child { border-color: #dc262699; color: #dc2626; }

  details#uploadPanel {
    border: 1px solid #8884; border-radius: 8px; padding: .5rem .7rem; margin-bottom: .5rem;
    font-size: .85rem;
  }
  details#uploadPanel summary { cursor: pointer; color: #888; }
  details#uploadPanel summary:hover { color: inherit; }
  #uploadForm { display: flex; gap: .5rem; flex-wrap: wrap; margin-top: .5rem; }
  #uploadForm input[type=text] {
    flex: 1; min-width: 8rem; padding: .4rem .6rem; border-radius: 8px; border: 1px solid #8888;
    font-size: .85rem; background: transparent; color: inherit;
  }
  #uploadForm button {
    padding: .4rem .8rem; border-radius: 8px; border: none; background: #2563eb; color: white; cursor: pointer;
  }
  #uploadForm button:disabled { opacity: .5; cursor: default; }
  #uploadStatus { margin-top: .5rem; display: flex; flex-direction: column; gap: .3rem; }
  .upload-status-line { display: flex; align-items: center; gap: .4rem; font-size: .8rem; color: #888; }
  .upload-status-line .upload-filename { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .upload-status-line.upload-done { color: #16a34a; }
  .upload-status-line.upload-error { color: #dc2626; }
</style>
</head>
<body>
<header>
  <h1>agent-core-demo</h1>
  <select id="sessionSelect" title="Switch conversation"></select>
  <input id="principal" type="text" value="web-user" title="Your principal id (X-Principal-Id)">
</header>
<details id="uploadPanel">
  <summary>📄 Upload documents (PDF/DOCX) to the knowledge base</summary>
  <form id="uploadForm">
    <input id="uploadFiles" type="file" accept=".pdf,.docx" multiple>
    <input id="uploadTopic" type="text" placeholder="Optional topic">
    <button type="submit" id="uploadSubmit">Upload</button>
  </form>
  <div id="uploadStatus"></div>
</details>
<div id="messages"></div>
<form id="form">
  <input id="input" type="text" autocomplete="off" placeholder="Ask something..." autofocus>
  <button type="submit" id="send">Send</button>
  <button type="button" id="stop" hidden>Stop</button>
  <div class="image-attach">
    <input id="imageUrl" type="text" autocomplete="off" placeholder="Image URL (optional)">
    <label id="dropZone" for="imageFile" class="drop-zone">📎 or drop/choose an image</label>
    <input id="imageFile" type="file" accept="image/*" hidden>
  </div>
  <div id="imagePreview" class="image-preview" hidden>
    <img id="imagePreviewThumb" alt="">
    <span id="imagePreviewName"></span>
    <button type="button" id="imageRemove" title="Remove attached image">✕</button>
  </div>
  <div class="vision-note">
    Note: the default local model can't actually see attached images yet (no small local
    model this project verified supports vision + tool-calling together) — see
    GRAPH_PATTERNS.md pattern 44 for enabling real vision support.
  </div>
</form>
<script>
// Everything this page does talks ONLY to app/api.py's published endpoints
// (POST /chat/stream) and renders ONLY the documented SSE event vocabulary
// (token, tool_start, tool_end, citations, followups, approval_required,
// error, done) — see GRAPH_PATTERNS.md's AR-033-style "no special-case
// endpoints" note. EventSource can't send custom headers or do POST, so
// this uses fetch()'s streaming response body directly and parses SSE
// framing by hand.

function randomId() {
  // crypto.randomUUID() only exists in a "secure context" (HTTPS, or
  // specifically localhost/127.0.0.1) — some ways of reaching this page
  // (a proxied URL, an IP address, an embedded webview) don't qualify,
  // and calling it there throws immediately at page load, before this
  // script ever reaches form.addEventListener below — every button on
  // the page silently does nothing. thread_id is a conversation
  // identifier, not a security boundary, so a non-cryptographic fallback
  // is fine here.
  if (typeof crypto !== "undefined" && typeof crypto.randomUUID === "function") {
    return crypto.randomUUID();
  }
  return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, (c) => {
    const r = (Math.random() * 16) | 0;
    const v = c === "x" ? r : (r & 0x3) | 0x8;
    return v.toString(16);
  });
}

// Reassignable, not const: switching sessions (below) points this at a
// different, already-existing thread_id instead of the one generated at
// page load.
let threadId = randomId();
const messagesEl = document.getElementById("messages");
const form = document.getElementById("form");
const input = document.getElementById("input");
const sendBtn = document.getElementById("send");
const stopBtn = document.getElementById("stop");
const sessionSelect = document.getElementById("sessionSelect");
const principalEl = document.getElementById("principal");
const imageUrlEl = document.getElementById("imageUrl");
const dropZone = document.getElementById("dropZone");
const imageFileEl = document.getElementById("imageFile");
const imagePreviewEl = document.getElementById("imagePreview");
const imagePreviewThumbEl = document.getElementById("imagePreviewThumb");
const imagePreviewNameEl = document.getElementById("imagePreviewName");
const imageRemoveEl = document.getElementById("imageRemove");
const uploadForm = document.getElementById("uploadForm");
const uploadFilesEl = document.getElementById("uploadFiles");
const uploadTopicEl = document.getElementById("uploadTopic");
const uploadSubmitEl = document.getElementById("uploadSubmit");
const uploadStatusEl = document.getElementById("uploadStatus");

// A locally-picked/dropped file, base64-encoded — takes priority over
// imageUrlEl's URL text field when both are somehow set (see
// getAttachedImage() below). ChatRequest.images already accepts a data
// URI exactly like a real URL (GRAPH_PATTERNS.md pattern 44) — no backend
// change needed for this to reach the agent.
let attachedImageDataUri = null;

function headers() {
  return {
    "Content-Type": "application/json",
    "X-Tenant-Id": "acme",
    "X-Principal-Id": principalEl.value || "web-user",
  };
}

// Same identity headers, minus Content-Type — POST /ingest/upload is
// multipart/form-data, and the browser must set that header itself
// (it includes a random boundary string fetch() has no way to know
// ahead of time); forcing "application/json" here would make the
// request body unparseable server-side.
function multipartHeaders() {
  const h = headers();
  delete h["Content-Type"];
  return h;
}

// Reads a locally picked/dropped File as a base64 data URI and shows a
// thumbnail preview. Rejects anything that isn't an image client-side
// (accept="image/*" on the file input already steers the OS picker, but
// a DROPPED file bypasses that filter entirely — this is the actual
// enforcement point).
// Set alongside attachedImageDataUri, not re-derived from imageFileEl.files
// later — a DROPPED file never touches imageFileEl.files at all (only the
// native file picker populates that), so getAttachedImage() re-reading it
// would silently lose the filename for every drag-and-drop attachment.
let attachedImageName = null;

function handleImageFile(file) {
  if (!file || !file.type.startsWith("image/")) {
    addMessage("system", "That doesn't look like an image file.");
    return;
  }
  const reader = new FileReader();
  reader.onload = () => {
    attachedImageDataUri = reader.result;
    attachedImageName = file.name;
    imageUrlEl.value = ""; // a file attachment supersedes the URL field
    imagePreviewThumbEl.src = attachedImageDataUri;
    imagePreviewNameEl.textContent = file.name;
    imagePreviewEl.hidden = false;
  };
  reader.readAsDataURL(file);
}

function clearAttachedImage() {
  attachedImageDataUri = null;
  attachedImageName = null;
  imagePreviewEl.hidden = true;
  imagePreviewThumbEl.src = "";
  imageFileEl.value = "";
}

// A file attachment takes priority over the URL text field — send() only
// ever attaches ONE image per turn (matches ChatRequest.images being a
// list this app always populates with at most one entry today). Returns
// `{uri, label}` (uri is what's actually sent to the API; label is a
// short, human-readable stand-in for the chat bubble — a data URI can be
// megabytes of base64, never something to literally print) or `null` if
// nothing is attached.
function getAttachedImage() {
  if (attachedImageDataUri) {
    return { uri: attachedImageDataUri, label: attachedImageName || "attached image" };
  }
  const url = imageUrlEl.value.trim();
  return url ? { uri: url, label: url } : null;
}

imageFileEl.addEventListener("change", () => {
  if (imageFileEl.files[0]) handleImageFile(imageFileEl.files[0]);
});

imageRemoveEl.addEventListener("click", clearAttachedImage);

// Typing a URL after a file was already attached means the user changed
// their mind — the file attachment is what getAttachedImage() would
// otherwise still prefer, so clear it to avoid silently ignoring what
// they just typed.
imageUrlEl.addEventListener("input", () => {
  if (imageUrlEl.value.trim() && attachedImageDataUri) clearAttachedImage();
});

for (const evt of ["dragover", "dragleave", "drop"]) {
  dropZone.addEventListener(evt, (e) => e.preventDefault());
}
dropZone.addEventListener("dragover", () => dropZone.classList.add("drag-over"));
dropZone.addEventListener("dragleave", () => dropZone.classList.remove("drag-over"));
dropZone.addEventListener("drop", (e) => {
  dropZone.classList.remove("drag-over");
  const file = e.dataTransfer.files && e.dataTransfer.files[0];
  if (file) handleImageFile(file);
});

// Document upload (GRAPH_PATTERNS.md roadmap item #1) — a SEPARATE
// concept from the per-turn image attach above: this builds the
// retrievable knowledge base (POST /ingest/upload -> MinIO + a queued
// ingest job), not a one-turn multimodal attachment. Deliberately its own
// panel, not folded into the chat form, since uploading a document isn't
// "sending a message."
function addUploadStatusLine(filename) {
  const line = document.createElement("div");
  line.className = "upload-status-line";
  const name = document.createElement("span");
  name.className = "upload-filename";
  name.textContent = filename;
  const state = document.createElement("span");
  state.className = "upload-state";
  state.textContent = "uploading…";
  line.appendChild(name);
  line.appendChild(state);
  uploadStatusEl.appendChild(line);
  return { line, state };
}

// Streams one upload's progress (started/done/error — see
// app/api.py::ingest_stream) into its own status line, independently of
// every other file in the same batch — one slow or failing file never
// blocks or hides the others' outcomes.
async function trackIngestJob(filename, jobId) {
  const { line, state } = addUploadStatusLine(filename);
  try {
    const response = await fetch(`/ingest/stream/${encodeURIComponent(jobId)}`, {
      headers: headers(),
    });
    await pumpSSE(response, (event) => {
      if (event.type === "started") {
        state.textContent = "processing…";
      } else if (event.type === "done") {
        line.classList.add("upload-done");
        state.textContent = `✓ indexed (${event.chunks} chunk${event.chunks === 1 ? "" : "s"})`;
      } else if (event.type === "error") {
        line.classList.add("upload-error");
        state.textContent = `✕ ${event.content}`;
      }
    });
  } catch (err) {
    line.classList.add("upload-error");
    state.textContent = `✕ ${err}`;
  }
}

uploadForm.addEventListener("submit", async (e) => {
  e.preventDefault();
  const files = Array.from(uploadFilesEl.files || []);
  if (!files.length) return;

  uploadSubmitEl.disabled = true;
  const formData = new FormData();
  for (const file of files) formData.append("files", file);
  const topic = uploadTopicEl.value.trim();
  if (topic) formData.append("topic", topic);

  try {
    const response = await fetch("/ingest/upload", {
      method: "POST",
      headers: multipartHeaders(),
      body: formData,
    });
    if (!response.ok) {
      const body = await response.json().catch(() => ({}));
      addUploadStatusLine(files.map((f) => f.name).join(", ")).state.textContent =
        `✕ ${body.detail || `HTTP ${response.status}`}`;
      return;
    }
    const uploads = await response.json();
    uploadFilesEl.value = "";
    uploadTopicEl.value = "";
    for (const { filename, job_id } of uploads) {
      trackIngestJob(filename, job_id); // not awaited — each job tracks independently, in parallel
    }
  } catch (err) {
    addUploadStatusLine(files.map((f) => f.name).join(", ")).state.textContent = `✕ ${err}`;
  } finally {
    uploadSubmitEl.disabled = false;
  }
});

// The one turn this page can have in flight at a time (sendBtn.disabled
// enforces that there's never a second) — set at the start of send(),
// read by the Stop button, cleared once the turn is truly over (a "done"
// or terminal "error", NOT just "the current fetch's stream ended," since
// an approval_required pause ends a fetch's stream without ending the
// turn). `phase` distinguishes the two cases the Stop button needs to
// handle differently — see its click listener below.
let activeTurn = null;

function addMessage(role, text) {
  const div = document.createElement("div");
  div.className = "msg " + role;
  div.textContent = text;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return div;
}

// --- Minimal markdown -> HTML renderer, hand-written rather than a
// vendored library. This app's whole ethos is offline-first with no CDN
// dependency (GRAPH_PATTERNS.md pattern 29) — a "vendored" copy of a real
// library pasted in by hand here would be unverifiable against its real
// upstream release anyway, so a short, auditable, purpose-built renderer
// is more trustworthy than an opaque blob claiming to be a known library.
// Safety is structural, not a separate sanitizer bolted on afterward: the
// ENTIRE input is HTML-escaped FIRST, so the only tags that can ever
// appear in the output are the ones this function inserts itself —
// nothing from the model's own text (or, transitively, a prompt-injection
// attempt buried in retrieved document content the model might repeat)
// can ever become a live tag or attribute. Deliberately narrow scope,
// matched to what this app's concise assistant answers actually contain:
// bold/italic, inline code, fenced code blocks, links, headers, and
// paragraphs/lists — not a full CommonMark implementation.
function escapeHtml(s) {
  return s
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function safeHref(url) {
  // http(s)/mailto, or a relative/anchor link — never javascript:, data:,
  // or any other scheme that could execute on click.
  return /^(https?:|mailto:)/i.test(url) || /^[/#.]/.test(url) ? url : "#";
}

function renderBlock(block) {
  const lines = block.split("\n").filter((l) => l.length > 0);
  if (lines.length === 0) return "";
  // A block that's ENTIRELY a header or a restored-later code-block
  // placeholder passes through untouched, rather than getting wrapped in
  // a <p> (which would be redundant for a header, or invalid nesting
  // around the eventual <pre>).
  if (lines.length === 1 && /^(<h[1-3]>.*<\/h[1-3]>| B\d+ )$/.test(lines[0])) {
    return lines[0];
  }
  const isOrdered = lines.every((l) => /^\s*\d+\.\s+/.test(l));
  const isUnordered = lines.every((l) => /^\s*-\s+/.test(l));
  // Only "-" is treated as a bullet marker (not "*"): "*" is already used
  // for bold/italic, and a line like "* text *emphasis*" would otherwise
  // let the leading bullet asterisk pair up with the emphasis marker
  // instead of it — restricting bullets to "-" sidesteps that ambiguity
  // entirely rather than trying to disambiguate it.
  if (isOrdered || isUnordered) {
    const tag = isOrdered ? "ol" : "ul";
    const items = lines
      .map((l) => l.replace(/^\s*(?:\d+\.|-)\s+/, ""))
      .map((l) => `<li>${l}</li>`)
      .join("");
    return `<${tag}>${items}</${tag}>`;
  }
  return `<p>${lines.join("<br>")}</p>`;
}

function renderMarkdown(raw) {
  const codeBlocks = [];
  const inlineCode = [];

  let html = escapeHtml(raw);

  // Fenced code blocks first, pulled out (as an opaque placeholder) before
  // anything else can transform their contents.
  html = html.replace(/```[^\n]*\n([\s\S]*?)```/g, (_, code) => {
    codeBlocks.push(code.replace(/\n$/, ""));
    return ` B${codeBlocks.length - 1} `;
  });
  // Inline code, same reasoning.
  html = html.replace(/`([^`\n]+)`/g, (_, code) => {
    inlineCode.push(code);
    return ` I${inlineCode.length - 1} `;
  });

  // Links: [text](url). Runs before bold/italic so a bracketed link label
  // isn't itself mistaken for something else; url is narrowed by
  // safeHref, never trusted as-is. The url group allows ")" (not just
  // "[^)\s]+") and relies on regex backtracking to find the LAST ")"
  // before whitespace/end — otherwise a URL containing its own literal
  // ")" (e.g. a Wikipedia-style "...wiki/Foo_(bar)") would get truncated
  // at its first internal paren instead of the one that actually closes
  // the markdown link syntax.
  html = html.replace(/\[([^\]]+)\]\(([^\s]+)\)/g, (_, text, url) =>
    `<a href="${safeHref(url)}" target="_blank" rel="noopener noreferrer">${text}</a>`
  );

  // Bold before italic: "**x**" must be consumed as bold first, or the
  // italic rule would eat one "*" from each side and leave the other two
  // as literal asterisks.
  html = html.replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>");
  html = html.replace(/\*([^*\n]+)\*/g, "<em>$1</em>");

  html = html.replace(/^### (.*)$/gm, "<h3>$1</h3>");
  html = html.replace(/^## (.*)$/gm, "<h2>$1</h2>");
  html = html.replace(/^# (.*)$/gm, "<h1>$1</h1>");

  html = html.split(/\n{2,}/).map(renderBlock).join("\n");

  // Restore code — already HTML-escaped (it went through escapeHtml
  // before extraction above), so this is safe to insert verbatim now.
  html = html.replace(/ B(\d+) /g, (_, i) => `<pre><code>${codeBlocks[i]}</code></pre>`);
  html = html.replace(/ I(\d+) /g, (_, i) => `<code>${inlineCode[i]}</code>`);

  return html;
}

// The assistant bubble is a container, not a plain text node: a live
// .status line, a permanent .tool-activity log, and the .answer-text
// span are three SEPARATE elements in a fixed visual order (status, then
// activity, then answer) — so tool calls always render in the right
// place regardless of arrival order, and citations/followups (appended
// after .answer-text later) can never accidentally clobber a sibling.
function addAssistantMessage() {
  const div = document.createElement("div");
  div.className = "msg assistant";

  const statusEl = document.createElement("div");
  statusEl.className = "status";
  statusEl.textContent = "Thinking";
  div.appendChild(statusEl);

  const activityEl = document.createElement("div");
  activityEl.className = "tool-activity";
  div.appendChild(activityEl);

  const textSpan = document.createElement("span");
  textSpan.className = "answer-text";
  div.appendChild(textSpan);

  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return { el: div, textEl: textSpan, statusEl, activityEl };
}

function setStatus(statusEl, text) {
  if (text) {
    statusEl.textContent = text;
    statusEl.style.display = "";
  } else {
    statusEl.style.display = "none";
  }
}

function addToolActivityLine(activityEl, tool, args) {
  const line = document.createElement("div");
  line.className = "tool-activity-line";
  line.dataset.tool = tool;
  line.textContent = `🔧 ${tool}(${JSON.stringify(args)})`;
  activityEl.appendChild(line);
}

function markToolActivityDone(activityEl, tool) {
  const lines = activityEl.querySelectorAll(".tool-activity-line:not(.done)");
  for (let i = lines.length - 1; i >= 0; i--) {
    if (lines[i].dataset.tool === tool) {
      lines[i].classList.add("done");
      lines[i].textContent = lines[i].textContent.replace("🔧", "✓");
      break;
    }
  }
}

function renderCitations(container, items) {
  const box = document.createElement("div");
  box.className = "citations";
  const label = document.createElement("div");
  label.className = "citations-label";
  label.textContent = "Sources";
  box.appendChild(label);
  for (const c of items) {
    const row = document.createElement("div");
    row.className = "citation-item";
    const marker = document.createElement("span");
    marker.className = "citation-marker";
    marker.textContent = c.marker;
    const title = document.createElement("span");
    title.textContent = c.title;
    row.appendChild(marker);
    row.appendChild(title);
    box.appendChild(row);
  }
  container.appendChild(box);
}

function renderFollowups(container, items) {
  const box = document.createElement("div");
  box.className = "followups";
  for (const question of items) {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.textContent = question;
    btn.addEventListener("click", () => {
      if (!sendBtn.disabled) send(question, null);
    });
    box.appendChild(btn);
  }
  container.appendChild(box);
}

// ask_clarification's options, rendered as the SAME clickable-chip pattern
// followups already uses — inserted BEFORE the answer text (which will,
// per SYSTEM_PROMPT, restate this same question+options as plain text on
// the model's very next turn) so the actionable buttons are what a user's
// eye lands on first; the redundant restatement is shrunk via
// .muted-restatement rather than hidden outright, so nothing disappears
// if the model phrases it slightly differently than expected.
function renderClarification(container, beforeEl, question, options) {
  const box = document.createElement("div");
  box.className = "clarification";
  const label = document.createElement("div");
  label.className = "clarification-question";
  label.textContent = question;
  box.appendChild(label);
  const btnRow = document.createElement("div");
  btnRow.className = "followups";
  for (const option of options) {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.textContent = option;
    btn.addEventListener("click", () => {
      if (!sendBtn.disabled) send(option, null);
    });
    btnRow.appendChild(btn);
  }
  box.appendChild(btnRow);
  container.insertBefore(box, beforeEl);
}

// A real approve/reject UI for approval_required (previously a dead-end
// text message — see GRAPH_PATTERNS.md's "Extending Further" note this
// replaces: POST /chat/resume now exists). Removes itself the moment
// either button is clicked, before onDecision runs, so a double-click
// can't fire two decisions for the same pause.
function renderApprovalButtons(container, beforeEl, toolCalls, onDecision) {
  const box = document.createElement("div");
  box.className = "approval";
  const label = document.createElement("div");
  label.className = "approval-question";
  label.textContent =
    "⏸ Approve this action? " +
    toolCalls.map((t) => `${t.name}(${JSON.stringify(t.args)})`).join(", ");
  box.appendChild(label);
  const btnRow = document.createElement("div");
  btnRow.className = "followups";
  const approveBtn = document.createElement("button");
  approveBtn.type = "button";
  approveBtn.textContent = "Approve";
  approveBtn.addEventListener("click", () => {
    box.remove();
    onDecision(true);
  });
  const rejectBtn = document.createElement("button");
  rejectBtn.type = "button";
  rejectBtn.textContent = "Reject";
  rejectBtn.addEventListener("click", () => {
    box.remove();
    onDecision(false);
  });
  btnRow.appendChild(approveBtn);
  btnRow.appendChild(rejectBtn);
  box.appendChild(btnRow);
  container.insertBefore(box, beforeEl);
}

// Parses one fetch() Response's SSE body and dispatches each frame to
// handleEvent — factored out so both the initial turn and a later
// /chat/resume (continuing the SAME assistant bubble) can drive events
// through identical parsing/dispatch logic.
async function pumpSSE(response, handleEvent) {
  if (!response.ok || !response.body) {
    throw new Error(`HTTP ${response.status}`);
  }
  const reader = response.body.getReader();
  const decoder = new TextDecoder();
  let buffer = "";
  while (true) {
    const { value, done } = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, { stream: true });
    let sepIndex;
    while ((sepIndex = buffer.indexOf("\n\n")) !== -1) {
      const frame = buffer.slice(0, sepIndex);
      buffer = buffer.slice(sepIndex + 2);
      const line = frame.split("\n").find((l) => l.startsWith("data: "));
      if (!line) continue;
      handleEvent(JSON.parse(line.slice("data: ".length)));
    }
  }
}

function finishTurn() {
  activeTurn = null;
  sendBtn.disabled = false;
  stopBtn.hidden = true;
  sessionSelect.disabled = false;
  input.focus();
  // Refresh the switcher — a brand-new thread_id's first turn just
  // completed, so app/sessions.py::upsert_session has a row for it now
  // that wasn't there when the page loaded (or the last refresh ran).
  loadSessions();
}

async function send(text, image) {
  addMessage("user", image ? `${text}\n[attached image: ${image.label}]` : text);
  input.value = "";
  imageUrlEl.value = "";
  clearAttachedImage();
  sendBtn.disabled = true;
  stopBtn.hidden = false;
  sessionSelect.disabled = true;

  const { el: assistantEl, textEl: assistantTextEl, statusEl, activityEl } = addAssistantMessage();
  let assistantText = "";

  // Re-parsing + re-rendering markdown on every single token would be
  // wasteful over a long streamed answer (worse than plain textContent
  // reassignment) — throttled to one render per ~50ms of token activity,
  // with one guaranteed final render once each stream ends so the last
  // few tokens are never left unflushed.
  let renderPending = false;
  function scheduleRender() {
    if (renderPending) return;
    renderPending = true;
    setTimeout(() => {
      renderPending = false;
      assistantTextEl.innerHTML = renderMarkdown(assistantText);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }, 50);
  }
  function finalRender() {
    if (assistantText) assistantTextEl.innerHTML = renderMarkdown(assistantText);
  }

  // Shared by the initial turn AND any later /chat/resume round trip
  // (approval_required pauses mid-turn, doesn't end it) — both drive
  // events into this SAME assistant bubble via this ONE closure, so a
  // resumed tool call/answer appends to the SAME message the user
  // approved, not a new one.
  function handleEvent(event) {
    if (event.type === "token") {
      setStatus(statusEl, null);
      assistantText += event.content;
      scheduleRender();
    } else if (event.type === "tool_start") {
      setStatus(statusEl, `Using ${event.tool}`);
      addToolActivityLine(activityEl, event.tool, event.args);
      if (event.tool === "ask_clarification" && event.args && Array.isArray(event.args.options)) {
        assistantTextEl.classList.add("muted-restatement");
        renderClarification(assistantEl, assistantTextEl, event.args.question, event.args.options);
      }
    } else if (event.type === "tool_end") {
      markToolActivityDone(activityEl, event.tool);
      setStatus(statusEl, "Thinking");
    } else if (event.type === "citations") {
      renderCitations(assistantEl, event.items);
    } else if (event.type === "followups") {
      renderFollowups(assistantEl, event.items);
    } else if (event.type === "approval_required") {
      setStatus(statusEl, null);
      if (activeTurn) activeTurn.phase = "paused";
      renderApprovalButtons(assistantEl, assistantTextEl, event.tool_calls, (approved) => {
        resume(approved);
      });
      // Deliberately does NOT call finishTurn() — the turn is paused, not
      // over; sendBtn/stopBtn stay in their "a turn is active" state
      // until the resume below reaches a real terminal event.
    } else if (event.type === "error") {
      setStatus(statusEl, null);
      assistantTextEl.classList.remove("muted-restatement");
      if (event.code === "cancelled") {
        // A deliberate stop, not a failure — rendered as a quiet status
        // line, not an alarming error message (the user already knows
        // they clicked Stop).
        assistantTextEl.textContent = assistantText || "Stopped.";
      } else {
        assistantTextEl.textContent = assistantText || `[error: ${event.content}]`;
      }
      finishTurn();
    } else if (event.type === "done") {
      finalRender();
      finishTurn();
    }
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  // Set now (handleEvent above is defined but not yet called) — the Stop
  // button reads activeTurn.handleEvent to pump /chat/cancel's own SSE
  // response through the SAME rendering logic when this turn is paused.
  activeTurn = { threadId, phase: "streaming", handleEvent };

  async function resume(approved) {
    setStatus(statusEl, approved ? "Resuming" : "Cancelling that action");
    if (activeTurn) activeTurn.phase = "streaming";
    try {
      const response = await fetch("/chat/resume", {
        method: "POST",
        headers: headers(),
        body: JSON.stringify({ thread_id: threadId, approved }),
      });
      await pumpSSE(response, handleEvent);
      // pumpSSE returning without handleEvent having seen "done"/"error"
      // (e.g. the connection just closed) still needs the UI unstuck.
      if (activeTurn) {
        finalRender();
        finishTurn();
      }
    } catch (err) {
      setStatus(statusEl, null);
      assistantTextEl.textContent = `[resume failed: ${err}]`;
      finishTurn();
    }
  }

  try {
    const response = await fetch("/chat/stream/queued", {
      method: "POST",
      headers: headers(),
      body: JSON.stringify({
        message: text,
        thread_id: threadId,
        images: image ? [image.uri] : [],
      }),
    });
    await pumpSSE(response, handleEvent);
    // Same "still unstuck even with no explicit terminal event" guard as
    // resume() above — covers a paused turn too: if the pump ended on
    // approval_required, activeTurn.phase is now "paused" and MUST stay
    // active (not finished here); only tidy up if nothing is pending.
    if (activeTurn && activeTurn.phase !== "paused") {
      finalRender();
      finishTurn();
    }
  } catch (err) {
    setStatus(statusEl, null);
    assistantTextEl.textContent = assistantText || `[error: ${err}]`;
    finishTurn();
  }
}

// A replayed message from GET /chat/sessions/{thread_id}/messages — a
// static bubble, not a live one: no status line, no tool-activity log
// (that transcript endpoint only ever returns user/assistant text, see
// app/agent.py::get_session_messages' own docstring for why — this
// replays the conversational back-and-forth, not a forensic trace of
// which tools ran).
function addStaticAssistantMessage(text) {
  const div = document.createElement("div");
  div.className = "msg assistant";
  const textSpan = document.createElement("span");
  textSpan.className = "answer-text";
  textSpan.innerHTML = renderMarkdown(text);
  div.appendChild(textSpan);
  messagesEl.appendChild(div);
  return div;
}

// Populates the session switcher from GET /chat/sessions — called once at
// load and again whenever the set of sessions might have changed (a turn
// just finished, the principal field changed to a different identity).
// Best-effort: a failure here just leaves the dropdown as it was, never
// blocks anything else on the page.
async function loadSessions() {
  try {
    const response = await fetch("/chat/sessions", { headers: headers() });
    if (!response.ok) return;
    const list = await response.json();
    sessionSelect.innerHTML = "";
    const newOption = document.createElement("option");
    newOption.value = "";
    newOption.textContent = "+ New conversation";
    sessionSelect.appendChild(newOption);
    for (const s of list) {
      const option = document.createElement("option");
      option.value = s.thread_id;
      option.textContent = s.title;
      sessionSelect.appendChild(option);
    }
    // Reflect whichever thread_id is actually live right now, even if
    // it's a brand-new one this fetch's own snapshot doesn't list yet
    // (nothing to select in that case — the "+ New conversation" option
    // simply stays selected, which is accurate).
    sessionSelect.value = threadId;
  } catch (_err) {
    // Best-effort — see this function's own docstring above.
  }
}

// Switches the page to an EXISTING thread_id and replays its transcript.
// Not used for starting a new conversation (the "+ New conversation"
// option's own handler below just resets threadId directly, since there's
// nothing to fetch for a thread_id that doesn't exist yet).
async function switchToSession(newThreadId) {
  threadId = newThreadId;
  messagesEl.innerHTML = "";
  try {
    const response = await fetch(`/chat/sessions/${encodeURIComponent(newThreadId)}/messages`, {
      headers: headers(),
    });
    if (!response.ok) return;
    const transcript = await response.json();
    for (const m of transcript) {
      if (m.role === "user") addMessage("user", m.text);
      else addStaticAssistantMessage(m.text);
    }
    messagesEl.scrollTop = messagesEl.scrollHeight;
  } catch (_err) {
    addMessage("system", "Could not load that conversation.");
  }
}

sessionSelect.addEventListener("change", () => {
  const selected = sessionSelect.value;
  if (selected) {
    if (selected !== threadId) switchToSession(selected);
  } else {
    // "+ New conversation" — a fresh, not-yet-persisted thread_id; the
    // switcher will pick it up once its first turn completes (finishTurn
    // calls loadSessions() again).
    threadId = randomId();
    messagesEl.innerHTML = "";
  }
});

// Re-scope the switcher the moment the caller's identity changes — these
// sessions belong to tenant+principal (app/sessions.py), so a different
// principal has a completely different list. "change" (fires on blur),
// not "input" (fires per keystroke) — no reason to refetch mid-typing.
principalEl.addEventListener("change", loadSessions);

loadSessions();

// Two independent mechanisms, matching POST /chat/cancel's own design
// (app/api.py) — which one actually does something depends on whether
// the active turn is streaming or paused:
//  - Paused (approval buttons showing, nothing in flight): this fetch's
//    OWN SSE response is the real outcome, so it's pumped through the
//    SAME handleEvent the paused turn was already using.
//  - Streaming: nothing to pump — this call just requests the stop
//    server-side, and the ALREADY-RUNNING pump loop above will pick up
//    the resulting cancelled/terminal event on its own via the worker's
//    cancel_check, exactly like any other terminal event.
stopBtn.addEventListener("click", async () => {
  if (!activeTurn) return;
  const { threadId: tid, phase } = activeTurn;
  const wasPaused = phase === "paused";
  try {
    const response = await fetch("/chat/cancel", {
      method: "POST",
      headers: headers(),
      body: JSON.stringify({ thread_id: tid }),
    });
    if (wasPaused) {
      // The pending approval buttons are still in the DOM (nothing
      // resolved them) — nothing more to render for them; the cancel
      // confirmation lands as a normal terminal event on the bubble via
      // the closure captured when this turn was created.
      const currentHandler = activeTurn && activeTurn.handleEvent;
      if (currentHandler) await pumpSSE(response, currentHandler);
      else await response.body?.cancel();
    } else {
      // Streaming case: this response's own body is a side-channel
      // confirmation this page doesn't need (the already-running pump
      // loop above is the real source of truth) — drop it rather than
      // leaving it unconsumed.
      await response.body?.cancel();
    }
  } catch (_err) {
    // Best-effort — the streaming case's own pump loop is the real
    // source of truth for whether the stop actually took effect.
  }
});

form.addEventListener("submit", (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (text && !activeTurn) send(text, getAttachedImage());
});
</script>
</body>
</html>
