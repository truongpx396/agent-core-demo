# LiteLLM proxy configuration.
# Demonstrates: model aliases/routing, chat + embedding models, retries,
# fallbacks, and shipping every call to Langfuse from the proxy itself.

model_list:
  # Primary chat model. NOTE: use the `ollama_chat/` provider (not `ollama/`) —
  # it hits Ollama's /api/chat endpoint with *native* tool calling. The plain
  # `ollama/` provider fakes tools via prompt injection and loops on tool use.
  - model_name: chat
    litellm_params:
      model: ollama_chat/qwen2.5:3b
      # host.docker.internal, not the "ollama" service name: this targets a
      # native macOS Ollama on the host, not the docker-compose container.
      # Docker Desktop on Mac can't pass Metal/GPU through to a container,
      # so the containerized Ollama runs CPU-only — verified empirically at
      # ~9x slower per-turn (10.76s vs 1.18s total on a 575-token RAG-sized
      # prompt, same model, warm) than the native install hitting GPU
      # ("100% GPU" per `ollama ps`). The docker ollama container is still
      # up (see its service block) purely to serve open-webui's own chat UI.
      api_base: http://host.docker.internal:11434
  # A second chat entry used purely as a fallback target for "chat".
  - model_name: chat-backup
    litellm_params:
      model: ollama_chat/qwen2.5:3b
      api_base: http://host.docker.internal:11434
  # Vision-capable alias slot (GRAPH_PATTERNS.md pattern 44) — "chat" above
  # (qwen2.5:3b) has no vision capability, so an attached image is carried
  # through the pipeline correctly but the model can't actually see it.
  #
  # IMPORTANT, verified empirically: neither small local Ollama vision
  # model this session tried (moondream, qwen2.5vl:3b — both pulled and
  # tested directly against this deployment's real Ollama) supports
  # Ollama's native tool-calling ("does not support tools", from Ollama
  # itself) — and make_agent_node's agent() always binds this app's tools
  # to CHAT_MODEL regardless of whether a given turn attaches an image, so
  # BOTH failed through this app's actual agent loop despite each working
  # correctly called directly (outside this app, with no tools bound).
  # This alias is left pointed at qwen2.5vl:3b as a ready-made slot, not
  # a working default — genuinely exercising real image understanding
  # through this app's tool-bound agent needs either a larger local model
  # Ollama might support tool+vision on, or (more reliably today) a real
  # cloud-hosted OpenAI-compatible vision endpoint substituted for
  # OPENAI_API_BASE — a config change, not a code change, thanks to this
  # app's model-alias architecture (pattern 38).
  - model_name: vision
    litellm_params:
      model: ollama_chat/qwen2.5vl:3b
      api_base: http://ollama:11434
  # Embedding model (alias "embed" -> Ollama nomic-embed-text)
  - model_name: embed
    litellm_params:
      model: ollama/nomic-embed-text
      api_base: http://host.docker.internal:11434

litellm_settings:
  drop_params: true                    # silently drop params Ollama doesn't support (e.g. encoding_format)
  num_retries: 2                       # retry transient failures
  request_timeout: 600
  # If "chat" fails, transparently retry on "chat-backup".
  fallbacks: [{"chat": ["chat-backup"]}]
  # Log every request/response to Langfuse from the proxy layer, and expose
  # LiteLLM's own built-in request/latency/token metrics for Prometheus to
  # scrape at GET /metrics (see docker-compose.observability.yml's
  # prometheus service — this is a separate metrics surface from this
  # app's own OTel metrics in app/core/metrics.py, at the proxy layer
  # rather than the agent layer).
  success_callback: ["langfuse", "prometheus"]
  failure_callback: ["langfuse", "prometheus"]
  # /metrics requires a LiteLLM API key by default (v1.85.0+) — disabled
  # here for local scraping simplicity; a real deployment would instead
  # keep auth on and configure Prometheus's scrape config with a
  # bearer_token pointing at a real LiteLLM key.
  require_auth_for_metrics_endpoint: false

general_settings:
  master_key: sk-anything              # matches OPENAI_API_KEY in .env
