# PRODUCTION Alertmanager config, mounted by docker-compose.observability.prod.yml.
# alertmanager.yml (the local/demo file) deliberately has no receiver; mounting THAT
# in production meant no alert was ever delivered to anyone (spec 008 A7) while the
# Alerts tab looked healthy. This one has a real receiver, and the compose file refuses
# to start without the secret it needs, so a deployment cannot be quietly alert-deaf.
#
# The Slack incoming-webhook URL is a secret and Alertmanager does no environment
# expansion, so it is read from a file (`api_url_file`). The compose file writes that file
# from ALERTMANAGER_SLACK_WEBHOOK_URL (this droplet's .env, see
# deploy/env/observability.prod.env.example) just before starting Alertmanager.
#
# Severities come from observability/prometheus/alerts.yml. `critical` ones — spend that
# is not being recorded, a daily allowance that is not being enforced, a total worker
# outage — repeat hourly and notify fast; everything else repeats every 4 hours. To add
# a pager (PagerDuty, Opsgenie), add a receiver with its own *_configs block and route
# `severity="critical"` to it; the structural test in tests/core/test_alertmanager_config.py
# only requires that every receiver actually notifies somewhere.
global:
  resolve_timeout: 5m

route:
  receiver: slack
  group_by: ["alertname"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers:
        - severity="critical"
      receiver: slack
      group_wait: 10s
      repeat_interval: 1h

receivers:
  - name: slack
    slack_configs:
      - api_url_file: /tmp/slack_webhook_url
        send_resolved: true
        title: '[{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}] {{ .CommonLabels.alertname }} ({{ .CommonLabels.severity }})'
        text: |-
          {{ range .Alerts }}• {{ .Annotations.summary }}
          {{ .Annotations.description }}
          {{ end }}
