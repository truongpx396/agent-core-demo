# Fixed `uid`s (not Grafana's auto-generated ones) so the dashboard JSON in
# ../dashboards/*.json can reference these datasources by a stable id
# regardless of provisioning order or how many times this stack has been
# torn down and recreated.
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      timeInterval: 15s

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: true

  # Flame graphs (specs/022): Explore -> Pyroscope, application `agent-core-api` / `agent-core-agent-worker` / `agent-core-ingest-worker`,
  # profile type process_cpu, filtered by the `domain` and `replica` tags. Nothing else in this stack depends on it being up.
  - name: Pyroscope
    uid: pyroscope
    type: grafana-pyroscope-datasource
    access: proxy
    url: http://pyroscope:4040
    editable: true
