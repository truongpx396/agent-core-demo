# Single-binary, filesystem-backed Loki — no object store dependency,
# consistent with this app's fully-offline/self-hosted posture everywhere
# else (see the main docker-compose.yml's MinIO comment for the same
# reasoning applied to object storage).
auth_enabled: false

server:
  http_listen_port: 3100

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 168h  # 7 days — bounded local disk use for a demo
  reject_old_samples: true
  reject_old_samples_max_age: 168h
