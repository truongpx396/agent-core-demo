# Alert rules over app/core/metrics.py's own metrics (via the otel-collector
# scrape target) plus basic target-health rules for the infra scrape
# targets. Thresholds here are reasonable illustrative defaults for a demo
# — tune them (and wire a real receiver into
# ../alertmanager/alertmanager.yml) against real traffic before relying on
# this for a production tenant.
groups:
  - name: agent-core-slo
    rules:
      - alert: HighTurnErrorRate
        expr: |
          sum(rate(agent_requests_total{outcome="error"}[5m]))
          /
          sum(rate(agent_requests_total[5m]))
          > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Agent turn error rate above 5%"
          description: >-
            {{ $value | humanizePercentage }} of agent turns ended in
            outcome="error" over the last 5m (agent_requests_total).

      - alert: TurnsAbandoned
        expr: increase(agent_requests_total{outcome="abandoned"}[15m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Agent turns are being abandoned mid-run"
          description: >-
            agent_requests_total{outcome="abandoned"} increased — a turn's event
            stream was closed before it reached a terminal event, i.e. the worker
            stopped consuming it (publishing to the results stream failed, usually
            Redis, or its task was cancelled while publishing). The job is acked and
            is NOT retried: the person gets a generic error if the results stream
            still answers and nothing if it does not, and any write the turn had
            already made stays committed. One is enough on purpose: a graceful
            worker shutdown awaits its in-flight turns, so a deploy does not
            produce these. Check Redis, then the worker logs for
            agent_worker_turn_failed.

      - alert: HighTurnLatencyP95
        expr: |
          histogram_quantile(0.95, sum(rate(agent_latency_seconds_bucket[5m])) by (le)) > 30
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Agent turn p95 latency above 30s"
          description: "p95 end-to-end turn latency (agent_latency_seconds) has been over 30s for 10m."

      - alert: HighToolErrorRate
        expr: |
          sum(rate(agent_tool_errors_total[5m]))
          /
          sum(rate(agent_tool_calls_total[5m]))
          > 0.1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Tool call error rate above 10%"
          description: "agent_tool_errors_total / agent_tool_calls_total has been over 10% for 10m."

      - alert: TenantBudgetExceeded
        expr: increase(agent_budget_exceeded_total{scope="tenant"}[1h]) > 0
        labels:
          severity: warning
        annotations:
          summary: "A tenant hit a cost ceiling"
          description: >-
            agent_budget_exceeded_total{scope="tenant"} increased in the last hour —
            some tenant's turns are being refused for exceeding its daily
            (MAX_COST_USD_PER_TENANT_PER_DAY) or monthly
            (MAX_COST_USD_PER_TENANT_PER_MONTH) limit. The `window` label says
            which; the refusal is logged with the tenant (`budget_exceeded`).
            Renamed from TenantDailyCostBudgetExceeded when the monthly limit
            was added.

      - alert: TenantBudgetNearLimit
        expr: increase(agent_budget_threshold_total{scope="tenant", threshold="95"}[30m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "A tenant is within 5% of a cost ceiling"
          description: >-
            Turns were served in the last 30m for a tenant already at 95% or more
            of its daily or monthly limit (`window` says which). The next ones
            will be refused: time to raise the limit or talk to the tenant. The
            crossing is logged once per day or month as `budget_threshold_crossed`,
            with the tenant. Personal limits are deliberately not alerted: a
            person reaching their own cap is the guard rail working, not an
            operator's problem.

      - alert: ModelUsageUnpriced
        expr: increase(agent_unpriced_usage_total[15m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "Tokens are being spent on a model with no known price"
          description: >-
            agent_unpriced_usage_total increased in the last 15m — LiteLLM reports no
            price for a model that served calls, so the per-turn, per-subagent and
            per-tenant dollar ceilings read $0 for that spend. Set input/output
            cost under that model's `model_info` in the LiteLLM config.

      - alert: UsageEventWriteFailing
        expr: increase(agent_cost_governance_degraded_total{path="usage_event_write"}[10m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "Model calls are being made and their usage events are not recorded"
          description: >-
            A per-call usage event failed to write in the last 10m. The turn succeeded, so
            nobody was told: that call is missing from the billing meter, which is lost revenue
            the moment usage is billed, and from the spend the dollar caps sum, so a tenant's
            allowance undercounts by that call. Check the appdata Postgres. Reconcile the gap against
            the gateway spend log (grouped by `end_user`) before it ages out of any provider's
            reporting window.

      - alert: UsageEventTableMissing
        expr: increase(agent_cost_governance_degraded_total{path="usage_event_table_missing"}[10m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "The usage_events table does not exist: no model call is being metered"
          description: >-
            postgres-init/19-usage-events.sql has not been applied to this database (init
            scripts run only on a fresh volume). Apply it once with
            `psql -U langfuse -d appdata -f postgres-init/19-usage-events.sql`. Turns are served, but the
            dollar caps sum this table too: with it missing their spend read fails as well
            (TenantAllowanceUnenforced), and under the default BUDGET_CHECK_FAILURE_POLICY=open
            every turn runs unchecked until it is applied.

      - alert: BillingEventWriteFailing
        expr: increase(agent_cost_governance_degraded_total{path="billing_event_write"}[10m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "Usage is being used and its billing record is not being written"
          description: >-
            The package could not record a unit of usage for billing in the last 10m (or was handed one it refused as invalid: the log line
            `billing_usage_rejected` names the field). The caller's own record and the request it belongs to succeeded, so nobody was told: that usage
            is missing from the billing record, which is revenue lost the moment it is billed, and no later check can find it because
            the wallet reconciliation only sees what was recorded. Check the appdata Postgres and that the package's schema scripts (`make billing-migrate`; `postgres-init/24-` and `25-` on a fresh volume) are applied
            (`credit-billing-migrate --status`). Compare the caller's own meter with the upstream it pays (the agent app: `make usage-reconcile`)
            to size the gap before it ages out of any provider's reporting window.

      - alert: CreditDebitFailing
        expr: increase(agent_cost_governance_degraded_total{path="credit_debit"}[10m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "Usage is being recorded but a tenant's credits are not being charged"
          description: >-
            A usage event was recorded and the wallet debit for it failed in the last 10m. The caller succeeded and the event is kept (a lost
            event cannot be repaired, an uncharged one can), so nobody was told: that tenant has had usage it was not charged for, and its
            balance is higher than it should be. Check the appdata Postgres, and that the package's schema scripts (`make billing-migrate`; `postgres-init/24-` and `25-` on a fresh volume) are applied. The debit key IS the event id, so each
            missed charge can be replayed from its event; `credit-billing-reconcile` lists them (`uncharged`).

      - alert: BillingWebhookQuarantined
        expr: increase(agent_billing_webhook_total{outcome="quarantined"}[10m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "A payment-provider event was quarantined: a customer may have paid and received nothing"
          description: >-
            A webhook was quarantined in the last 10m and nobody is retrying it (the provider was told 2xx,
            because retrying cannot fix it). Find it with
            `SELECT provider, event_id, event_type, error_class, received_at FROM billing_webhook_events
            WHERE status = 'quarantined' ORDER BY received_at DESC` — `error_class` is the reason:
            unlinked_customer (no billing_customers row: link it, then re-open the event),
            unknown_product / subscription_without_expiry (fix the credit_products catalog),
            purchase_never_applied (a refund whose purchase never arrived), dispute_needs_a_decision and
            partial_refund_needs_a_decision (a product decision nobody has made), max_attempts (applying it
            kept failing: see BillingWebhookFailing). Until someone acts the customer is out of pocket.

      - alert: BillingWebhookFailing
        expr: increase(agent_billing_webhook_total{outcome="failed"}[10m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "Payment-provider webhooks are failing to apply"
          description: >-
            Applying a verified webhook raised in the last 10m. The provider was told 5xx and will retry (up to
            BILLING_WEBHOOK_MAX_ATTEMPTS per event, then it is quarantined), so nothing is lost yet, but
            customers who paid are waiting for credits. Check the appdata Postgres and that
            postgres-init/20-credit-wallet.sql and 22-billing.sql are applied. If the database itself is down
            no inbox row is written, so the provider's own delivery dashboard is the only other record.

      - alert: UsageExportStuck
        expr: max(agent_usage_export_oldest_pending_age_seconds) > 604800
        labels:
          severity: critical
        annotations:
          summary: "Usage events have been waiting to reach a billing provider for over 7 days"
          description: >-
            The oldest unsent usage event is more than 7 days old. That is deliberately well inside
            BILLING_EXPORT_MAX_AGE_DAYS (default 30, at most 34, because Stripe rejects events older than 35
            days): this is the warning while the events can still be sent, before UsageExportExpired says
            they cannot. Look at `SELECT provider, status, count(*), min(created_at), max(last_error_class)
            FROM billing_export_outbox GROUP BY 1, 2`. A provider outage, a revoked credential, or a stopped
            `credit-billing-export-worker` all look like this. Disclosed (verified in spec 010 PR 6): if the worker itself
            stops, the series DISAPPEARS within five minutes (a synchronous gauge is exported once per set and the
            collector forgets a series that long after its last update) and this alert RESOLVES on its own while
            events keep piling up. It cannot tell a dead worker from a healthy one with nothing to send, so also
            check that `credit-billing-export-worker` is running.

      - alert: UsageExportExpired
        expr: increase(agent_usage_export_total{outcome="expired"}[15m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "Usage events aged out unsent: that usage will never be billed through the provider"
          description: >-
            Events passed BILLING_EXPORT_MAX_AGE_DAYS without being delivered and were marked `expired`, so
            the provider will never see them (its own window closes soon after). This is revenue that was
            earned and not billed. The rows are kept (`status = 'expired'`) with their usage events: decide
            whether to bill them another way. Find the cause first (see UsageExportStuck), or the next ones
            will expire too.

      - alert: UsageExportFailed
        expr: increase(agent_usage_export_total{outcome="failed"}[15m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "Usage events were given up on: the provider refused them, or the retry budget ran out"
          description: >-
            An event reached `failed`: a permanent refusal by the provider, BILLING_EXPORT_MAX_ATTEMPTS spent,
            or the tenant's customer link is gone (`last_error_class` says which). Nothing retries a failed
            event. Fix the cause, then re-queue deliberately (the rows are terminal by trigger, so that is a
            new row, not an UPDATE).

      - alert: UsageExportEnqueueFailing
        expr: increase(agent_cost_governance_degraded_total{path="export_enqueue"}[10m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "Usage events are being recorded but not queued for export"
          description: >-
            Queuing a usage event for export failed in the last 10m. The event itself was recorded (the record outranks
            the export) so nothing is lost from the billing record, but that usage will never reach the provider unless it is
            queued another way. Check the appdata Postgres and that the package's schema scripts (`make billing-migrate`; `postgres-init/24-` and `25-` on a fresh volume) are applied.

      - alert: UsageReconcileDrift
        expr: max(agent_usage_reconcile_max_drift_usd) > 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "The usage meter and the LLM gateway disagree by more than tolerance"
          description: >-
            The last reconciliation pass found a tenant-day where the usage events and the gateway's spend log
            differ by more than USAGE_RECONCILE_TOLERANCE_USD / _PCT. The gauge is the largest such difference in USD and carries
            no tenant: run `make usage-reconcile` for the report, which names the tenant, the day and the amount. A gateway figure
            above the events is a call whose event was never written (or spend the app does not meter). Disclosed: the gauge only
            exists while `make usage-reconcile-worker` runs, so a stopped worker resolves this alert; and a call that spans
            midnight UTC can show as a pair of opposite drifts on adjacent days, which is that, not a loss.

      - alert: UsageReconcileNotCompleting
        expr: increase(agent_usage_reconcile_total{outcome=~"failed|incomplete"}[2h]) > 0
        labels:
          severity: warning
        annotations:
          summary: "A gateway reconciliation pass could not finish, so nothing was proven about the usage records"
          description: >-
            `failed` means the pass raised (the gateway or the appdata Postgres was unreachable, or the gateway's
            spend-log API answered in a shape this version does not know); the log line `usage_reconcile_failed`
            carries the error class. `incomplete` means the gateway had more spend-log rows in the window than
            USAGE_RECONCILE_GATEWAY_MAX_PAGES allows (or the log changed while it was read), so that comparison
            was skipped rather than reported from a partial sum: shorten USAGE_RECONCILE_LOOKBACK_DAYS or raise
            the ceiling. Until it completes, the independent check on the meter is not running.

      - alert: CreditReconcileDrift
        expr: max(agent_credit_reconcile_max_drift_usd) > 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Usage worth credits was recorded but never charged"
          description: >-
            The last wallet reconciliation pass found a tenant-day with usage events worth credits that no debit was booked for. The gauge is
            the largest such figure in USD and carries no tenant: run `credit-billing-reconcile` for the report, which names the tenant, the day
            and the amount. It is an event the wallet failed to debit (see CreditDebitFailing). Disclosed: the gauge only exists while
            `credit-billing-reconcile --loop` runs, so a stopped worker resolves this alert.

      - alert: CreditReconcileNotCompleting
        expr: increase(agent_credit_reconcile_total{outcome="failed"}[2h]) > 0
        labels:
          severity: warning
        annotations:
          summary: "A wallet reconciliation pass could not finish, so nothing was proven about the charges"
          description: >-
            The pass raised (the appdata Postgres was unreachable or the package's tables are missing); the log line `credit_reconcile_failed`
            carries the error class. Until it completes, the check that every recorded usage was charged is not running.

      - alert: CreditGateUnenforced
        expr: increase(agent_cost_governance_degraded_total{path="credit_read"}[10m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "The credit gate could not read a wallet: tenants may be spending without credits"
          description: >-
            The wallet read behind CREDITS_ENFORCEMENT failed in the last 10m. Under
            CREDIT_CHECK_FAILURE_POLICY=open (the default) every request it covered was served
            without checking that the tenant has credits; under closed they were refused. Check the appdata Postgres and
            that the package's schema scripts (`make billing-migrate`; `postgres-init/24-` and `25-` on a fresh volume) are applied. Usage in the window is still recorded and
            debited (overdraft is booked, never refused), so the cost is a tenant running into
            debt, not lost usage.

      - alert: TenantAllowanceUnenforced
        expr: increase(agent_cost_governance_degraded_total{path=~"ledger_read|policy_read"}[10m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "The per-tenant daily allowance is not being enforced"
          description: >-
            The spend read behind the tenant allowance (the usage events; the label
            path=ledger_read is a name kept from when it was the ledger), or the read of
            the operator's per-tenant/per-person limit overrides (path=policy_read),
            failed in the last 10m. Under BUDGET_CHECK_FAILURE_POLICY=open (the default)
            every turn it covered ran unchecked — and a policy_read failure also means
            an override set to SUSPEND someone is not being applied. Check the appdata
            Postgres.

      - alert: GatewayBudgetExceeded
        expr: increase(agent_gateway_budget_exceeded_total[10m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "The LLM gateway refused calls: a budget it enforces is spent"
          description: >-
            LiteLLM answered budget_exceeded in the last 10m, so a budget it enforces
            (the app's key, an end user or a team) is spent and the model calls under it
            are being refused until it resets or is raised. The gateway is the BACKSTOP
            behind the per-turn, per-tenant and per-person ceilings, so this means those
            did not stop the spend first (or the backstop is sized too low). Find who
            spent it (LiteLLM spend logs or its Customer Usage view, grouped by
            `end_user`, which is `tenant:<tenant>/user:<principal>`, a person; or the
            `tenant:<name>` tag for a whole tenant) before raising it. The app's key shows its spend and reset time with
            `python -m scripts.litellm_key info`; it covers chat and embeddings, so
            retrieval degrades along with answers.

      - alert: ModerationBlockSpike
        expr: sum(rate(agent_moderation_total{outcome=~"blocked_.*"}[5m])) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Elevated rate of blocked (moderation) inputs"
          description: >-
            More than 0.5 blocked inputs/sec sustained for 5m
            (agent_moderation_total) — could be a real attack or an
            overly strict moderation rule.

      - alert: WebhookRateLimitRejectionSpike
        expr: sum(rate(agent_rate_limit_exceeded_total[5m])) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Sustained payment-webhook rate-limit rejections"
          description: >-
            The webhook route's per-source-address limit (app/api/rate_limit.py) has been rejecting over 1 request/sec
            for 5m (agent_rate_limit_exceeded_total): a provider redelivering a backlog faster than the ceiling, or a
            stranger flooding forged requests. The signature check still stands either way. Turn limits are the front
            door's (agent_authlimit_requests_total{outcome="limited"}), not this counter.

      - alert: RetrievalDegraded
        expr: sum(rate(agent_retrieval_degraded_total[15m])) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Hybrid retrieval has been degrading"
          description: >-
            agent_retrieval_degraded_total{stage} is firing — the sparse
            or rerank leg of hybrid_search has been failing and falling
            back for 15m.

      - alert: SemanticCacheErrors
        expr: sum(rate(agent_semantic_cache_total{outcome="error"}[15m])) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Semantic cache lookups are erroring"
          description: "agent_semantic_cache_total{outcome=\"error\"} — Redis Stack is likely unhealthy."

      - alert: CheckpointIssues
        expr: increase(agent_checkpoint_issue_total[15m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "Resume attempts are being refused"
          description: "agent_checkpoint_issue_total{reason} increased — a checkpoint was lost or schema-incompatible."

      - alert: TeamChannelNotifyFailing
        expr: increase(agent_team_channel_notify_total{outcome="error"}[15m]) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Team-channel notifications have been failing"
          description: >-
            agent_team_channel_notify_total{sink,outcome="error"} increased
            sustained over 15m — this is a saga PIVOT send (an escalation/
            handoff/incident write already committed; see
            app/domains/notify.py's own docstring), so a human may be
            going unnotified about real, already-applied business state.
            Check SLACK_WEBHOOK_URL / var/team_channel.log permissions.

      - alert: SandboxToolsUnavailable
        expr: increase(agent_sandbox_unavailable_total[15m]) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "The code sandbox is unavailable; turns are going on without it"
          description: >-
            agent_sandbox_unavailable_total{reason} increased for 15m — the sandbox
            tool catalog could not be loaded (app/domains/sandbox_tools.py), so the
            ops, support and sales sandbox tools are missing from the turn and the
            model works without them. reason=connection or timeout: opensandbox-server
            (`make sandbox-up`) is down or still booting; circuit_open: that has been
            true for several calls in a row; other: the bridge itself cannot start
            (opensandbox-mcp not installed in the image, an SDK it cannot
            import). The turn does not fail, which is why this is an alert and not an
            error rate. specs/009 A9.

      - alert: McpToolCatalogChanged
        expr: increase(agent_mcp_tool_pin_failures_total[1h]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "A remote MCP server's tools no longer match what this app pinned"
          description: >-
            agent_mcp_tool_pin_failures_total{dependency,reason} increased — a tool the
            app pinned by name and by a hash of its description and input schema is
            either offered differently (reason=changed) or no longer offered
            (reason=missing), so it was left out and the feature behind it is off.
            The usual cause is an upgrade of the dependency that provides the server
            (opensandbox-mcp): read what changed in its tool descriptions before
            re-pinning in app/domains/sandbox_tools.py, because that text is what the
            model is told to do. The test that fails on the same drift is
            tests/domains/test_sandbox_tool_pins.py.

      - alert: McpGatewayCannotCheckTokens
        expr: increase(agent_mcp_gateway_requests_total{outcome="jwks_unavailable"}[10m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "The MCP gateway cannot confirm its authorization server's signing keys, so it refuses every caller"
          description: >-
            agent_mcp_gateway_requests_total{outcome="jwks_unavailable"} increased for 5m —
            app/mcp/gateway_auth.py::JwksCache could not fetch the JWKS
            (MCP_GATEWAY_JWKS_URL) and the keys it holds are older than
            MCP_GATEWAY_JWKS_CACHE_SECONDS, so no token can be verified. It fails closed
            on purpose, and to a client that looks like an expired login (401), not an
            outage, which is why this alert exists: the metric is the only place it
            shows. Check the authorization server (Casdoor: `docker compose logs casdoor`)
            and the gateway's /readyz, which goes 503 on the same condition so a load
            balancer stops sending it traffic. specs/017.

      # --- the authlimit service (specs/018): the front door's identity check and rate limiter. Metrics are defined in
      # services/authlimit/internal/telemetry/metrics.go; tests/core/test_alert_rules.py reads that file, so a typo here fails the build.
      - alert: AuthlimitCannotCheckTokens
        expr: increase(agent_authlimit_requests_total{reason="keys_unavailable"}[10m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "authlimit cannot confirm Casdoor's signing keys, so it refuses every request"
          description: >-
            agent_authlimit_requests_total{reason="keys_unavailable"} increased for 5m — a replica's copy of the authorization
            server's keys is older than AUTHLIMIT_JWKS_CACHE_SECONDS plus the stale grace (AUTHLIMIT_JWKS_STALE_GRACE_SECONDS, 6 h by
            default), so no token can be verified. It fails closed on purpose (503 auth_unavailable, the replica reports not ready), and
            to the people calling the API that is an outage of everything behind the door. This alert is the end of a story whose
            beginning is AuthlimitKeysStale: if you are reading this, that one has been firing for hours. Check Casdoor
            (`docker compose logs casdoor`) and `docker compose logs authlimit` for jwks_refresh_failed. specs/018.

      - alert: AuthlimitKeysStale
        expr: max(agent_authlimit_keys_age_seconds) > 600
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "authlimit has been serving from a stale copy of Casdoor's signing keys"
          description: >-
            agent_authlimit_keys_age_seconds is above 10 minutes for 5m: the keys are normally refreshed every
            AUTHLIMIT_JWKS_CACHE_SECONDS (5 minutes), so refreshes are failing. Requests are still being checked against the last keys
            the replica fetched, inside the stale grace; the cost of waiting is that a key Casdoor has withdrawn for compromise is still
            trusted, and that after the grace every request is refused (AuthlimitCannotCheckTokens). A replica that has NEVER fetched
            keys reports the time since it started, so it fires here too. Check Casdoor and the network between them. specs/018.

      - alert: AuthlimitLimiterStoreDown
        expr: increase(agent_authlimit_store_errors_total{store="limiter"}[10m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "authlimit's rate limits are NOT being enforced (its store is down or too slow)"
          description: >-
            agent_authlimit_store_errors_total{store="limiter"} increased for 5m — calls to Redis failed or took longer than
            AUTHLIMIT_REDIS_TIMEOUT_MS. The limiter fails OPEN by design (a protection must not become an outage), so requests are being
            served with no per-tenant or per-person limit, and that is silent to everyone but this alert. Check Redis
            (`docker compose ps redis`, `redis-cli ping`) and its latency. specs/018.

      - alert: AuthlimitRevocationStale
        expr: max(agent_authlimit_revocation_age_seconds) > 30
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "an authlimit replica's copy of the revocation list is stale"
          description: >-
            agent_authlimit_revocation_age_seconds is above AUTHLIMIT_REVOCATION_MAX_STALENESS_SECONDS (30 s by default) for 2m: a replica
            cannot reload the revoked-people list from Redis. Under the default policy (closed) it then refuses requests (503), which is
            the loud outcome; under AUTHLIMIT_REVOCATION_UNAVAILABLE=open it SERVES with its last copy, and a person revoked since then
            is not refused on that replica. Check Redis. specs/018.

      - alert: AuthlimitReplicasDown
        expr: (sum(agent_authlimit_ready) < 2) or (absent(agent_authlimit_ready) and count(agent_authlimit_ready offset 30m) > 0)
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "fewer than two authlimit replicas are ready"
          description: >-
            Two replicas run by default, so one failure does not take the front door down; with fewer than two reporting ready for 5m the
            next failure does (Caddy answers 502 or 503 for everything behind the check, and the API is unreachable). The second half of
            the expression fires when every replica has vanished after reporting half an hour ago; it deliberately does NOT fire when the
            service has never reported (production does not run it yet). If you run a different number of replicas, change the 2.
            `docker compose ps authlimit`, `docker compose logs authlimit`; `curl` cannot reach /readyz from outside, it is internal.
            specs/018.

      # The API's side of the same door (specs/018): how it learns who is calling, and whether it can still check.
      - alert: ApiHeaderAuthMode
        expr: agent_api_auth_mode{mode="headers"} == 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "The API is trusting X-Tenant-Id and X-Principal-Id as sent (AUTH_MODE=headers)"
          description: >-
            An API process has reported agent_api_auth_mode{mode="headers"} for 10m. In header mode any client can act as any tenant by
            saying so: it is for the hermetic tests and for running the API alone on a developer's machine, and it must never face the
            internet. If this fires on a deployment, set AUTH_MODE=identity (and AUTHLIMIT_KEYS_URL) and restart; if the process is a
            developer's own, this alert is not for them. Each process re-reports every minute, so this clears about five minutes after the
            last one is gone. specs/018.

      - alert: ApiIdentityKeysRefreshFailing
        # `unless`, not `and ... == 0`: before the first success the `ok` series does not exist, and a comparison against a missing series is an
        # empty result, so the one case that matters most (the API has never been able to fetch the keys) would never fire.
        expr: increase(agent_api_identity_key_refresh_total{result="error"}[10m]) > 0 unless increase(agent_api_identity_key_refresh_total{result="ok"}[10m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "The API cannot fetch the front door's public keys"
          description: >-
            agent_api_identity_key_refresh_total has recorded errors and no success for the last 10m: AUTHLIMIT_KEYS_URL is unreachable
            or answering something that is not a key set. Requests are still checked against the last keys the API fetched, for
            AUTHLIMIT_KEYS_STALE_GRACE_SECONDS (10 minutes by default); the cost of waiting is that a key withdrawn for compromise is still
            trusted, and after the grace every request is refused (ApiCannotCheckIdentity). Check `docker compose ps authlimit` and
            `docker compose logs api`, which says internal_identity_keys_fetch_failed with the error class. specs/018.

      - alert: ApiCannotCheckIdentity
        expr: increase(agent_api_identity_total{outcome="keys_unavailable"}[10m]) > 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "The API is refusing every request: it cannot confirm the front door's keys"
          description: >-
            agent_api_identity_total{outcome="keys_unavailable"} increased for 2m: the API's copy of the front door's public keys is older
            than AUTHLIMIT_KEYS_CACHE_SECONDS plus the stale grace and cannot be refreshed, so no identity can be checked. It fails closed
            on purpose and answers 503 auth_unavailable (not 401), so a client retries instead of logging in again. To the people calling
            the API this is an outage of everything behind the door. This is the end of a story whose beginning is
            ApiIdentityKeysRefreshFailing. specs/018.

      - alert: WorkerUnreachable
        expr: increase(agent_worker_unreachable_total[10m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Queued jobs are being picked up by nobody"
          description: >-
            agent_worker_unreachable_total{queue} increased — a queued chat
            or ingest job published no event at all within its first-event
            deadline, i.e. no worker took it. One is a stuck request; a
            sustained stream of them is a worker pool that answers nothing
            (no agent-worker running for that domain, or no ingest-worker),
            where every caller gets an error and nothing else notices. Check
            `docker compose ps`, the worker logs, and the consumer group's
            pending count on the requests stream.

      - alert: ToolCallDedupDegraded
        expr: increase(agent_tool_dedup_degraded_total[15m]) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "The tool-call idempotency store is degraded"
          description: >-
            agent_tool_dedup_degraded_total increased — app/core/tool_idempotency.py
            couldn't reach its dedup store and ran a mutating/outward tool
            call unprotected instead. A crash-recovery replay landing in
            this exact window could duplicate a real side effect
            (a ticket, an incident, a sent note).

      - alert: IngestUploadFailing
        expr: increase(agent_upload_failed_total[15m]) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Uploaded files are failing after acceptance"
          description: >-
            agent_upload_failed_total{reason} increased — a file reached
            POST /ingest/upload but then failed to reach MinIO or publish
            its ingest job. The object is cleaned up automatically; the
            underlying storage/Redis issue still needs a look.

      - alert: EmbeddingIdentityMismatch
        expr: sum(increase(agent_embedding_identity_total{outcome="mismatch"}[10m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Retrieval is being refused: a vector collection was made with a different embedding model"
          description: >-
            agent_embedding_identity_total{outcome="mismatch"} is rising: a read or write was refused because the collection's
            embedding identity (model, dimension, query/document prefixes, EMBED_MODEL_REVISION) differs from this process's
            configuration. Retrieval from that collection returns nothing (it degrades like an outage) and ingestion into it fails.
            GET /health/ready names the collection; `make reembed COLLECTION_NAME=<name>` rebuilds it, or restore the previous embedding
            settings.

  - name: agent-core-infra
    rules:

      - alert: ScrapeTargetDown
        expr: up == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Prometheus scrape target {{ $labels.job }} is down"
          description: "{{ $labels.instance }} (job={{ $labels.job }}) has been unreachable for 5m."

      # The ML service is up (ScrapeTargetDown does not fire) but a model it declares could not be loaded or has failed at run
      # time. The service retries with a bounded backoff (5 s doubling to 300 s), so a model still down after 5 minutes is not a
      # start-up blip. Its consumers degrade rather than fail (reranker -> RRF order, guard -> pattern layer only, router -> local
      # model), which is exactly why nothing else would tell a person.
      - alert: MlServiceModelDown
        expr: ml_model_state == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "ML service model {{ $labels.model }} is not ready"
          description: >-
            ml_model_state{model="{{ $labels.model }}"} has been 0 for 5m: the model failed to load or failed at run time.
            GET /health/models on the ML service names the reason and when it will be retried.

      # The model router sent turns to a medium or strong model and the call to it failed to reach a model, so the turn was repeated on the
      # local model (specs/014, specs/015, GRAPH_PATTERNS.md pattern 68). The person got an answer, which is why nothing else would tell an
      # operator that every routed turn is quietly running on the model it was meant to leave. Any sustained rate counts: the outcome is only
      # recorded when a routed alias was actually asked for.
      - alert: ModelRoutedTierFailing
        expr: sum(rate(agent_model_route_total{outcome="routed_unreachable_fell_back"}[10m])) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Routed turns are falling back to the local model"
          description: >-
            agent_model_route_total{outcome="routed_unreachable_fell_back"} has been increasing for 10m: the medium or strong alias (chat-medium,
            chat-strong) is unreachable or the gateway is returning a 5xx for it (a real LiteLLM answers 500 for an unreachable upstream), so turns the router sent there ran on the local model instead.

      # The router asks the ML service for a label and decides from the rules alone when it cannot get one (specs/015). That is a safe
      # degradation and a quiet one: turns still route, only by rules, so a classifier that has been silent for a quarter of an hour would
      # otherwise go unnoticed. Half of the routed turns, because a service restart costs a handful of misses and is not worth a page.
      - alert: ModelRouterLabelUnavailable
        expr: >-
          sum(rate(agent_model_route_total{outcome=~"label_none|label_timeout|label_error|label_unknown"}[15m]))
          / sum(rate(agent_model_route_total{outcome!="disabled"}[15m])) > 0.5
          and sum(rate(agent_model_route_total{outcome!="disabled"}[15m])) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "The router is deciding from rules alone"
          description: >-
            More than half of the routed turns for 15m found no usable label (agent_model_route_total outcomes label_none, label_timeout,
            label_error, label_unknown). GET /health/models on the ML service names why: a label set refused or pending, a model not ready, or a
            set whose labels the app's table does not know.
