# Alert rules over app/core/metrics.py's own metrics (via the otel-collector
# scrape target) plus basic target-health rules for the infra scrape
# targets. Thresholds here are reasonable illustrative defaults for a demo
# — tune them (and wire a real receiver into
# ../alertmanager/alertmanager.yml) against real traffic before relying on
# this for a production tenant.
groups:
  - name: agent-core-slo
    rules:
      - alert: HighTurnErrorRate
        expr: |
          sum(rate(agent_requests_total{outcome="error"}[5m]))
          /
          sum(rate(agent_requests_total[5m]))
          > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Agent turn error rate above 5%"
          description: >-
            {{ $value | humanizePercentage }} of agent turns ended in
            outcome="error" over the last 5m (agent_requests_total).

      - alert: HighTurnLatencyP95
        expr: |
          histogram_quantile(0.95, sum(rate(agent_latency_seconds_bucket[5m])) by (le)) > 30
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Agent turn p95 latency above 30s"
          description: "p95 end-to-end turn latency (agent_latency_seconds) has been over 30s for 10m."

      - alert: HighToolErrorRate
        expr: |
          sum(rate(agent_tool_errors_total[5m]))
          /
          sum(rate(agent_tool_calls_total[5m]))
          > 0.1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Tool call error rate above 10%"
          description: "agent_tool_errors_total / agent_tool_calls_total has been over 10% for 10m."

      - alert: TenantBudgetExceeded
        expr: increase(agent_budget_exceeded_total{scope="tenant"}[1h]) > 0
        labels:
          severity: warning
        annotations:
          summary: "A tenant hit a cost ceiling"
          description: >-
            agent_budget_exceeded_total{scope="tenant"} increased in the last hour —
            some tenant's turns are being refused for exceeding its daily
            (MAX_COST_USD_PER_TENANT_PER_DAY) or monthly
            (MAX_COST_USD_PER_TENANT_PER_MONTH) limit. The `window` label says
            which; the refusal is logged with the tenant (`budget_exceeded`).
            Renamed from TenantDailyCostBudgetExceeded when the monthly limit
            was added.

      - alert: TenantBudgetNearLimit
        expr: increase(agent_budget_threshold_total{scope="tenant", threshold="95"}[30m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "A tenant is within 5% of a cost ceiling"
          description: >-
            Turns were served in the last 30m for a tenant already at 95% or more
            of its daily or monthly limit (`window` says which). The next ones
            will be refused: time to raise the limit or talk to the tenant. The
            crossing is logged once per day or month as `budget_threshold_crossed`,
            with the tenant. Personal limits are deliberately not alerted: a
            person reaching their own cap is the guard rail working, not an
            operator's problem.

      - alert: ModelUsageUnpriced
        expr: increase(agent_unpriced_usage_total[15m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "Tokens are being spent on a model with no known price"
          description: >-
            agent_unpriced_usage_total increased in the last 15m — LiteLLM reports no
            price for a model that served calls, so the per-turn, per-subagent and
            per-tenant dollar ceilings read $0 for that spend. Set input/output
            cost under that model's `model_info` in the LiteLLM config.

      - alert: LedgerWriteFailing
        expr: increase(agent_cost_governance_degraded_total{path="ledger_write"}[10m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "Spend is being incurred and not recorded"
          description: >-
            A completed turn's usage_ledger write failed in the last 10m. The turn
            succeeded, so nobody was told: the row is gone, and every tenant allowance
            read from that ledger now undercounts. Check the appdata Postgres.

      - alert: UsageEventWriteFailing
        expr: increase(agent_cost_governance_degraded_total{path="usage_event_write"}[10m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "Model calls are being made and their usage events are not recorded"
          description: >-
            A per-call usage event failed to write in the last 10m. The turn succeeded, so
            nobody was told: that call is missing from the billing meter, which is lost revenue
            the moment usage is billed. Check the appdata Postgres. Reconcile the gap against
            the gateway spend log (grouped by `end_user`) before it ages out of any provider's
            reporting window.

      - alert: UsageEventTableMissing
        expr: increase(agent_cost_governance_degraded_total{path="usage_event_table_missing"}[10m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "The usage_events table does not exist: no model call is being metered"
          description: >-
            postgres-init/19-usage-events.sql has not been applied to this database (init
            scripts run only on a fresh volume), or CREDITS_PER_USD is set and
            postgres-init/21-usage-event-credits.sql has not. Apply it once with
            `psql -U langfuse -d appdata -f postgres-init/<file>`. Turns are unaffected; the
            per-turn usage_ledger the spend caps read is a separate table.

      - alert: CreditDebitFailing
        expr: increase(agent_cost_governance_degraded_total{path="credit_debit"}[10m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "Model calls are being metered but a tenant's credits are not being charged"
          description: >-
            A usage event was written and the wallet debit for it failed in the last 10m. The
            turn succeeded and the event is kept (a lost event cannot be repaired, an uncharged one
            can), so nobody was told: that tenant has had usage it was not charged for, and its
            balance is higher than it should be. Check the appdata Postgres, and that
            postgres-init/20-credit-wallet.sql is applied. The debit key IS the event id, so each
            missed charge can be replayed from its event (`credit_transactions.usage_event_id` is
            what is missing); find them by comparing events that carry `credits` with the wallet.

      - alert: CreditGateUnenforced
        expr: increase(agent_cost_governance_degraded_total{path="credit_read"}[10m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "The credit gate could not read a wallet: tenants may be spending without credits"
          description: >-
            The wallet read behind CREDITS_ENFORCEMENT failed in the last 10m. Under
            CREDIT_CHECK_FAILURE_POLICY=open (the default) every turn it covered was served
            without checking that the tenant has credits; under closed they were refused as
            budget_check_unavailable. Check the appdata Postgres and
            postgres-init/20-credit-wallet.sql. Usage in the window is still recorded and
            debited (overdraft is booked, never refused), so the cost is a tenant running into
            debt, not lost usage.

      - alert: TenantAllowanceUnenforced
        expr: increase(agent_cost_governance_degraded_total{path=~"ledger_read|policy_read"}[10m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "The per-tenant daily allowance is not being enforced"
          description: >-
            The ledger read behind the tenant allowance (path=ledger_read), or the read of
            the operator's per-tenant/per-person limit overrides (path=policy_read),
            failed in the last 10m. Under BUDGET_CHECK_FAILURE_POLICY=open (the default)
            every turn it covered ran unchecked — and a policy_read failure also means
            an override set to SUSPEND someone is not being applied. Check the appdata
            Postgres.

      - alert: GatewayBudgetExceeded
        expr: increase(agent_gateway_budget_exceeded_total[10m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "The LLM gateway refused calls: a budget it enforces is spent"
          description: >-
            LiteLLM answered budget_exceeded in the last 10m, so a budget it enforces
            (the app's key, an end user or a team) is spent and the model calls under it
            are being refused until it resets or is raised. The gateway is the BACKSTOP
            behind the per-turn, per-tenant and per-person ceilings, so this means those
            did not stop the spend first (or the backstop is sized too low). Find who
            spent it (LiteLLM spend logs, grouped by `end_user` / the `tenant:<name>`
            tag) before raising it. The app's key shows its spend and reset time with
            `python -m scripts.litellm_key info`; it covers chat and embeddings, so
            retrieval degrades along with answers.

      - alert: ModerationBlockSpike
        expr: sum(rate(agent_moderation_total{outcome=~"blocked_.*"}[5m])) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Elevated rate of blocked (moderation) inputs"
          description: >-
            More than 0.5 blocked inputs/sec sustained for 5m
            (agent_moderation_total) — could be a real attack or an
            overly strict moderation rule.

      - alert: RateLimitRejectionSpike
        expr: sum(rate(agent_rate_limit_exceeded_total[5m])) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Sustained per-tenant rate-limit rejections"
          description: "agent_rate_limit_exceeded_total has been climbing over 1/sec for 5m."

      - alert: RetrievalDegraded
        expr: sum(rate(agent_retrieval_degraded_total[15m])) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Hybrid retrieval has been degrading"
          description: >-
            agent_retrieval_degraded_total{stage} is firing — the sparse
            or rerank leg of hybrid_search has been failing and falling
            back for 15m.

      - alert: SemanticCacheErrors
        expr: sum(rate(agent_semantic_cache_total{outcome="error"}[15m])) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Semantic cache lookups are erroring"
          description: "agent_semantic_cache_total{outcome=\"error\"} — Redis Stack is likely unhealthy."

      - alert: CheckpointIssues
        expr: increase(agent_checkpoint_issue_total[15m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "Resume attempts are being refused"
          description: "agent_checkpoint_issue_total{reason} increased — a checkpoint was lost or schema-incompatible."

      - alert: TeamChannelNotifyFailing
        expr: increase(agent_team_channel_notify_total{outcome="error"}[15m]) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Team-channel notifications have been failing"
          description: >-
            agent_team_channel_notify_total{sink,outcome="error"} increased
            sustained over 15m — this is a saga PIVOT send (an escalation/
            handoff/incident write already committed; see
            app/domains/notify.py's own docstring), so a human may be
            going unnotified about real, already-applied business state.
            Check SLACK_WEBHOOK_URL / var/team_channel.log permissions.

      - alert: WorkerUnreachable
        expr: increase(agent_worker_unreachable_total[10m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Queued jobs are being picked up by nobody"
          description: >-
            agent_worker_unreachable_total{queue} increased — a queued chat
            or ingest job published no event at all within its first-event
            deadline, i.e. no worker took it. One is a stuck request; a
            sustained stream of them is a worker pool that answers nothing
            (no agent-worker running for that domain, or no ingest-worker),
            where every caller gets an error and nothing else notices. Check
            `docker compose ps`, the worker logs, and the consumer group's
            pending count on the requests stream.

      - alert: ToolCallDedupDegraded
        expr: increase(agent_tool_dedup_degraded_total[15m]) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "The tool-call idempotency store is degraded"
          description: >-
            agent_tool_dedup_degraded_total increased — app/agent/tool_idempotency.py
            couldn't reach its dedup store and ran a mutating/outward tool
            call unprotected instead. A crash-recovery replay landing in
            this exact window could duplicate a real side effect
            (a ticket, an incident, a sent note).

      - alert: IngestUploadFailing
        expr: increase(agent_upload_failed_total[15m]) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Uploaded files are failing after acceptance"
          description: >-
            agent_upload_failed_total{reason} increased — a file reached
            POST /ingest/upload but then failed to reach MinIO or publish
            its ingest job. The object is cleaned up automatically; the
            underlying storage/Redis issue still needs a look.

  - name: agent-core-infra
    rules:
      - alert: ScrapeTargetDown
        expr: up == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Prometheus scrape target {{ $labels.job }} is down"
          description: "{{ $labels.instance }} (job={{ $labels.job }}) has been unreachable for 5m."
