# Scrapes the app's OTel metrics (through the otel-collector's Prometheus exporter) and the infra exporters of the app stack. Every target
# is a port published by docker-compose.collectors.yml or docker-compose.yml, reached through `host.docker.internal`: this stack shares no
# network with them (docker-compose.observability.yml). A target whose stack is not up shows as down; nothing in the app depends on this one.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Every OTel metric this app emits (app/core/metrics.py), aggregated
  # across the API + every agent-worker/ingest-worker replica.
  - job_name: otel-collector
    static_configs:
      - targets: ["host.docker.internal:8889"]

  # Qdrant's own built-in Prometheus metrics (no config needed on its
  # side) — verify the exact metric names it exposes with
  # `curl host.docker.internal:6333/metrics` before building panels beyond
  # the "is it up" one in the Infra & Logs dashboard; only `up{job="qdrant"}`
  # is relied on here.
  - job_name: qdrant
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:6333"]

  # LiteLLM's own Prometheus callback — enabled via litellm-config.yaml's
  # `litellm_settings.callbacks: [prometheus]`. Same caveat as Qdrant
  # above: confirm exact metric names (`litellm_...`) against a running
  # proxy before building panels beyond target health.
  - job_name: litellm
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:4000"]

  # The ML service (services/ml-service, published on 8083): per-model load state, embedding and classifier counters
  # (services/ml-service/ml_service/metrics.py). Prod reaches the same series through the app droplet's collector agent instead
  # (observability/otel-collector/config.agent.yaml), because its Prometheus runs on a separate droplet.
  - job_name: ml-service
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8083"]

  # postgres-exporter / redis-exporter (docker-compose.collectors.yml).
  - job_name: postgres
    static_configs:
      - targets: ["host.docker.internal:9187"]

  - job_name: redis
    static_configs:
      - targets: ["host.docker.internal:9121"]

  # pgbouncer-exporter (docker-compose.collectors.yml): the pool and wait gauges the PgBouncer alerts read. In production the same job name comes
  # through the app droplet's otel-collector-agent (observability/otel-collector/config.agent.yaml).
  - job_name: pgbouncer
    static_configs:
      - targets: ["host.docker.internal:9127"]

  # node-exporter / cadvisor (docker-compose.collectors.yml). Their dashboard never filters on job= (its $server variable is
  # label_values(node_boot_time_seconds, instance)), so these names only match the jobs above.
  - job_name: node
    static_configs:
      - targets: ["host.docker.internal:9100"]

  - job_name: docker
    static_configs:
      - targets: ["host.docker.internal:8081"]
