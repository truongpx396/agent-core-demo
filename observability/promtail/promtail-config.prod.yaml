# Prod counterpart of ../promtail-config.yaml — runs ON THE APP DROPLET
# (docker-compose.prod.yml's `promtail` service), not the observability
# droplet, because Promtail discovers/tails containers via the LOCAL Docker
# daemon socket (docker_sd_configs below): it has to be co-located with the
# containers it reads, unlike Prometheus/otel-collector which can scrape or
# receive over a network. Only the `clients.url` target differs from dev —
# pushing to the observability droplet's Loki over the DO VPC instead of a
# same-host `loki:3100` — via LOKI_PUSH_HOST, substituted by Promtail's own
# `-config.expand-env=true` flag (docker-compose.prod.yml's command).
server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://${LOKI_PUSH_HOST}/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        regex: "^(api|agent-worker|ingest-worker|litellm|postgres|redis|qdrant)$"
        action: keep
      - source_labels: [__meta_docker_container_name]
        regex: "/(.*)"
        target_label: container
      - source_labels: [__meta_docker_container_label_com_docker_compose_project]
        target_label: compose_project
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        target_label: compose_service
    pipeline_stages:
      # Same structlog JSON parsing as ../promtail-config.yaml — see that
      # file's own comment. api/agent-worker/ingest-worker log JSON;
      # litellm/postgres/redis/qdrant log plain text and just skip this
      # stage harmlessly.
      - json:
          expressions:
            level: level
            logger: logger
      - labels:
          level:
          logger:
