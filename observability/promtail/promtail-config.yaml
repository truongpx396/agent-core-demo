# Ships this app's containers' stdout (docker-compose.yml's structlog JSON lines, app/platform/logging_config.py) to Loki. Containers are found
# through the Docker socket (docker_sd_configs), which sees EVERY container on the host: an unrelated project's months-old logs once made Loki
# reject whole batches ("timestamp too old", limits_config's reject_old_samples_max_age), dropping this app's lines batched with them. So the
# `keep` filter below is an allowlist of service names, not a project match, and works under any checkout directory name.
server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  # Loki is in the observability project: through its published port, not a service name.
  - url: http://host.docker.internal:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        regex: "^(api|agent-worker|ingest-worker|litellm|postgres|redis|qdrant|minio|langfuse-web|open-webui|postgres-exporter|redis-exporter)$"
        action: keep
      - source_labels: [__meta_docker_container_name]
        regex: "/(.*)"
        target_label: container
      - source_labels: [__meta_docker_container_label_com_docker_compose_project]
        target_label: compose_project
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        target_label: compose_service
    pipeline_stages:
      # The app roles (api, agent-worker, ingest-worker) log one JSON object per line: parse it so `level` and `logger` are Loki labels
      # a dashboard can filter on. Containers that log plain text skip these stages (the json stage no-ops on non-JSON).
      - json:
          expressions:
            level: level
            logger: logger
      - labels:
          level:
          logger:
