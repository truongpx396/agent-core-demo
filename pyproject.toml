[tool.pytest.ini_options]
# The billing package is found through its src directory, not installed: the lock file is a machine-generated freeze
# of a real install and a path dependency does not belong in it (spec 011 D20). `services/ml-service` is on the path for the same
# reason: the ML service's package (`ml_service`) is imported by tests/services/ml_service and by the evaluation harness, which must run
# the very tokenise/pool code the service serves with (specs/014 research.md C1); it is not installed and not in the lock file.
pythonpath = [".", "packages/billing/src", "services/ml-service"]
testpaths = ["tests"]
# pytest-asyncio in "auto" mode: any `async def test_...` (or `async def`
# fixture) is collected and run automatically, no `@pytest.mark.asyncio`
# needed on every one — adopted so tests exercising this app's now-async
# tool/store/client layer can `await` directly instead of every test body
# wrapping its own call in `asyncio.run(...)`. Purely additive: a plain
# `def test_...` is collected and run exactly as before regardless of this
# setting, so it changes nothing for the (majority) sync tests in this suite.
asyncio_mode = "auto"
# A test that runs this long (the slowest, test_worker_scaling, takes about a minute) dumps every thread's Python stack to
# stderr, and keeps running. An integration run stalled twice locally with one test never finishing and no way to see where
# (py-spy needs root on macOS, and the process is idle); with this the next stall names the line it is waiting on.
faulthandler_timeout = 300
# `addopts`'s own `-m` default is what actually keeps a bare `pytest -q`
# fast — every marked test ALSO self-skips (not fails) when Docker/the
# model it needs isn't reachable (tests/containers.py), but relying on
# that alone would mean a bare `pytest -q` on a dev machine that HAPPENS to
# have Docker running silently tries to pull a real Ollama model the
# instant this file existed, not just when someone actually asks for it.
# An explicit `-m` on the command line overrides this default rather than
# ANDing with it (verified directly: `pytest -m integration` runs ONLY the
# `integration`-marked tests, not "integration AND NOT integration") — see
# Makefile's `test-integration`/`test-live` targets and
# .github/workflows/ci.yml, both of which rely on exactly that override
# (GRAPH_PATTERNS.md pattern 48).
addopts = '-m "not integration and not llm and not e2e and not deepeval and not crawl and not sandbox"'
markers = [
    "integration: needs a real Postgres/Redis/Qdrant/crawl4ai container (tests/containers.py), no LLM",
    "llm: needs a real, small Ollama model container (tests/live/conftest.py)",
    "e2e: drives a real browser (pytest-playwright) against the real app + a real Ollama model",
    "advisory: an e2e test that depends on the small local model chaining several tool calls, which it does not do reliably; CI runs these in their own NON-BLOCKING step (`-m \"e2e and advisory\"`), the gating step is `-m \"e2e and not advisory\"`. Always combined with `e2e`, so the default run still excludes them (GRAPH_PATTERNS.md pattern 48)",
    "deepeval: LLM-judged RAG quality metrics (tests/deepeval/: test_rag_quality_deepeval.py, test_conversation_simulator_deepeval.py, test_tool_correctness_deepeval.py) — runs in its own CI job as a non-blocking signal (every file's test cases are deepeval `flaky=True`, so a bad score warns instead of failing the build; a genuine crash still fails it for real, see GRAPH_PATTERNS.md pattern 48), plus `make deepeval` for a full local run read by hand; a separate marker from `llm`, not swept into test-live's `-m \"llm or e2e\"`",
    "crawl: needs a real crawl4ai server, self-provisioned via tests/containers.py::ensure_crawl4ai() (GRAPH_PATTERNS.md pattern 50) — no LLM; used only by tests/live/test_domain_crawl_tools_live.py, which drives the real graph through a human_approval interrupt (its crawl4ai-only sibling, test_web_crawler_live.py, moved to tests/integration/ under the `integration` marker 2026-09-17, once self-provisioning stopped being a reason to keep it in tests/live/) — swept into `make test-live`'s own `-m` selection",
    "sandbox: needs a real, containerized opensandbox-server (`make sandbox-up`) + the opensandbox-mcp bridge on PATH (GRAPH_PATTERNS.md pattern 50) — deliberately NOT swept into `make test-live` (same 'needs a manual, non-testcontainers-managed prerequisite' reasoning `deepeval`/`garak`/`promptfoo-redteam` already have); self-skips cleanly when the bridge isn't on PATH",
]

[tool.ruff]
target-version = "py311"
# First-party for import sorting: the repo root (`app`, `scripts`), the billing package and the ML service package (both found by path,
# not installed).
src = [".", "packages/billing/src", "services/ml-service"]

[tool.ruff.lint]
# Deliberately no "E"/pycodestyle line-length rule: docstrings and comments
# are wrapped by hand at about 110 columns and explain why, not what (see
# CLAUDE.md, "Working rules"); a hard limit would only force mechanical re-wrapping.
# F/I/UP: pyflakes, isort, pyupgrade — uncontroversial correctness/hygiene.
# B: flake8-bugbear, minus B008 (FastAPI's Depends()/File() call as an
# argument default is the framework's own idiom, not a bug).
# BLE: flake8-blind-except — this codebase already annotates every
# deliberate `except Exception` with a justifying `# noqa: BLE001 - ...`
# comment (see app/agent/runtime/core.py, app/adapters/inbound/channels/telegram/bot.py, etc.), so enabling
# the rule just makes those pre-existing comments meaningful instead of
# decorative.
# S110: bandit's try/except/pass check, paired with BLE001 for the same
# reason — a handful of genuinely-fine silent swallows (a best-effort
# trace flush, a cosmetic typing indicator) are individually noqa'd.
# PLE: pylint's error rules, among them invisible and bidirectional characters in source (a literal zero-width space sat in
# scripts/ai_review/review.py). RUF100: a `noqa` that suppresses nothing, which would silently cover the rule if the code under it
# later changed. ASYNC: a blocking call (file, subprocess, input) inside `async def`, which stalls every other task on the loop.
# PLW1514: a text file opened without `encoding=` reads and writes in the machine's locale (cp1252 on Windows), not UTF-8; it is a
# preview rule, and `explicit-preview-rules` turns on that one and no other. INP001: a directory of modules with no `__init__.py` is an
# implicit namespace package; one sat inside the billing package (`credit_billing/cli`), and `setuptools.find_packages()` skips such a
# directory, so a wheel built that way would have shipped without the six console-script modules.
select = ["F", "I", "UP", "B", "BLE", "S110", "PLE", "RUF100", "ASYNC", "PLW1514", "INP001"]
preview = true
explicit-preview-rules = true
ignore = [
    "B008",   # FastAPI's Depends()/File() in an argument default is the framework's own idiom
    "UP042",  # str+Enum -> StrEnum for ErrorCode/Topic/Department is a deliberate call for a
              # separate change, not something a lint-config pass should silently rewrite
    "ASYNC109",  # a `timeout` parameter handed on to httpx/anyio is the function's API, not a missing `asyncio.timeout`
]

[tool.ruff.lint.per-file-ignores]
# One-shot operator tools and tests are synchronous by nature: blocking there stalls nothing but themselves.
"scripts/**" = ["ASYNC"]
"tests/**" = ["ASYNC"]
"packages/*/tests/**" = ["ASYNC"]
# Standalone programs run by path (or loaded by name, like `sitecustomize`), not packages anything imports.
"garak/**" = ["INP001"]
"loadtest/**" = ["INP001"]
"deploy/**" = ["INP001"]

[tool.mypy]
# No explicit python_version pin: mypy infers it from whatever interpreter
# it's run under. Pinning it lower than that interpreter (e.g. to match
# this app's "3.11+" minimum) makes mypy reject newer syntax it encounters
# in third-party stubs transitively imported along the way (numpy's own
# .pyi files use a 3.12-only construct) — a stub-parsing conflict that has
# nothing to do with this app's own code. CI pins the actual interpreter
# version directly instead (see .github/workflows/ci.yml).
ignore_missing_imports = true
# The body of a function with no annotations is skipped by default, so a wrong type inside an untyped decorator wrapper went
# unseen (app/adapters/inbound/mcp/audit.py). A `type: ignore` that no longer ignores anything, or a `cast` to the type the
# value already has, is a stale claim about the code: both fail the build.
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
# Third-party stubs this app depends on (redis-py's Streams commands,
# qdrant-client's Filter/Condition unions, RediSearch's create_index) are
# themselves imprecise in ways this app's own code isn't — see the `cast`/
# `# type: ignore[...]` comments at each such site in app/ for the specific
# reason. Scoped to app/ and scripts/ (not tests/) — tests are exercised by
# actually running them (`make test`), not by static typing.
files = ["app", "scripts", "packages/billing/src", "services/ml-service/ml_service"]
# services/ml-service is on the path so the `ml_service` package resolves as a top-level name (its directory name has a hyphen).
mypy_path = "packages/billing/src:services/ml-service"
