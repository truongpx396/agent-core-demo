# Read automatically by sonar-scanner CLI from the project's working
# directory — see .github/workflows/ci.yml's `sonarqube` job and
# `make sonar-scan`, both of which rely on this rather than repeating these
# flags inline. sonar.host.url/sonar.token are passed as env vars
# (SONAR_HOST_URL/SONAR_TOKEN) by each caller instead, since they differ
# between an ephemeral CI server and a persistent local one
# (docker-compose.yml's `quality` profile).
sonar.projectKey=agent-core-demo
sonar.sources=app,scripts,docker/ml-service
sonar.tests=tests
sonar.exclusions=**/__pycache__/**,**/*.sqlite3
sonar.python.version=3.13
