# Routing classifiers (specs/014 Story 3). The only declared candidate is the running ML service's /classify, which is what the app actually gets.
#
# The degenerate controls (`constant`, which never escalates, and `random-router`) are not declared: they are built into the runner.
# `baseline = true` marks the candidate that is what the app actually gets; the harness requires exactly one per kind. It does not mean a
# baseline FILE exists (see below).
#
# There is NO recorded baseline for this kind, and nothing is in use today: no head is accepted on the service, so a `service` run stops with
# "served_by=none" and writes no report. That is correct, not an omission. Embedding models are NOT declared here any more: the in-process
# candidates existed to evaluate a trained head file, and the head trainer was removed once the first real run showed the labels could not
# support any router (ENGINEERING_PATTERNS.md pattern 69). A new router (for example rules plus topic labels) is evaluated by handing a
# `ClassifierBackend` to `runners.classify.run(backend=...)`, and gets a declaration here when it is wired to a command.

[[candidate]]
name = "ml-service-classify"
kind = "classifier"
path = "service"
licence = "MIT (primary) / Apache-2.0 (fallback)"
baseline = true
notes = "Whatever the running ML service's /classify answers, which is what the app actually gets and includes the HTTP round trip. It only answers once a head is ACCEPTED there."

[candidate.source]
model = "classify"

# Label sets (specs/015): the model that embeds a set's examples and sentences, scored in-process on `--dataset route-topics`. `source.model` is the name
# the ML service serves it under, which is the key of the set's `calibration`; repo, file and revision are the entry in docker/ml-service/models.toml
# (a test keeps them equal), and `prepare` is how that entry pools. No prefix: examples and sentences are the same kind of text, so nothing asymmetric
# is wanted. They are not routers and have no outcomes: `make model-eval KIND=classifier CANDIDATE=labelset-bge-small-en-v1.5 DATASET=route-topics`.

[[candidate]]
name = "labelset-bge-small-en-v1.5"
kind = "classifier"
path = "inprocess"
licence = "MIT"
notes = "The label-set matcher's primary model (the first classify-role model in models.toml)."
[candidate.source]
model = "bge-small-en-v1.5"
repo = "BAAI/bge-small-en-v1.5"
file = "onnx/model.onnx"
revision = "5c38ec7c405ec4b44b94cc5a9bb96e735b38267a"
[candidate.prepare]
pooling = "cls"
normalize = true
max_length = 512
pad_token = "[PAD]"

[[candidate]]
name = "labelset-all-minilm-l6-v2"
kind = "classifier"
path = "inprocess"
licence = "Apache-2.0"
notes = "The label-set matcher's fallback model. Its similarities sit on a different scale from the primary's, which is why the cutoff is stored per model."
[candidate.source]
model = "all-MiniLM-L6-v2"
repo = "sentence-transformers/all-MiniLM-L6-v2"
file = "onnx/model.onnx"
revision = "1110a243fdf4706b3f48f1d95db1a4f5529b4d41"
[candidate.prepare]
pooling = "mean"
normalize = true
max_length = 256
pad_token = "[PAD]"

# The app's own router (spec 015): `routing_policy.decide` (the rules and the label table) with the label from the matcher above, scored on ROUTING outcomes
# like any other router: `make model-eval KIND=classifier CANDIDATE=rules-and-labels-bge-small-en-v1.5 OUTCOMES=<an outcomes file>`. It needs labelled
# outcomes (`make router-label`) and the model cached. Declared with the same pins as the label-set candidate it uses (a test keeps both equal to models.toml).

[[candidate]]
name = "rules-and-labels-bge-small-en-v1.5"
kind = "classifier"
path = "inprocess"
licence = "MIT"
notes = "The rules and the route-topics label (bge-small-en-v1.5, the primary) combined by max under no ceiling, with all three tiers configured: what route_model decides with ROUTER_MODE=on and both aliases set."
[candidate.source]
model = "bge-small-en-v1.5"
repo = "BAAI/bge-small-en-v1.5"
file = "onnx/model.onnx"
revision = "5c38ec7c405ec4b44b94cc5a9bb96e735b38267a"
[candidate.prepare]
pooling = "cls"
normalize = true
max_length = 512
pad_token = "[PAD]"
