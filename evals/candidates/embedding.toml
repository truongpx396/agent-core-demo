# Embedding models the harness can evaluate (specs/014). `baseline = true` marks the model in use today; every comparison is made
# against it. Add a model by adding a [[candidate]] table: never edit metric, dataset or report code.
#
# path = "gateway"   the app's own client through the LiteLLM `embed` alias (what the app really gets)
# path = "service"   the ML service's /v1/embeddings
# path = "inprocess" load the ONNX file here, through the same tokenise/pool code the ML service serves with
# An inprocess candidate pins a FULL commit sha (never a branch: a branch moves under you) and names the exact file.
#
# NOTE ON FILES: int8/quantized variants were SLOWER than fp32 on the ARM CPU these were first measured on, and the same file may be
# faster on x86. Measure on the CPU you will deploy to (the report carries a hardware id and never compares latency across ids).

[[candidate]]
name = "nomic-embed-text-ollama"
kind = "embedding"
path = "gateway"
licence = "Apache-2.0"
baseline = true
notes = "The model the stack runs today: Ollama's nomic-embed-text behind the `embed` alias, with NO task prefixes (the app sends raw text)."
[candidate.source]
alias = "embed"

[[candidate]]
name = "nomic-embed-text-ollama-prefixed"
kind = "embedding"
path = "gateway"
licence = "Apache-2.0"
notes = "The same model and alias with the prefixes its card says it must be given. The A/B that says whether adding EMBED_QUERY_PREFIX / EMBED_DOCUMENT_PREFIX is worth a re-embed."
[candidate.source]
alias = "embed"
[candidate.prepare]
query_prefix = "search_query: "
document_prefix = "search_document: "

[[candidate]]
name = "nomic-embed-text-v1.5-onnx-fp32"
kind = "embedding"
path = "inprocess"
licence = "Apache-2.0"
notes = "The SAME model as the baseline as an fp32 ONNX file on CPU: the like-for-like cost of moving it off Ollama."
[candidate.source]
repo = "nomic-ai/nomic-embed-text-v1.5"
file = "onnx/model.onnx"
revision = "e9b6763023c676ca8431644204f50c2b100d9aab"
[candidate.prepare]
query_prefix = "search_query: "
document_prefix = "search_document: "
pooling = "mean"
normalize = true
max_length = 512
pad_token = "[PAD]"

