# Reference code the AI reviewer is shown next to a diff (scripts/ai_review.py, README "AI review").
#
# A reviewer that sees only a diff can't tell that a new write tool skipped `idempotent()`: the
# missing call is not in the diff, only the call that should have been there is. So when a changed
# path matches `when` (fnmatch globs; `*` matches across `/`), the `attach` specs are pulled out of
# the checked-out BASE branch and shown as "this is how the repo does it, compare the change to it".
# Choosing the exemplar is a fact about this repo, so it is written down here instead of left to a
# model to guess from a diff.
#
# Spec forms:  path                 the whole file
#              path::name           a top-level def / class / assignment in a .py file
#              path#Heading         a markdown section
# Each snippet is capped (see scripts/ai_review.py), and a spec that stops resolving is skipped
# with a warning. tests/scripts/test_ai_review.py fails if any spec here does not resolve, so a
# rename can't quietly turn a rule into a no-op.
#
# The exemplars are the ones .claude/rules/side-effect-tools.md already names as the reference
# implementation (support's create_ticket), plus the idempotency wrapper and a schema that shows a
# child table carrying its own `tenant` column and a `tool_call_id UNIQUE` key.

[[rule]]
when = ["*"]
attach = ["CLAUDE.md#Where things live"]
why = "a map of where things live in this repo"

[[rule]]
when = ["app/domains/*/tools.py", "app/agent/tools.py"]
attach = [
  "app/domains/support/tools.py::create_ticket",
  "app/domains/support/tools.py::_create_ticket_impl",
  "app/domains/support/tools.py::TOOL_CAPABILITIES",
  "app/agent/tool_idempotency.py::idempotent",
]
why = "reference side-effect tool: ctx check first, then idempotent() keyed by tool_call_id, tier declared in TOOL_CAPABILITIES"

[[rule]]
when = ["app/domains/*/store.py", "app/agent/sql_store.py"]
attach = ["app/domains/support/store.py::create_ticket"]
why = "reference store write: tenant-scoped fixed SQL, ON CONFLICT on tool_call_id, read the existing row back on a replay"

[[rule]]
when = ["postgres-init/*.sql"]
attach = ["postgres-init/15-append-notes-as-rows.sql"]
why = "reference schema: a child table with its own tenant column and tool_call_id TEXT UNIQUE"
