name: CI

# Runs on every push/PR against main. Deliberately does NOT run scripts/eval.py
# here (see README's Troubleshooting / GRAPH_PATTERNS.md) — that harness
# needs the real stack (Ollama models, Qdrant, a warm local model) and is
# meant for a maintainer to run deliberately (`make eval`) before a release,
# not as a per-PR gate against free-tier CI minutes and a cold model. The
# `test` job below is exactly the subset designed to need none of that
# (a fake LLM, no live services — see tests/conftest.py).
#
# `test-integration`/`test-live`/`promptfoo` are the newer, DELIBERATELY
# DIFFERENT tradeoff from scripts/eval.py above: real backends via
# testcontainers (test-integration/test-live) or a small Ollama sidecar
# (promptfoo), but a genuinely SMALL model and a FAST, curated subset each —
# cheap enough to run on every push, unlike eval.py's real release-gating
# CHAT_MODEL and 5-repetitions-per-case statistical gate. See
# GRAPH_PATTERNS.md pattern 48 for the full design writeup, including why
# each of these is a distinct, non-redundant check rather than a smaller
# copy of the others.
#
# `garak` (a raw-model jailbreak/injection scan) is deliberately NOT a CI
# job — `make garak`/`make garak-full` only, the same "maintainer runs this
# deliberately" framing as `make eval` above, not a per-push gate. It found
# real value (see GRAPH_PATTERNS.md pattern 48's disclosed finding on this
# app's small model's own jailbreak resistance) but never gated the build
# even when it did run here — moved to fully manual instead of keeping a
# CI job that was always report-only.
#
# `trivy` (dependency/secret/IaC-misconfig scanning) IS a per-push job below,
# unlike garak — it's fast (no live services, no model) and its findings are
# mostly deterministic given this repo's own lock files. The one thing that
# ISN'T deterministic: Trivy's CVE database updates independently of any
# code change here, so the same commit can start failing this job weeks
# later purely because a new CVE got published against an already-pinned
# dependency — a different, external-state kind of flakiness than garak's
# own reasons for staying manual. Split the difference instead of picking
# one extreme: hard-gate only CRITICAL severity WITH a known fix
# (`ignore-unfixed` drops the ones a version bump can't solve today anyway),
# report everything else (HIGH severity, and Dockerfile/compose
# misconfigurations) to the Security tab instead of failing the build. See
# the `trivy` job's own comments below for the exact policy per step.
#
# `strix` (an autonomous AI pentest agent, https://github.com/usestrix/strix)
# is NOT in this file at all — see .github/workflows/strix.yml, a separate
# workflow_dispatch-only file. It actively attacks whatever target it's
# pointed at using a paid cloud LLM (not this app's local-only Ollama), so
# unlike everything else here it costs real money per run and needs a human
# to deliberately trigger it — the same "maintainer runs this deliberately"
# framing as `make eval`/`make garak-full`/`make deepeval` above, just
# enforced by the trigger type itself rather than by convention/Makefile-only
# placement, since a workflow_dispatch job can't accidentally run on
# somebody else's PR the way a `push`/`pull_request` trigger could.
#
# `semgrep` (SAST over this app's own Python/Dockerfile source) and
# `checkov` (IaC misconfiguration scanning over infra/terraform/**) are per-
# push jobs, same reasoning as `trivy`: no live services, deterministic
# given a commit, cheap enough to gate every push rather than needing a
# human to trigger them. Each hard-gates on any finding — both were run
# against this exact repo state before being wired up here (not guessed):
# semgrep found one real, since-annotated finding (app/api/main.py's
# env-gated CORS wildcard — see its own `nosemgrep` comment for why it's a
# deliberate false positive, not a fix); checkov's only finding
# (CKV_DIO_2, "droplet specifies an SSH key") is a verified static-analysis
# limitation against a required Terraform variable with no default — see
# .checkov.yaml's own comment. Neither job re-scans what `trivy` above
# already covers (Dockerfile/docker-compose misconfig, dependency CVEs,
# secrets) — semgrep's rulesets target source-code patterns trivy's
# scanners don't parse at all, and checkov here is scoped to
# infra/terraform only (see .checkov.yaml), the one IaC surface trivy's
# own filesystem walk has nothing meaningful to say about beyond generic
# misconfig heuristics.
#
# `sonarqube` (self-hosted Community Edition, not SonarCloud — see
# docker-compose.yml's `quality` profile for the same image used
# persistently outside CI) runs its own ephemeral server as a job step
# (same explicit `docker run` sidecar shape this file's `promptfoo` job
# already uses for its own Ollama, not GH Actions' `services:` block or
# testcontainers-python — this server needs to be healthy and have ingested
# the scanner's report before the quality-gate poll makes sense, which a
# plain step-ordered `docker run` guarantees more simply here than
# coordinating around `services:`' own startup-before-any-step ordering).
# Ephemeral means no cross-run history/trend dashboards — a real
# always-on SonarQube server would need its own persistent deployment,
# out of scope here (see infra/README.md) — but static analysis + the
# quality gate itself are still fully real and still hard-gate the build.
#
# All jobs below are independent (no `needs:` edges) and run fully in
# parallel — the point of this whole file's own existence being fast CI, not
# just correct CI.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff==0.16.4
      - run: ruff check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements-lock.txt mypy==2.3.1
      - run: mypy

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements-lock.txt pytest-xdist==3.8.0
      - run: pytest -n auto -q

  test-integration:
    # Real Postgres/Redis/Qdrant via testcontainers (tests/containers.py) —
    # no LLM, so this stays cheap; GH-hosted ubuntu-latest runners already
    # have Docker running, no extra setup step needed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: >
          pip install -r requirements-lock.txt
          pytest-xdist==3.8.0
          "testcontainers[postgres,redis,ollama]==4.9.0"
      # --dist=loadgroup: tests/integration/test_worker_scaling.py's own
      # xdist_group marker needs this to actually take effect (plain `load`
      # ignores it) — forces its 3 heavy real-subprocess tests onto ONE
      # worker so its module-scoped `scaled_stack` fixture (5 real
      # agent_worker.py + uvicorn + fake_llm_server processes) only ever
      # builds once per run, not once per xdist worker that happens to pick
      # up one of its tests. See that module's own comment for the real,
      # reproduced intermittent failure this fixes, not a theoretical one.
      - run: pytest -n auto -m integration -q --dist=loadgroup

  test-live:
    # Real small Ollama model + the full app/agent-worker stack, incl. a
    # Playwright browser E2E (tests/live/, GRAPH_PATTERNS.md pattern 50)
    # and real crawl4ai renders against a real `unclecode/crawl4ai`
    # container (the `crawl` marker, self-provisioned via
    # tests/containers.py::ensure_crawl4ai() same as every other
    # testcontainers-managed dependency in this job, 2026-09-17 —
    # previously its own explicit `docker run` sidecar step below) — the
    # expensive job, so its Ollama model pull is cached across runs (see
    # tests/containers.py's own ensure_ollama docstring for why
    # `ollama_home` makes this possible at all: a stable HOST directory
    # bind-mounted into a fresh container each run).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: >
          pip install -r requirements-lock.txt
          pytest-xdist==3.8.0
          "testcontainers[postgres,redis,ollama]==4.9.0"
          pytest-playwright==0.7.1
      # For this job's OWN `e2e` browser tests (pytest-playwright driving
      # the built-in web UI) — unrelated to crawl4ai (self-provisioned via
      # testcontainers, see above), but this job still needs a real browser
      # itself.
      - run: playwright install --with-deps chromium
      - uses: actions/cache@v4
        with:
          path: ~/.cache/agent-core-demo-ollama-models
          key: ollama-models-${{ runner.os }}-${{ env.TEST_LLM_MODEL }}
        env:
          TEST_LLM_MODEL: qwen2.5:3b
      # TWO separate pytest invocations, not one combined
      # `-m "llm or e2e or crawl"` run — real bug, root-caused live
      # (2026-09-21, after two different attempted fixes elsewhere didn't
      # help): `llm`/`crawl` tests are `async def` (pytest-asyncio-managed),
      # `e2e` tests are plain sync `def` driving pytest-playwright's SYNC
      # API, which runs its own event loop internally. Mixing both kinds
      # under one `-n auto` run lets xdist schedule an `e2e` test and an
      # async test onto the SAME worker process — once that happens,
      # Playwright's own internal event-loop management leaves that
      # worker's asyncio state corrupted for pytest-asyncio's own Runner,
      # and every SUBSEQUENT async test scheduled onto that same worker
      # fails with `RuntimeError: Runner.run() cannot be called from a
      # running event loop` (or its teardown-time sibling) regardless of
      # what it actually tests — reproduced directly, repeatedly, hitting
      # 4-6 completely unrelated tests across different files in a single
      # real run. Two separate invocations guarantee full PROCESS
      # isolation between the two kinds — no worker ever runs both. Both
      # still share the same underlying Postgres/Redis/Qdrant/Ollama
      # containers via tests/containers.py's own cross-invocation cache
      # (that's what it's for); the second invocation pays a modest
      # extra startup cost rebuilding them after the first's teardown,
      # traded for this being a real, direct fix rather than more
      # guesswork at the actual root cause.
      - run: pytest -n auto -m "llm or crawl" -q
        env:
          TEST_LLM_MODEL: qwen2.5:3b
      # No `-n auto` here, deliberately: `real_stack`/`real_stack_with_
      # retrieval` (tests/live/conftest.py) are session-scoped PER XDIST
      # WORKER PROCESS, not shared across workers — under `-n auto`,
      # MULTIPLE workers could each spin up their own `real_stack`
      # instance simultaneously, all pointed at the SAME shared, cached
      # Redis (tests/containers.py's own `_acquire("redis", ...)`),
      # reintroducing the exact cross-worker Streams consumer-group
      # contention `real_stack_with_retrieval`'s own dedicated
      # `_private_redis()` was built to avoid — but `real_stack` itself
      # was never given that same protection, since it was written
      # assuming a single instance ever exists at a time. Caught live
      # testing this same split locally (`-n 4 -m e2e`): all 6 e2e tests
      # failed, several with empty answers and the same "model \"embed\"
      # not found" signature as the original cross-worker bug. `e2e`
      # tests are already this suite's expensive tier (real browser + real
      # inference, only 6 of them) — running them serially sidesteps the
      # whole multi-worker-fixture-instance risk entirely rather than
      # chasing a second fix for it.
      - run: pytest -m e2e -q
        env:
          TEST_LLM_MODEL: qwen2.5:3b

  promptfoo:
    # Black-box prompt regression against the real domain system prompts —
    # a single small Ollama sidecar (GH Actions `services:`, not
    # testcontainers-python: this job is one CLI invocation from one
    # process, not many xdist workers needing programmatic, shared
    # container lifecycle — see GRAPH_PATTERNS.md pattern 48). Node only
    # for promptfoo itself; every other job in this file stays pure Python.
    # Ollama runs as an explicit `docker run` STEP, not GH Actions'
    # `services:` block — verified against GH's own documented behavior
    # that service containers start BEFORE any job step runs, which would
    # make the `actions/cache` restore below (a regular step) powerless to
    # affect a service container's volume mount: the mount would already be
    # in place, from whatever was on disk before the cache restore ever
    # ran. A plain step-ordered `docker run` avoids that entirely.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/agent-core-demo-ollama-models
          key: ollama-models-${{ runner.os }}-${{ env.PROMPTFOO_MODEL }}
        env:
          PROMPTFOO_MODEL: qwen2.5:1.5b
      # Pre-creates the bind-mount SOURCE as the normal `runner` user before
      # `docker run` ever touches it — verified directly this matters: when
      # a bind-mount source doesn't exist yet, `docker run` (root-run
      # daemon, on a real Linux runner — unlike macOS Docker Desktop's VM,
      # where this was never reproducible locally) creates it, along with
      # any missing parent (~/.cache itself, on a cache-miss run), owned by
      # root. That broke `garak`'s own `~/.cache/garak` creation later in
      # THAT job with a plain `PermissionError` — unrelated to this cache
      # path, but the same shared parent directory. Pre-creating this one
      # path is enough: `mkdir -p` makes every ancestor, `~/.cache`
      # included, as `runner`.
      - run: mkdir -p ~/.cache/agent-core-demo-ollama-models
      - run: >
          docker run -d --name ollama -p 11434:11434
          -v ${HOME}/.cache/agent-core-demo-ollama-models:/root/.ollama
          ollama/ollama:latest
      - run: >
          timeout 60 bash -c 'until docker exec ollama ollama list >/dev/null 2>&1; do sleep 1; done'
      # `$PROMPTFOO_MODEL`, not a hardcoded tag — this step used to pull a
      # literal `qwen2.5:1.5b` regardless of what the cache-key/eval-step
      # `env:` blocks below actually asked for, a silent drift trap if the
      # model tag is ever bumped in one of those but not here (Ollama would
      # have the OLD model cached while promptfoo asks for the NEW tag).
      - run: docker exec ollama ollama pull "$PROMPTFOO_MODEL"
        env:
          PROMPTFOO_MODEL: qwen2.5:1.5b
      - run: pip install -r requirements-lock.txt
      # `npm install`, not `npm ci`: package-lock.json's optional-dependency
      # entries (native platform bindings — promptfoo transitively depends
      # on @libsql, which ships one binding package per OS/arch) are a
      # snapshot of whatever platform last ran a full `npm install`, which
      # won't always be this runner's — caught directly in CI as a
      # "libsql binding for linux-x64-gnu is missing" failure from `npm
      # ci`'s strict lockfile-only install (the lockfile here was generated
      # on macOS). `npm install` re-resolves optional deps for the CURRENT
      # platform at install time regardless of what's in the lockfile,
      # trading strict reproducibility (acceptable for a dev-only tool with
      # no runtime footprint in the shipped app) for robustness against
      # exactly this cross-platform mismatch. `--include=optional` is
      # promptfoo's own documented fix for this exact error (still needed
      # even with `npm install`, not just `npm ci` — confirmed directly:
      # plain `npm install` alone still failed the same way on this repo's
      # dependency tree) — see
      # https://www.promptfoo.dev/docs/usage/troubleshooting/#libsql-binding-not-found.
      - run: npm install --include=optional
      - run: python -m promptfoo.dump_prompts
      - run: |
          for domain in support ops sales; do
            npx promptfoo eval --config promptfoo/$domain.yaml
          done
        env:
          PROMPTFOO_MODEL: qwen2.5:1.5b

  deepeval:
    # LLM-judged RAG quality + multi-turn conversation simulation + tool-
    # call trajectory correctness (tests/deepeval/test_rag_quality_deepeval.py,
    # test_conversation_simulator_deepeval.py,
    # test_tool_correctness_deepeval.py, `@pytest.mark.deepeval`) — added
    # 2026-09-16 as a NON-BLOCKING CI signal, not a gate. Every file's
    # `LLMTestCase`/`ConversationalTestCase` are constructed with
    # `flaky=True` (deepeval's own mechanism, confirmed directly in the
    # installed `deepeval==4.2.0` source: a flaky test case's failed metric
    # prints a `warnings.warn(...)` instead of raising `AssertionError`, so
    # the pytest test itself still passes). That's deliberately different
    # from `promptfoo redteam`/`garak`, which stay fully manual
    # (GRAPH_PATTERNS.md pattern 48) — this job CAN still fail red, just
    # only on a genuine crash (an unreachable Ollama, a broken
    # `build_graph()`, an import error), never on the judge disagreeing
    # with itself. Read this job's own log for the printed `reason` fields
    # — a clean pass here is "nothing crashed," not "the judge approved."
    #
    # Testcontainers-python (tests/containers.py's `ensure_ollama`), not the
    # `promptfoo` job's own manual `docker run` sidecar above — these tests
    # go through the `deepeval_ollama` fixture (tests/deepeval/conftest.py),
    # which already drives Ollama that way; same shape `test-live` already
    # uses for its own Ollama fixture, minus the Postgres/Redis/crawl4ai
    # services those tests need but these don't (`build_graph()` with no
    # `checkpointer` argument — both files' own construction — defaults to
    # an in-memory `MemorySaver`, see app/agent/graph_build.py).
    #
    # `DEEPEVAL_MODEL` stays `qwen2.5:3b` here, NOT `TEST_LLM_MODEL`'s
    # CI-speed `1.5b` — this is `make deepeval`'s own local default (see
    # tests/deepeval/conftest.py), kept as-is rather than downgraded for CI
    # speed: it's the TARGET, and a finding needs to be about the model this
    # app actually deploys, not a smaller stand-in (GRAPH_PATTERNS.md
    # pattern 48).
    #
    # UPDATE 2026-09-16: the JUDGE (a separate concern from the target
    # above) moved to Groq's `openai/gpt-oss-120b` — see
    # tests/deepeval/conftest.py's own `DEEPEVAL_JUDGE_MODEL` comment for the
    # full reasoning (the same target/judge split, and same "the local
    # judge was unreliable, a stronger one elsewhere fixes it" pattern,
    # `promptfoo/redteam.yaml`'s move to Gemini already established).
    #
    # UPDATE 2026-09-17: moved again, from Groq to `gemini-3.1-flash-lite`
    # via deepeval's own native `GeminiModel` — the SAME model+key
    # `promptfoo/redteam.yaml`'s `redteam.provider` already uses, so this
    # job now reuses the `GOOGLE_API_KEY` repo secret `redteam.yml` already
    # needs (Settings > Secrets and variables > Actions) instead of a
    # second, Groq-only one. `google-genai` isn't a `deepeval==4.2.0`
    # dependency (same shape as `OllamaModel`'s own `ollama` package below —
    # deepeval declares support for a provider without requiring its SDK),
    # so it's installed as its own step; the `deepeval_judge` fixture
    # itself still fails with a clear message if the key is missing, so no
    # separate pre-check step here the way `.github/workflows/redteam.yml`
    # needed one (that job's failure mode would otherwise be an opaque
    # crash deep inside `npx`, not a pytest fixture that can just say why).
    #
    # UPDATE 2026-09-18, real finding from run 35230147154 (PR #41)'s first
    # real Gemini-judge run, not anticipated in advance: `GOOGLE_API_KEY`
    # above is NOT the only judge key this job needs anymore.
    # `test_conversation_simulator_deepeval.py`'s two tests hard-crashed —
    # `google.genai.errors.ClientError: 400 INVALID_ARGUMENT ... Unknown
    # name "additional_properties" at 'generation_config.response_schema'`
    # — because `KnowledgeRetentionMetric` (deepeval's own
    # `knowledge_retention/schema.py::Knowledge.data:
    # Optional[Dict[str, Union[str, List[str]]]]`) unconditionally requests
    # a Dict-typed structured-output schema, and Gemini's `response_schema`
    # (a restricted OpenAPI-3.0 subset) rejects the `additionalProperties`
    # keyword Pydantic emits for any open-ended `Dict[...]` field —
    # confirmed directly by reading that schema class, not guessed from the
    # error text alone. Not fixable by a generation_kwargs tweak or a
    # smaller/different Gemini model — the Gemini API itself doesn't
    # support this JSON Schema keyword, full stop. So
    # `test_conversation_simulator_deepeval.py` alone keeps its own
    # separate `deepeval_conversation_judge` fixture (Groq's
    # `openai/gpt-oss-120b` again, the SAME provider `deepeval_judge` used
    # before this whole Gemini migration — see that fixture's own
    # docstring in tests/deepeval/conftest.py) for BOTH of its roles
    # (simulating the persona AND grading `KnowledgeRetentionMetric`/
    # `RoleAdherenceMetric`), needing `GROQ_API_KEY` below again — while
    # `test_rag_quality_deepeval.py`/`test_tool_correctness_deepeval.py`
    # stay on Gemini via the shared `deepeval_judge` fixture, since neither
    # of those files' metrics touch a Dict-typed schema. Two judge keys
    # instead of one, but for a real, structural reason, not a preference.
    #
    # UPDATE 2026-09-18, also from that same first real run: the pytest
    # step below used to have NO `shell:` key and a comment here claimed
    # GH Actions' default shell already sets `pipefail` — WRONG, see that
    # step's own comment for the full correction. That bug is why the two
    # crashes above didn't already turn this job red in run 35230147154;
    # `shell: bash` there is the fix, verified against GitHub's own docs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements-lock.txt "testcontainers[postgres,redis,ollama]==4.9.0" ollama==0.6.2
      # deepeval==4.2.0 itself, `--no-deps`: the same click conflict
      # requirements-dev.txt's own comment already discloses for local dev
      # (deepeval declares `click<8.4.0`; huggingface-hub — a real
      # transitive dep via fastembed — declares `click>=8.4.2`), but a HARD
      # one here rather than the "false alarm" that comment describes.
      # requirements-dev.txt gets away with a plain, undecorated `pip
      # install` because it layers onto the UNPINNED requirements.txt,
      # where pip's resolver is free to downgrade huggingface-hub itself to
      # something older that doesn't need click>=8.4.2 at all. This job
      # layers onto requirements-lock.txt instead (like every other job in
      # this file, for reproducibility) — huggingface-hub==1.30.0 there is
      # a hard pin, so no click version can satisfy both sides at once
      # (confirmed directly with `pip install --dry-run` against this exact
      # lockfile). `rich` has the same shape of conflict (deepeval wants
      # <15.0.0, this app is pinned to rich==15.0.0). `--no-deps` skips
      # deepeval's own dependency resolution entirely, so the line below
      # installs ONLY the deepeval-specific packages requirements-lock.txt
      # doesn't already provide (checked by hand against deepeval 4.2.0's
      # full requires_dist) — click/rich/tabulate stay at THIS APP's newer
      # pinned versions rather than deepeval's older declared caps.
      # Verified for real, not assumed: a clean `import deepeval` (plus
      # every deepeval symbol this repo's own tests/deepeval/*.py
      # files import) and a full `pytest -m deepeval --collect-only` both
      # succeed against this exact combination in an isolated venv built
      # from this same lockfile.
      - run: pip install --no-deps deepeval==4.2.0
      - run: pip install nest_asyncio posthog pyfiglet pytest-asyncio pytest-repeat pytest-rerunfailures pytest-xdist questionary "tabulate<0.10.0"
      # `deepeval_judge`'s GeminiModel (tests/deepeval/conftest.py) needs
      # google-genai — same "--no-deps, add the one real transitive dep by
      # hand" shape as deepeval==4.2.0 above, and the SAME conflict class:
      # google-genai==2.24.0 declares `websockets<17.0`, this lockfile pins
      # `websockets==17.1`. Verified directly this is another false alarm,
      # not a real break: GeminiModel.generate()/a_generate() only ever
      # call client.models.generate_content()/client.aio.models.generate_content()
      # (a plain HTTPS request), never the Live API — the only thing in the
      # SDK that actually touches the websockets package. A clean `import
      # google.genai` plus `genai.Client(api_key=...)` both succeed against
      # this exact websockets==17.1 in an isolated venv. google-auth is the
      # one real runtime dep --no-deps skips (needed at import time, not
      # just for Vertex AI auth) — installed with its own normal resolver
      # pass since, unlike google-genai, it has no version conflict against
      # this lockfile (its only non-extra requirements, pyasn1-modules and
      # cryptography>=38.0.3, are either already satisfied or newly added
      # with no downgrade needed).
      - run: pip install --no-deps google-genai==2.24.0
      - run: pip install google-auth==2.58.0
      - uses: actions/cache@v4
        with:
          path: ~/.cache/agent-core-demo-ollama-models
          key: ollama-models-${{ runner.os }}-${{ env.DEEPEVAL_MODEL }}
        env:
          DEEPEVAL_MODEL: qwen2.5:3b
      # test_tool_correctness_deepeval.py::test_fetch_external_reference_tool_call_is_correct_and_well_argued
      # is this job's only test that needs a real crawl4ai server — its own
      # `_use_crawl4ai_server` fixture self-provisions one via
      # tests/containers.py::ensure_crawl4ai() (2026-09-17, same
      # testcontainers-managed pattern `test-live` uses above, replacing
      # what used to be this job's own explicit `docker run` sidecar step)
      # — see that fixture's own docstring for why the test deliberately
      # does NOT carry `@pytest.mark.crawl`, unlike every other
      # real-crawl4ai test in this repo (that mark would pull it into
      # test-live's own selection instead, a real CI job this test can't
      # run under since test-live never installs the `deepeval` package).
      # Every other test this job runs neither needs nor starts this
      # container — `ensure_crawl4ai()` is only called when that one
      # fixture is actually requested.
      # `-v` on top of this file's usual `-q -s`: deepeval's own per-metric
      # score/reason text only prints with -s (no capture) regardless, but
      # -v makes sure the test's own pass/fail line isn't swallowed by -q's
      # one-dot-per-test default in the saved log below. `tee`, not a plain
      # redirect — still shows live in the job's own log too, not hidden
      # until the artifact is downloaded.
      #
      # FIX 2026-09-18, a real bug caught by a real run, not a hypothetical:
      # this step used to have NO `shell:` key, and a comment here claimed
      # GH Actions' default `run:` shell already sets `pipefail`. That claim
      # was wrong — checked directly against GitHub's own docs (Workflow
      # syntax > "Exit codes and error action preference"): an UNSPECIFIED
      # shell on Linux runs `bash -e {0}`, NOT `bash --noprofile --norc -eo
      # pipefail {0}` — pipefail is only added when a step spells out
      # `shell: bash` explicitly, which this one never did. Caught live in
      # run 35230147154 (PR #41): pytest itself printed "3 failed, 7
      # passed" in this exact step's own log, yet the step — and the whole
      # job — reported success, because `tee`'s exit code (0), not
      # pytest's, is what an `-e`-only shell without pipefail propagates.
      # That silently defeated this job's own stated design (see this job's
      # top-level comment: "CAN still fail red... on a genuine crash").
      # `shell: bash` below is the actual fix — not a manual `set -o
      # pipefail` line, which would work too but only by accident of this
      # being the first command in the step; `shell: bash` is what GitHub's
      # own docs name as the supported way to opt into pipefail at all.
      #
      # `tests/deepeval` (2026-09-17) — a real, disclosed noise finding,
      # not a style preference: without a path argument, `-m deepeval`
      # still COLLECTS (imports) every file under `testpaths = ["tests"]`
      # before filtering by marker, and `tests/api/test_api.py`/
      # `test_health.py`/`test_rate_limit.py`/`tests/agent/test_multimodal.py`
      # import `app.api.main` at module level — which calls
      # `configure_logging()` UNCONDITIONALLY at import time (unlike
      # `app/job_queue/agent_worker.py`'s/`app/channels/telegram.py`'s own
      # `if __name__ == "__main__":`-gated calls, deliberately different
      # since uvicorn imports `app.api.main:app` without ever hitting
      # `__main__` — see that module's own comment). That installs a real
      # INFO-level structlog JSON handler on the ROOT logger for the rest
      # of this single, non-`-n auto` process — verified directly: `import
      # app.api.main` alone in a fresh interpreter flips
      # `logging.getLogger().handlers` from `[]` to a live handler and the
      # level from WARNING to INFO, with zero such effect from importing
      # only `app.agent.graph_build`/`app.ingestion.web_crawler`/
      # `tests.conftest` (everything the deepeval tests themselves actually
      # need). With `-s` disabling capture, every one of this app's own
      # per-node `logger.info(...)` calls (and the `openai` SDK's own
      # internal retry-logging, silent by default at the stdlib root
      # logger's normal WARNING level) then floods stdout for all ~5+
      # minutes of every real graph turn, in ten tests. Restricting
      # collection to `tests/deepeval` — the package these three files
      # actually live in since today's reorg — avoids ever importing the
      # unrelated api/multimodal test modules in the first place; verified
      # this still collects the identical 10 tests (`--collect-only -q -m
      # deepeval tests/deepeval`).
      #
      # `--reruns 2 --reruns-delay 10 --only-rerun ...` (2026-09-18): added
      # after run 35257765470 (PR #41, right after the `shell: bash` fix
      # above started actually surfacing real failures) turned red on
      # `google.genai.errors.ServerError: 503 UNAVAILABLE ... currently
      # experiencing high demand` — transient free-tier overload, the same
      # class of variability `.github/workflows/redteam.yml`'s own header
      # comment already discloses for this exact model, not a code defect.
      # `pytest-rerunfailures` was already installed (see the pip install
      # above) but never actually invoked until now. Deliberately scoped
      # with `--only-rerun` rather than a blanket "retry any failure" —
      # blindly retrying would blur this job's own stated promise ("CAN
      # still fail red... on a genuine crash"): a REAL crash (a broken
      # `build_graph()`, an auth failure, the Gemini schema bug fixed
      # above if it ever regressed) should still turn the job red on the
      # first try, not get silently swallowed by burning through retries
      # first. The regex only matches known-transient server/rate-limit
      # signatures from either judge SDK: Gemini's own
      # `google.genai.errors.ServerError`/`UNAVAILABLE`/
      # `RESOURCE_EXHAUSTED`/`DEADLINE_EXCEEDED`, and the `openai` SDK
      # Groq's `LocalModel` uses (`RateLimitError`/`APITimeoutError`/
      # `APIConnectionError`/`InternalServerError`) — matched against each
      # failure's own exception text, confirmed directly in
      # pytest-rerunfailures==16.6's own `--help` output for what
      # `--only-rerun` matches against.
      - run: >
          pytest -m deepeval -q -s -v --reruns 2 --reruns-delay 10
          --only-rerun "(ServerError|UNAVAILABLE|RESOURCE_EXHAUSTED|DEADLINE_EXCEEDED|RateLimitError|APITimeoutError|APIConnectionError|InternalServerError)"
          tests/deepeval 2>&1 | tee deepeval-results.log
        shell: bash
        env:
          DEEPEVAL_MODEL: qwen2.5:3b
          DEEPEVAL_TELEMETRY_OPT_OUT: "1"
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          # Optional — see tests/deepeval/conftest.py's `_with_optional_backup`
          # and .env.example's own PLUGSKY_API_KEY comment. Empty/unset here
          # (no repo secret configured) is a no-op: both judge fixtures fall
          # back to their pre-existing GOOGLE_API_KEY/GROQ_API_KEY-only behavior.
          PLUGSKY_API_KEY: ${{ secrets.PLUGSKY_API_KEY }}
      - name: Upload deepeval results (score/reason fields, read by hand — same posture as redteam.yml's own artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deepeval-results-${{ github.run_id }}
          path: deepeval-results.log
          retention-days: 30
          if-no-files-found: warn

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t agent-core-demo:ci .

  trivy:
    # See this file's own header comment for the hard-gate-CRITICAL-only,
    # report-the-rest policy this job implements. `scan-type: fs` over `.`
    # already covers dependency vulns, leaked secrets, AND Dockerfile/
    # docker-compose*.yml misconfiguration in one pass (Trivy's `misconfig`
    # scanner walks the whole tree for IaC files, not just a named target)
    # — a separate `scan-type: config` step would just repeat that same
    # file walk.
    #
    # TRIVY_FILE_PATTERNS below points Trivy's pip analyzer at
    # requirements-lock.txt specifically, overriding its own default
    # (requirements.txt) — verified directly this matters:
    # requirements.txt's version RANGES (`langgraph>=0.2.20,<0.3`) don't
    # resolve to one installed version to check against the CVE database,
    # so scanning it alone silently finds nothing. Scanning the
    # exact-pinned lock file — what the Dockerfile/this repo's own CI jobs
    # above actually install, per requirements-lock.txt's own header —
    # surfaced 5 real HIGH-severity fixable CVEs the first time this job
    # was run locally, including an RCE in langgraph-checkpoint
    # (CVE-2025-64439). None hit CRITICAL, so this job's own hard gate
    # (below) doesn't fail the build on them, but they DO land in the
    # Security tab via the report step — see this repo's own disclosed
    # pin-compatibility constraints (garak/requirements-garak.txt) before
    # bumping any of these.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      # infra/terraform excluded below: Checkov (the `checkov` job,
      # .checkov.yaml) owns IaC misconfig scanning for that directory —
      # verified directly this exclusion is needed, not preemptive: Trivy's
      # own DigitalOcean firewall policies (DIG-0001/DIG-0003) flag ANY
      # 0.0.0.0/0 rule as CRITICAL with no way to distinguish a public web
      # app's necessary 80/443 ingress + broad egress (GHCR, apt, Let's
      # Encrypt, the LLM API, ...) from an actually-dangerous open SSH/DB
      # port, unlike Checkov which has no equivalent blanket check here
      # (confirmed empirically: a real checkov run against this exact
      # firewall resource passes clean).
      - name: Trivy fs — hard gate (fixable CRITICAL vulns + secrets + IaC misconfig)
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_FILE_PATTERNS: 'pip:requirements-lock\.txt$'
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          skip-dirs: .venv,node_modules,.mypy_cache,.ruff_cache,.pytest_cache,infra/terraform

      - name: Trivy fs — full report (HIGH+CRITICAL, incl. unfixed) → SARIF
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_FILE_PATTERNS: 'pip:requirements-lock\.txt$'
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy-fs-results.sarif
          exit-code: "0"
          skip-dirs: .venv,node_modules,.mypy_cache,.ruff_cache,.pytest_cache,infra/terraform
          skip-setup-trivy: true

      - name: Upload fs report to the Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-fs-results.sarif
          category: trivy-fs
        continue-on-error: true # code scanning may not be enabled on this repo/plan

      # A separate image scan (not just fs above) because it's the only way
      # to see vulnerabilities in the built image's actual OS layer
      # (python:3.13-slim's own packages, libgomp1 — see Dockerfile) on top
      # of the same Python dependencies fs already covers. `if: always()`
      # from here down: the fs hard-gate step above can fail this job
      # already, but the image scan/report should still run and get
      # reported rather than being silently skipped (GitHub Actions' own
      # default) just because an earlier, unrelated step failed.
      - name: Build image
        if: always()
        run: docker build -t agent-core-demo:trivy .

      - name: Trivy image — hard gate (fixable CRITICAL vulns)
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: agent-core-demo:trivy
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          skip-setup-trivy: true

      - name: Trivy image — full report (HIGH+CRITICAL, incl. unfixed) → SARIF
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: agent-core-demo:trivy
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy-image-results.sarif
          exit-code: "0"
          skip-setup-trivy: true

      - name: Upload image report to the Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-image-results.sarif
          category: trivy-image
        continue-on-error: true

  semgrep:
    # See this file's own header comment for the "distinct, non-redundant
    # with trivy" reasoning. Rulesets are Semgrep's free, no-login registry
    # configs (`p/security-audit`, `p/secrets`, `p/python`, `p/dockerfile`)
    # — verified directly these need no `semgrep login`/SEMGREP_APP_TOKEN.
    # `--error` is what actually makes a blocking finding fail the step;
    # verified directly semgrep's own default exit code is 0 even WITH
    # findings otherwise. A second, always-run pass emits SARIF regardless
    # of whether the gate step failed, same "gate + always-report" shape as
    # the `trivy` job above.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install semgrep==1.177.0

      - name: Semgrep — hard gate
        run: >
          semgrep scan --error --metrics=off
          --config p/security-audit --config p/secrets --config p/python --config p/dockerfile
          app/ scripts/ docker/ Dockerfile

      - name: Semgrep — SARIF report
        if: always()
        run: >
          semgrep scan --metrics=off
          --config p/security-audit --config p/secrets --config p/python --config p/dockerfile
          --sarif --output semgrep-results.sarif
          app/ scripts/ docker/ Dockerfile

      - name: Upload report to the Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep-results.sarif
          category: semgrep
        continue-on-error: true

  checkov:
    # Scoped to infra/terraform only — see .checkov.yaml's own header on why
    # this doesn't re-cover Dockerfile/docker-compose (trivy's job already
    # does). .checkov.yaml's one skip-check (CKV_DIO_2) is a verified false
    # positive, not a suppressed real finding — see that file's comment.
    # Checkov's own default exit code already fails on any un-skipped
    # failed check, so no extra `--hard-fail-on` flag is needed for the
    # gate; SARIF still gets uploaded on failure via `if: always()`.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install checkov==3.3.17

      - name: Checkov — hard gate
        run: checkov --config-file .checkov.yaml

      - name: Checkov — SARIF report
        if: always()
        run: checkov --config-file .checkov.yaml --output sarif --output-file-path . --soft-fail

      - name: Upload report to the Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results_sarif.sarif
          category: checkov
        continue-on-error: true

  sonarqube:
    # Self-hosted SonarQube Community Edition (not SonarCloud) — an
    # EPHEMERAL server started as a job step, same explicit `docker run`
    # sidecar shape this file's `test-live`/`promptfoo` jobs already use for
    # Ollama (not GH Actions' `services:` block or testcontainers-python —
    # this server needs to be healthy, and later have ingested the scan report, before the
    # next step touches it, which a plain step-ordered `docker run`
    # guarantees more simply than coordinating around `services:`' own
    # start-before-any-step ordering). Ephemeral means no cross-run
    # history/trend dashboards — a persistent server is a separate,
    # deliberately out-of-scope deployment (see infra/README.md) — but the
    # static analysis and quality gate below are still fully real and still
    # hard-gate the build.
    #
    # Every command below was verified directly against a real SonarQube
    # 26.x Community Edition container before being wired up here, not
    # assumed from docs: the default admin/admin credentials DO work for
    # token generation + analysis submission with no forced password-reset
    # blocking it (only the web UI nags about it); `-Dsonar.qualitygate.wait
    # =true` makes the scanner's OWN process block on and fail on a failed
    # gate (confirmed both a PASSED run's exit 0 and that the flag isn't a
    # no-op) — no extra polling script or third-party Action needed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the SCM Publisher sensor wants real git blame history, not a shallow clone

      - run: docker run -d --name sonarqube -p 9000:9000 sonarqube:community # 26.x Community Edition — the version this job's whole recipe was verified against

      - name: Wait for SonarQube to be ready
        run: >
          timeout 120 bash -c
          'until curl -sf http://localhost:9000/api/system/status | grep -q "\"status\":\"UP\""; do sleep 5; done'

      - name: Generate a scanner token
        run: |
          token=$(curl -sf -u admin:admin -X POST "http://localhost:9000/api/user_tokens/generate" -d "name=ci-${GITHUB_RUN_ID}" \
            | python3 -c "import json,sys; print(json.load(sys.stdin)['token'])")
          echo "::add-mask::$token"
          echo "SONAR_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Scan and wait for the quality gate
        env:
          SONAR_HOST_URL: http://localhost:9000
        run: >
          docker run --rm --network host
          -e SONAR_HOST_URL -e SONAR_TOKEN
          -v ${{ github.workspace }}:/usr/src -w /usr/src
          sonarsource/sonar-scanner-cli@sha256:23ca0f137965d9dff2198074043fd48d386280bc5d0ccac8c8349cea4cf096a9
          -Dsonar.qualitygate.wait=true -Dsonar.qualitygate.timeout=300
